<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#25203c"><title>Conveyor House · Office simulation</title><style>*{box-sizing:border-box} :root{--ink:#29253b;--muted:#646075;--purple:#6245b4;--line:#dedbe6;--mono:"IBM Plex Mono",ui-monospace,monospace}body{margin:0;background:#f6f5f9;color:var(--ink);font:16px Inter,"Helvetica Neue",Arial,sans-serif}button,select,input{font:inherit;color:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer;border:0;background:none}button:hover{filter:brightness(.94)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #986bfc;outline-offset:2px}header{height:65px;background:#272139;color:#fff;display:flex;align-items:center;padding:0 max(3.2vw,18px);gap:20px}.brand{color:white;text-decoration:none;font-size:21px;letter-spacing:-.9px;font-weight:750;display:flex;align-items:center;gap:11px}.logomark{width:29px;height:30px;display:flex;align-items:center;gap:2px;transform:skewY(-25deg)}.logomark i{display:block;width:8px;background:#b3ed88;height:19px;border-radius:2px}.logomark i:nth-child(2){height:28px}.logomark i:nth-child(3){height:23px}.brandline{height:22px;border-left:1px solid #575064}.studio{font-size:14px;color:#d8d3e5}.headerRight{margin-left:auto;display:flex;align-items:center;gap:18px}.live,.viewtag{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}.live b,.viewtag b{width:8px;height:8px;background:#b5e98b;border-radius:50%}.help{border:1px solid #6d667c;color:#f5f2fa;border-radius:100%;width:24px;height:24px;font-weight:700}.live{color:#d5efbc}main{max-width:1800px;margin:auto;padding:24px 3.2vw}.heading,.maphead,.feedhead,.drawhead,.panelhead,.camera,.playcontrols,.floors{display:flex;align-items:center}.heading{justify-content:space-between;gap:10px;margin-bottom:18px}.eyebrow{font:600 11px/1.5 var(--mono);letter-spacing:1.35px;color:#686079}.eyebrow b{color:var(--purple)}.eyebrow span{margin:0 6px;color:#a39aaf}h1,h2,h3,p{margin:0}h1{font-size:clamp(32px,3.2vw,52px);line-height:1.1;letter-spacing:-2px;margin-top:4px}h1 span{color:#9269db}.inbox,.primary{background:#6044a8;color:white;border-radius:10px;display:inline-flex;gap:10px;align-items:center;font-weight:650;padding:12px 16px;font-size:14px}.inbox strong{background:#f0dfae;color:#3c3045;border-radius:5px;min-width:21px;text-align:center;padding:2px}svg{width:19px;height:19px;display:block}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,23%);gap:16px}.viewcard,.roster,.feed{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #36295906}.viewcard{display:flex;flex-direction:column}.maphead{height:47px;flex:none;padding:0 16px;justify-content:space-between}.maptitle{display:flex;align-items:center;gap:8px;font-size:15px}.maptitle i,.feedhead>i{color:var(--purple)}.playcontrols{gap:1px;background:#f3f1f7;border:1px solid var(--line);border-radius:7px}.playcontrols button{min-width:33px;height:27px;display:grid;place-content:center;font-size:13px;font-weight:700}.playcontrols svg{width:14px;height:14px}#viewport{height:clamp(430px,57vh,790px);position:relative;isolation:isolate;background:#ded9ee;overflow:hidden}#world{position:absolute;inset:0}#world canvas{display:block}.viewtag,.camera{background:#fffffff0;border:1px solid #ffffffc9;box-shadow:0 2px 8px #31204618;border-radius:8px;position:absolute;z-index:2}.viewtag{left:14px;top:13px;padding:7px 10px;font:600 11px var(--mono);pointer-events:none}.viewtag b{background:#7964a8}.camera{right:13px;bottom:13px;padding:2px}.camera button{width:31px;height:30px;font-size:20px}.camera span{height:17px;border-left:1px solid var(--line)}.floors{padding:9px 10px;gap:4px;overflow-x:auto;min-height:49px}.floors button{white-space:nowrap;border-radius:7px;padding:7px 9px;font-size:13px;font-weight:600;color:var(--muted)}.floors button.active{background:#ede7fd;color:#5940a4}.roster{display:flex;flex-direction:column}.panelhead{padding:16px 17px 13px;position:relative;display:block;border-bottom:1px solid var(--line)}h2{font-size:20px;letter-spacing:-.65px}.panelhead h2{margin-top:2px}.panelhead>span{position:absolute;right:16px;bottom:15px;color:var(--muted);font:12px var(--mono)}.agentlist{overflow:auto;flex:1;max-height:calc(clamp(430px,57vh,790px) + 18px)}.person{width:100%;display:flex;gap:10px;text-align:left;align-items:center;padding:12px 14px;border-bottom:1px solid #ece9f1;background:white}.person:hover{background:#f5f1fc}.photo{width:44px;height:47px;object-fit:cover;border-radius:10px;background:#e9dff4;flex:none}.person .who{min-width:0;flex:1}.who b,.who small,.who em{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who b{font-size:15px;letter-spacing:-.25px}.who small{font-size:13px;color:#65547b;margin:2px 0}.who em{font-size:12px;font-style:normal;color:#6d6875}.attention{color:#855514;background:#fff0bc;padding:3px 7px;border-radius:5px;font-weight:bold}.feed{margin-top:16px}.feedhead{gap:9px;padding:13px 17px;border-bottom:1px solid #eeeaf3}.feedhead h2{font-size:17px}.feedhead button{margin-left:auto;font-size:13px;color:#625078;font-weight:600}#events{display:grid;grid-template-columns:repeat(3,1fr)}.event{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;text-align:left;min-width:0}.event+.event{border-left:1px solid var(--line)}.event img{width:32px;height:35px;border-radius:7px}.event p{font-size:13px;line-height:1.45}.event time{display:block;font:11px var(--mono);color:#777082;margin-bottom:3px}dialog{border:0;color:var(--ink);padding:0;max-height:88dvh;width:min(460px,94vw);border-radius:18px;box-shadow:0 24px 90px #25183c55}dialog::backdrop{background:#22163552;backdrop-filter:blur(2px)}.drawhead{position:sticky;top:0;padding:12px 19px;background:white;border-bottom:1px solid var(--line);z-index:1;justify-content:space-between}.drawhead button{font-size:24px}.drawhead+div{padding:20px}#content h2{font-size:26px}#content h3{font-size:16px;margin:16px 0 6px}#content p{font-size:15px;line-height:1.5;color:#504858;margin:5px 0}#content .hero{display:flex;align-items:center;gap:14px}.hero img{width:73px;height:79px;border-radius:13px}.meta{font:12px var(--mono);color:#72677e}.req,.info{background:#f7f5fb;border:1px solid #e2ddeb;border-radius:11px;padding:14px;margin-top:12px}.req h3:first-child{margin-top:0}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}.row button,.secondary,.row select{background:white;border:1px solid #c9bddc;border-radius:7px;padding:7px 10px;font-size:14px}.row button:first-child,.row .send{background:#65509f;color:white}.row input{min-width:80px;flex:1;padding:8px;border:1px solid #c9bddc;border-radius:7px}.row select{max-width:70%}.talk{padding:10px;border-left:3px solid #ad95df;background:#f6f1fc;margin:8px 0}.talk small{font-weight:700;color:#695384}.source{color:var(--purple)}#notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#30233f;color:white;padding:10px 16px;border-radius:9px;pointer-events:none;opacity:0;z-index:20}#notice.show{opacity:1}.empty{padding:22px}.steps li{margin:8px 0;line-height:1.45}@media(min-width:1600px){.person{padding:15px}.photo{width:52px;height:54px}}@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr) 235px;gap:9px}.person{padding:10px 8px;gap:7px}.floors button{padding:7px}.studio,.brandline{display:none}}@media(max-width:700px){main{padding:16px 10px}.layout{display:block}.heading{margin-bottom:13px}.inbox{font-size:13px;padding:9px;gap:5px}.brand{font-size:18px}header{height:53px}.headerRight{gap:9px}.roster{margin-top:12px}.agentlist{max-height:260px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.panelhead{padding:10px 14px}.panelhead .eyebrow{display:none}.panelhead>span{bottom:13px}#viewport{height:clamp(340px,65vw,430px)}#events{grid-template-columns:1fr}.event+.event{border-left:0;border-top:1px solid var(--line)}.photo{width:35px;height:40px}.attention{padding:3px}.heading .eyebrow{font-size:9px}.live{font-size:11px}.floors{gap:0}.feed{margin-top:12px}}
.timebar{display:flex;align-items:center;gap:12px}#clock{font:12px var(--mono);color:#62586e}
</style></head><body>
<header><a href="#" class="brand" aria-label="Conveyor House home"><span class="logomark"><i></i><i></i><i></i></span>Conveyor House</a><span class="brandline"></span><span class="studio">Simulation studio</span><div class="headerRight"><span class="live"><b></b> <span id="liveLabel">Live simulation</span></span><button class="help" title="Simulation guide" aria-label="Simulation guide" data-action="guide">?</button></div></header>
<main><section class="heading"><div><div class="eyebrow"><b>WORKSPACE</b> <span>/</span> CLAIMS MODERNISATION</div><h1>Office overview<span>.</span></h1></div><button class="inbox" data-action="inbox"><i data-icon="inbox"></i> Decision inbox <strong id="pending">0</strong></button></section>
<div class="layout"><section class="viewcard"><div class="maphead"><div class="maptitle"><i data-icon="layers"></i><b>Campus view</b></div><div class="timebar"><span id="clock"></span><div class="playcontrols"><button id="pause" data-action="pause" title="Pause simulation" aria-label="Pause simulation"></button><button id="speed" data-action="speed" title="Simulation speed">1×</button><button data-action="step" aria-label="Advance one simulation minute" title="Advance one simulation minute">▸│</button></div></div></div>
<div id="viewport"><div id="world"></div><div class="viewtag"><b></b><span id="viewname">Campus overview</span></div><div class="camera"><button data-action="left" aria-label="Rotate left" title="Rotate left">↶</button><button data-action="right" aria-label="Rotate right" title="Rotate right">↷</button><span></span><button data-action="plus" aria-label="Zoom in">+</button><button data-action="minus" aria-label="Zoom out">−</button></div></div>
<div class="floors" id="floors"></div></section>
<aside class="roster"><div class="panelhead"><div class="eyebrow">PERSONNEL</div><h2>Agent directory</h2><span id="agentCount"></span></div><div class="agentlist" id="agents"></div></aside></div>
<section class="feed"><div class="feedhead"><i data-icon="pulse"></i><h2>Activity feed</h2><button data-action="history">View history <span>↗</span></button></div><div id="events"></div></section>
</main><dialog id="drawer"><div class="drawhead"><span class="eyebrow" id="drawLabel"></span><button data-action="close" aria-label="Close panel">×</button></div><div id="content"></div></dialog><div id="notice" role="status"></div><script>/* Fictional claims programme. Policy and work transitions follow SPEC_V2 §§6, 8, 9, 11. */
(() => {
  "use strict";
  const roster = [
    ["sponsor","Iris Vale","Portfolio sponsor","F4","#ca8751","Reviewing tranche benefits","Tranche T1 funds a pilot for household claims. The benefit owner measures elapsed time from intake to a complete evidence file. Baseline 48 hours, target 24 hours.","BEN-02 · Benefit profile"],
    ["architect","Mara Chen","Architect","F3","#8874df","Reviewing the delivery contract","I traced the delivery contract to the approved application/data matrix. Each claim needs a source receipt, retention class and named claims owner before handoff.","AC-14 · Delivery contract"],
    ["pm","Theo Brooks","Project manager","F2","#5096d9","Sequencing the intake pilot","WBS 2.1 covers receipt retrieval, field validation and an independent sample review. Each work package binds a delivery role, an input and acceptance evidence.","WBS 2.1 · Intake pilot"],
    ["coach","Nia Okafor","Kanban coach","F2","#45a998","Watching the intake queue","I watch failed attempts and repeated signatures. One interruption opens one coach card. I can triage, apply a bounded remedy or escalate to a person.","FC-12 · Flow board"],
    ["kata","Emi Sato","Kata manager","K","#e881ac","Inspecting earlier receipt failures","The improvement tenant owns the experiment. Its frozen instrument and held-out claims stay independent of the procedure I change.","K-07 · Improvement record"],
    ["engineer","Jules Mercer","Delivery engineer","F1","#d78a55","Preparing the intake workstation","My delivery card calls the document service through a pinned binding, attaches its receipt and records the evidence link at handoff.","WP-42 · Intake adapter"],
    ["verifier","Sofia Reyes","Verification analyst","F1","#69a79a","Preparing the held-out sample","I run an independent receipt check against 20 held-out claims. Evidence includes the instrument version, denominators and raw outcomes.","EV-03 · Receipt benchmark"],
    ["librarian","Arun Shah","Knowledge steward","S","#738bcc","Locating the approved schema","The tool broker reaches the knowledge service through a scoped binding. I can retrieve the approved schema, its version and the evidence reference.","KB-08 · Schema binding"]
  ];
  const agents = roster.map(([id,name,role,floor,color,task,detail,artifact]) => ({id,name,role,floor,color,task,status:"Working",detail,artifact}));
  const agent = id => agents.find(item => item.id === id);
  const requests = [], events = [], work = [];
  let tick, serial, turn, phase, remaining, schemaReady, contractReady, schemaVersion, adoptionOutcome;
  const clock = () => {
    const minutes = 9*60 + 40 + tick;
    return String(Math.floor(minutes / 60)%24).padStart(2,"0") + ":" + String(minutes%60).padStart(2,"0");
  };
  function log(agentId,text) {
    events.unshift({id:"E"+(++serial),time:clock(),agentId,text});
    if(events.length>120) events.pop();
  }
  function setAgent(id,task,status,artifact) {
    Object.assign(agent(id),{task,status});
    if (artifact) agent(id).artifact = artifact;
  }
  const gates = {
    design:["architect","Approve the delivery contract","AC-14 fixes the receipt schema and requires one source receipt per claim. The pilot cannot pass design until its contract is live.","Approval",["Approve contract","Request revision"],["verifier","librarian"],"AC-14"],
    schema:["engineer","Which receipt schema applies?","Two receipts in the archive use different field names. Identify the production schema for tranche T1, or appoint the knowledge steward to trace the approved binding.","Question",["Use approved schema v3","Use v2 compatibility mapping"],["librarian","architect"],"WP-42"],
    baseline:["pm","Authorize the pilot baseline","WBS 2.1 assigns retrieval to delivery and acceptance to verification. Approve a 20-claim pilot with a two-card WIP cap, or return it for a smaller first batch.","Approval",["Approve baseline","Revise first batch"],["architect","coach"],"BL-08"],
    repeat:["coach","Resolve a repeated receipt failure","WP-42 blocked twice with the same missing-receipt signature. The retry allowance is exhausted. Decide whether to route the affected claims to manual review or hold the entire batch for a controlled replay.","Question",["Route exceptions to manual review","Hold batch for controlled replay"],["engineer","verifier","architect"],"FC-12"],
    adoption:["kata","Adopt the receipt preflight?","The frozen EV-03/v1 check recorded 4 missing receipts in 20 held-out cases before the change and 0 in the same 20 after it. The pre-registered threshold was at most 1 in 20. Approve publication of procedure v4 or retain v3 and archive the experiment.","Approval",["Adopt procedure v4","Retain procedure v3"],["verifier","pm"],"K-07"],
    spread:["kata","Extend preflight to another team?","Get to Stretch · Motor claims uses a separate procedure binding. Its target owner must authorize a trial. Approve a target-specific trial with EV-03 monitoring, or keep the improvement local to household claims.","Approval",["Authorize motor-claims trial","Keep household scope"],["verifier","sponsor"],"YK-01"],
    closure:["pm","Accept the pilot closure record","The independent acceptance record, work-package output and remaining operational actions are attached. Iris owns the post-pilot benefit measurement. Close this pilot or request a revised handover.","Approval",["Accept closure","Revise handover"],["sponsor","verifier"],"CL-02"]
  };
  function open(key,suffix="") {
    const [agentId,title,body,type,options,delegates,artifact]=gates[key];
    const request={id:key+"-"+(++serial),key,agentId,title,body:body+suffix,type,status:"open",options:[...options],delegates:[...delegates],artifact,assignee:null};
    requests.unshift(request);
    setAgent(agentId,title,type==="Question"?"Needs input":"Awaiting approval");
    log(agentId,title+" · "+artifact);
    return request;
  }
  const transition=(next,delay=2)=>{phase=next; remaining=delay;};
  const handoff=(from,to,card,input)=> {
    work.push({from,to,card,input,time:clock()});
    log(from,agent(from).name+" assigned "+card+" to "+agent(to).name+" with "+input+".");
  };
  function openBaseline() {
    if (contractReady && schemaReady && phase==="design") {
      handoff("architect","pm","BL-08","AC-14 and "+schemaVersion);
      phase="baseline"; open("baseline");
    }
  }
  function resolve(r,answer,actor) {
    r.status="resolved"; r.result=answer; r.resolvedBy=actor;
    setAgent(r.agentId,"Recording "+r.artifact+" decision","Working");
    log(actor==="user"?r.agentId:actor,(actor==="user"?"You":agent(actor).name)+" decided · "+answer);
    const first=answer===r.options[0];
    switch(r.key) {
      case "design":
        if (!first) {transition("reviseDesign"); setAgent("architect","Revising the scope boundary","Revising"); break;}
        contractReady=true; setAgent("architect","Tracing AC-14 to the intake package","Working"); openBaseline(); break;
      case "schema":
        schemaReady=true; schemaVersion=answer; setAgent("engineer","Pinning the intake schema mapping","Working"); openBaseline(); break;
      case "baseline":
        if (!first) {transition("reviseBaseline"); setAgent("pm","Reducing the first delivery batch","Revising"); break;}
        handoff("pm","engineer","WP-42","approved BL-08 and AC-14");setAgent("engineer","Running receipt retrieval via tool broker","Executing");transition("firstFault");break;
      case "repeat":
        handoff("coach","engineer","WP-42",answer);
        setAgent("engineer",first?"Sending exceptions to the manual-review queue":"Replaying the held batch with a receipt check","Executing");
        handoff("coach","kata","K-07","two failed attempts and one repeated signature");
        setAgent("kata","Go to See · observing two failed attempts","Observing");
        transition("grasp");break;
      case "adoption":
        adoptionOutcome=first?"Procedure v4 adopted":"Procedure v3 retained";
        setAgent("kata",first?"Recording publication and regression monitoring":"Archiving the candidate and its evidence",first?"Monitoring":"Archived");
        log("kata",first?"Receipt preflight v4 published in the simulation. Monitoring is assigned to verification.":"Candidate archived. The pilot keeps its exception handling and procedure v3.");
        if (first) {
          setAgent("kata","Get to Standardization · releasing the approved procedure","Publishing");
          transition("monitor");
        } else {
          handoff("kata","pm","CL-02",adoptionOutcome+" and EV-03/v1");
          transition("closeGate");
        }
        break;
      case "spread":
        log("kata",first?"YK-01 recorded. Motor claims may trial the preflight under its own measurement plan.":"YK-01 recorded. Preflight remains scoped to household claims.");
        setAgent("kata","Monitoring the adopted procedure","Monitoring");
        handoff("kata","pm","CL-02",adoptionOutcome+", EV-03/v1 and YK-01");
        transition("closeGate");break;
      case "closure":
        if(!first) {setAgent("pm","Revising the operational handover","Revising");transition("reviseClosure");break;}
        setAgent("pm","Pilot closed with acceptance evidence","Complete");
        setAgent("sponsor","Measuring claim cycle time after transition","Monitoring");
        log("pm","Pilot closed. The post-transition cycle-time measurement remains with Iris.");
        transition("complete");break;
    }
  }
  function answer(id,value) {
    const r=requests.find(item=>item.id===id);
    if (!r || r.status!=="open" || typeof value!=="string" || !value.trim()) return false;
    const text=value.trim();
    if (r.type==="Approval" && !r.options.includes(text)) return false;
    resolve(r,text,"user"); return true;
  }
  function delegate(id,agentId) {
    const r=requests.find(item=>item.id===id);
    if (!r || r.status!=="open" || !r.delegates.includes(agentId)) return false;
    r.status="delegated";r.assignee=agentId;r.due=turn+2;r.resume={task:agent(agentId).task,status:agent(agentId).status};
    r.delegationCard="ADV-"+(++serial);
    handoff(r.agentId,agentId,r.delegationCard,r.artifact+" and decision criteria");
    setAgent(agentId,(r.type==="Approval"?"Reviewing ":"Investigating ")+r.artifact,"Assigned");
    return true;
  }
  const findings = {
    design:"The application/data matrix links each claim to its source receipt and owner. The contract meets the stated scope.",
    schema:"KB-08 pins receipt schema v3 for tranche T1. The older v2 samples predate this binding.",
    baseline:"Both WBS leaves have a named worker, input and acceptance criterion. The WIP cap is two.",
    repeat:"The duplicate signature matches the failed receipt lookup. Replay is bounded and preserves the original evidence.",
    adoption:"EV-03/v1 stayed frozen. The observed result is 0/20 versus the registered maximum of 1/20.",
    spread:"The motor-claims binding needs a separate trial and comparable held-out receipt measurements.",
    closure:"The acceptance sample, decision trace and operational owner are attached. Cycle time has a named follow-up owner."
  };
  function advance() {
    tick++;turn++;
    for(const r of requests.filter(i=>i.status==="delegated" && i.due<=turn)){
      const a=r.assignee;
      if (agent(a).status==="Assigned") setAgent(a,r.resume.task,r.resume.status);
      r.recommendation=agent(a).name+" · "+findings[r.key]; log(a,r.recommendation);
      if (r.type==="Question" && r.key!=="repeat") resolve(r,r.options[0],a);
      else {
        r.status="open"; r.delegates=r.delegates.filter(id=>id!==a);
        r.body+="\n\n"+r.recommendation+" Your decision is required.";
        log(r.agentId,"Review attached to "+r.artifact+". A human decision is required.");
      }
    }
    if (remaining>0 && --remaining>0) return;
    switch(phase) {
      case "reviseDesign":phase="design";open("design"," Revision 2 clarifies that the pilot covers household claims only.");break;
      case "reviseBaseline":phase="baseline";open("baseline"," Revision 2 splits the sample into two batches of ten.");break;
      case "firstFault":
        log("engineer","The broker returned a missing receipt on attempt 1. WP-42 is blocked.");
        setAgent("coach","Triaging the first missing receipt","Triaging");
        log("coach","FC-12 opened once. Transient lookup failure received bounded remedy retry.");transition("repeatFault");break;
      case "repeatFault":
        setAgent("engineer","Holding WP-42 after a repeated failure","Blocked");
        phase="flowGate";open("repeat");break;
      case "grasp":
        setAgent("kata","Grasp the Situation · measuring receipt loss","Analysing");
        log("kata","Baseline recorded: receipt loss affected 4 of 20 held-out claim files.");transition("solution");break;
      case "solution":
        setAgent("kata","Get to Solution · testing a receipt preflight","Experimenting");
        log("kata","Prediction registered before replay: procedure v4 will miss at most 1 receipt in 20 held-out claims.");
        handoff("kata","verifier","EV-03","candidate procedure and locked instrument v1");transition("measurement");break;
      case "measurement":
        setAgent("verifier","Attaching the independent replay result","Verified");
        log("verifier","EV-03/v1 completed: 4/20 missing at baseline; 0/20 with preflight.");
        phase="adoption";open("adoption");break;
      case "monitor":
        setAgent("kata","Get to Sustainability · monitoring drift","Monitoring");
        log("kata","A weekly EV-03/v1 regression check is attached to procedure v4.");
        transition("stretch");break;
      case "stretch":phase="stretchGate";open("spread");break;
      case "closeGate":phase="closure";open("closure"," "+adoptionOutcome+".");break;
      case "reviseClosure":phase="closure";open("closure"," Handover revision 2 names Iris as benefit owner and sets a 30-day observation point.");break;
    }
  }
  function ask(id,input="") {
    const a=agent(id);
    if (!a) return "";
    const q=String(input).toLowerCase();
    const pending=requests.find(r=>r.agentId===id && r.status!=="resolved");
    const recent=events.find(e=>e.agentId===id);
    let reply;
    if (/evidence|artifact|artefact|proof|measure|document|trace/.test(q)) reply=a.artifact+". "+(recent?recent.text+". ":"")+a.detail;
    else if (/block|need|decision|approv|risk|question|help/.test(q)) reply=pending?pending.body:"My current assignment is "+a.task.toLowerCase()+". "+a.detail;
    else if (/role|responsib|authority|why|how/.test(q)) reply=a.detail;

const photo=(id,cls='photo')=>'<img class="'+cls+'" src="'+embeddedPhotos[portraits[id]]+'" alt="">';
const openRequests=()=>Sim.requests.filter(r=>!['resolved','answered','closed','approved','rejected','done'].includes(r.status));
let floor='all', mode='',selected='', speed=1, paused=false, elapsed=0, lastTick=performance.now();
const chats={};
const dlg=$('drawer');
function setFloor(f){
 floor=f;OfficeWorld.floor(f);$('viewname').textContent=f==='all'?'Campus overview':floors[f];
 $('floors').innerHTML=Object.entries(floors).map(([id,name])=>'<button aria-pressed="'+(f===id)+'" class="'+(f===id?'active':'')+'" data-floor="'+id+'">'+name+'</button>').join('');
 renderRoster();
}
function renderRoster(){
 const people=Sim.agents.filter(a=>floor==='all'||a.floor===floor);
 const order=['architect','pm','coach','kata','sponsor','engineer','verifier','librarian'];
 people.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
 $('agentCount').textContent=people.length+' agents';
 $('agents').innerHTML=people.map(a=>'<button class="person" data-agent="'+a.id+'">'+photo(a.id)+'<span class="who"><b>'+esc(a.name)+'</b><small>'+esc(a.role)+'</small><em>'+esc(a.task)+'</em></span>'+(openRequests().some(r=>r.agentId===a.id)?'<span class="attention" title="Decision pending">!</span>':'')+'</button>').join('');
}
function eventHTML(e){return '<button class="event" data-agent="'+esc(e.agentId)+'">'+(agent(e.agentId)?photo(e.agentId):'')+'<div><time>'+esc(e.time)+'</time><p>'+esc(e.text)+'</p></div></button>'}
function refresh(){renderRoster();$('clock').textContent=Sim.time;$('pending').textContent=openRequests().length;$('events').innerHTML=Sim.events.slice(0,3).map(eventHTML).join('');$('pause').innerHTML=svg(paused?'play':'pause');$('pause').setAttribute('aria-label',paused?'Resume simulation':'Pause simulation');$('pause').title=$('pause').getAttribute('aria-label');$('speed').textContent=speed+'×';$('liveLabel').textContent=paused?'Simulation paused':'Live simulation'}
function dialog(type,title,html){mode=type;$('drawLabel').textContent=title;$('content').innerHTML=html;if(!dlg.open)dlg.showModal()}
function requestHTML(r){
 const source=agent(r.agentId);const isDelegated=r.status==='delegated';
 return '<article class="req" data-request="'+esc(r.id)+'"><div class="meta">'+esc(source?.name)+' · '+esc(r.type)+' · '+esc(r.status)+'</div><h3>'+esc(r.title)+'</h3><p>'+esc(r.body)+'</p>'+(r.delegationCard?'<div class="meta">Assigned card · '+esc(r.delegationCard)+'</div>':'')+(isDelegated?'<p>Assigned to '+esc(agent(r.assignee)?.name||r.assignee)+'.</p><div class="row"><button data-action="step">Advance simulation</button></div>':'<div class="row">'+r.options.map((x,i)=>'<button data-option="'+i+'">'+esc(x)+'</button>').join('')+'</div>'+(r.delegates.length?'<div class="row"><select aria-label="Choose an agent for this request">'+r.delegates.map(id=>'<option value="'+id+'">'+esc(agent(id)?.name)+' · '+esc(agent(id)?.role)+'</option>').join('')+'</select><button data-action="delegate">Delegate</button></div>':''))+'</article>'
}
function showInbox(){dialog('inbox','DECISION DESK','<h2>Decision inbox</h2>'+(openRequests().length?openRequests().map(requestHTML).join(''):'<p class="empty">No decisions are waiting.</p><div class="row"><button data-action="step">Advance simulation</button></div>'))}
function showAgent(id){
 const a=agent(id);if(!a)return;selected=id;OfficeWorld.select(id);
 dialog('agent',floors[a.floor].toUpperCase()+' DEPARTMENT','<div class="hero">'+photo(id)+'<div><small class="meta">'+esc(a.role)+'</small><h2>'+esc(a.name)+'</h2></div></div><div class="info"><div class="eyebrow">CURRENT ASSIGNMENT · '+esc(a.status).toUpperCase()+'</div><h3>'+esc(a.task)+'</h3><p>'+esc(a.detail)+'</p><div class="meta">'+esc(a.artifact)+'</div></div>'+openRequests().filter(r=>r.agentId===id||r.assignee===id).map(requestHTML).join('')+'<h3>Ask '+esc(a.name.split(' ')[0])+'</h3><div id="chatLog">'+(chats[id]||[]).map(t=>'<div class="talk"><small>'+esc(t.q)+'</small><p>'+esc(t.a)+'</p></div>').join('')+'</div><div class="row"><button data-prompt="What evidence do you have?">Evidence</button><button data-prompt="What is blocking you?">Blockers</button></div><form id="askForm" class="row"><input id="question" aria-label="Question for agent" placeholder="Ask about this assignment…" required maxlength="400"><button class="send">Ask</button></form><div class="row"><button data-action="locate">Visit department</button></div>');
}
function talk(q){if(!q.trim())return;const answer=Sim.ask(selected,q.trim());(chats[selected]??=[]).push({q,a:answer});showAgent(selected);$('question').focus()}
function history(){dialog('history','SIMULATION RECORD','<h2>Activity history</h2>'+Sim.events.map(eventHTML).join(''))}
function guide(){dialog('guide','CONVEYOR HOUSE','<h2>Visit the office</h2><p>This playable claims-modernisation scenario runs locally in your browser.</p><ol class="steps"><li>Select a person in the building or directory to inspect their card, evidence and current assignment.</li><li>Open the decision inbox. Answer a request or appoint an eligible agent to investigate. Advance the simulation to see the resulting handoff.</li><li>Follow the work through architecture, project planning, interruption triage and independent kata evaluation.</li></ol><p>The floor tabs isolate departments. Use the camera controls to turn the building and inspect the workstations.</p><p><a class="source" href="https://github.com/nonagenticai/conveyor/blob/main/docs/SPEC_V2.md" target="_blank" rel="noopener">Read Conveyor SPEC V2 ↗</a></p><div class="row"><button data-action="restart">Restart scenario</button></div>')}
function advance(){const before=Sim.events[0]?.id;Sim.advance();refresh();if(before===Sim.events[0]?.id)return;if(mode==='inbox')showInbox();if(mode==='history')history();if(mode==='agent'&&!$('question')?.value&&!dlg.querySelector(':focus:is(input,select)'))showAgent(selected)}
function refreshPanel(){refresh();if(mode==='agent')showAgent(selected);else showInbox()}
document.addEventListener('submit',e=>{if(e.target.id==='askForm'){e.preventDefault();talk($('question').value)}});
document.addEventListener('click',e=>{
 const el=e.target.closest('button,a.brand');if(!el)return;
 if(el.matches('.brand')){e.preventDefault();setFloor('all');return}
 if(el.dataset.floor){setFloor(el.dataset.floor);return}
 if(el.dataset.agent){showAgent(el.dataset.agent);return}
 if(el.dataset.prompt){talk(el.dataset.prompt);return}
 const r=Sim.requests.find(r=>r.id===el.closest('[data-request]')?.dataset.request);
 if(el.dataset.option!==undefined&&r){Sim.answer(r.id,r.options[Number(el.dataset.option)]);refreshPanel();return}
 switch(el.dataset.action){
 case 'delegate':if(r){Sim.delegate(r.id,el.parentElement.querySelector('select').value);refreshPanel()}break;
 case 'inbox':showInbox();break;case 'history':history();break;case 'guide':guide();break;case 'close':dlg.close();break;
 case 'locate':setFloor(agent(selected).floor);dlg.close();OfficeWorld.select(selected);break;
 case 'step':advance();break;
 case 'restart':Sim.reset();Object.keys(chats).forEach(k=>delete chats[k]);elapsed=0;dlg.close();OfficeWorld.select(null);setFloor('all');refresh();break;
 case 'pause':paused=!paused;OfficeWorld.speed(paused?0:speed);refresh();break;
 case 'speed':speed=speed===1?2:speed===2?4:1;OfficeWorld.speed(paused?0:speed);refresh();break;
 case 'left':case 'right':OfficeWorld.rotate(el.dataset.action==='left'?-1:1);break;
 case 'plus':case 'minus':OfficeWorld.zoom(el.dataset.action==='plus'?.18:-.18);break;
 }
});
