# nextest configuration — the one thing the default profile cannot know.
#
# ⛔ `bus_delivery` shares ONE Redis across all of its tests, and exactly one of them rehearses a
# Redis loss with `FLUSHALL` — which wipes every sibling's stream, not just its own tenant's.
# nextest runs each test in its own PROCESS, so no in-process lock can serialise them; a test
# group can, and does: `max-threads = 1` holds the binary to one test at a time.
#
# MEASURED 2026-11-15 (run 43696201698, job `checks`): `bus_delivery::a_large_job_round_trips_intact`
# died with `XREADGROUP … NOGROUP: No such key 'bus:<tenant>:process'` at 08:56:54.819, inside the
# 2.036 s window of `bus_delivery::a_flushall_replays_from_postgres_without_a_double_outcome`
# (finished 08:56:55.281). A positive failure, not a timing guess. The same test failed the #116
# main run on 2026-11-14.
#
# The scope is the binary, not the test: a sibling added later inherits the protection, and the
# cost is seconds on one small binary (the suite's other binaries are unaffected).
[test-groups.serial-redis-loss]
max-threads = 1

# ⚠️ `overrides` (plural). `override` is silently accepted as an unknown key and the file still
# loads — measured 2026-11-15: nextest printed `ignoring unknown configuration key:
# profile.default.override` and ran the binary concurrently. nextest 0.9.150's
# `--message-format json` carries no group field (measured 2026-11-16), so confirm a group by
# running its tests with a high `--test-threads` and checking the summary wall time equals the
# sum of the test durations (serialised), not their maximum.
[[profile.default.overrides]]
filter = 'binary(bus_delivery)'
test-group = 'serial-redis-loss'

# ⛔ The `conveyor-media` browser tests launch Chromium over CDP, and the launcher serialises
# sessions with ONE machine-wide lock held for the session's life
# (`apps/media/src/browser/cdp.rs:60-108`). nextest runs each test in its own process, so four of
# them start at once and queue on that lock — and each test's own 20 s per-test ceiling
# (`gherkin.rs`), not the lock, is what expires.
#
# MEASURED 2026-11-16 (run 43947147234, job `checks`, main@318fa4d): four `browser::gherkin`
# tests failed at ~20.0 s with every step "the scenario exceeded its 20000 ms per-test ceiling".
# The same tree passed the PR run (43941223985) and the main rerun (attempt 2) — a shared-resource
# queue, not a code difference. The scope is every browser test in the binary, so a sibling added
# later inherits the protection; the rest of `conveyor-media` keeps the default parallelism.
[test-groups.serial-browser-cdp]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(conveyor-media) & test(/browser/)'
test-group = 'serial-browser-cdp'
