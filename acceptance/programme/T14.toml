[project]
key = "T14"
name = "Estate toolkits"
gate = "each published toolkit has a probe and one live call; `scientific_processor` is scaled up for its probe and one live call, then scaled back; a zero-use report exists; a backend outage unbinds new runs and in-flight runs finish"
gate_checks = ["T14-project", "T14-baseline", "T14-charter", "T14-closure-outputs", "T14-contract", "T14-review", "T14-closure-gate", "T14-waivers", "T14-pi-cadence", "T14-pi-plan", "T14-pi-objectives", "T14-wsjf", "T14-demo-credits", "T14-lessons", "T14-product", "T14-artefact-standard", "T14-rework"]
[[check]]
id = "T14-project"
check = "project"
severity = "P0"
description = "T14 is closed"

[[check]]
id = "T14-baseline"
check = "project_baseline"
require_approved = true
severity = "P0"
description = "the scope baseline is approved; the close gate reads the approved row"

[[check]]
id = "T14-charter"
kind = "command"
severity = "P0"
description = "the charter asset exists and the charter gate is approved"
command = '''python3 scripts/programme-record.py --check --action pm.get --input '{"project_id":"01a1d039-0d37-7896-adfb-fa7bd2279dfd"}' | python3 -c '
import json,sys
s=sys.stdin.read()
d=json.loads(s[s.find("{"):])
o=d.get("output",d)
assert o.get("charter_asset_id"), "no charter asset"
gates={g.get("gate"):g.get("status") for g in o.get("gates",[])}
assert gates.get("charter")=="approved", gates
'
'''

[[check]]
id = "T14-closure-outputs"
check = "closure_outputs"
severity = "P0"
description = "the declared closure outputs are declared and published"

[[check]]
id = "T14-contract"
check = "contract"
severity = "P0"
description = "a live board-approved delivery contract exists"

[[check]]
id = "T14-review"
check = "review"
severity = "P0"
description = "the Phase-G review cites a published standing delegation"

[[check]]
id = "T14-closure-gate"
check = "closure_gate"
severity = "P0"
description = "the closure gate was decided by an approver other than its requester"

[[check]]
id = "T14-waivers"
check = "waivers"
severity = "P0"
description = "no active waiver is expired or owned by its reviewer"

[[check]]
id = "T14-pi-cadence"
check = "pi_cadence"
severity = "P0"
description = "the project's PI has a cadence row and a backlog-refinement row"

[[check]]
id = "T14-pi-plan"
check = "pi_plan"
severity = "P0"
description = "the project tranche's PI plan is published"

[[check]]
id = "T14-pi-objectives"
check = "pi_objectives"
severity = "P0"
description = "the project tranche's PI objectives are published"

[[check]]
id = "T14-wsjf"
check = "wsjf"
severity = "P0"
description = "every WBS deliverable of the project carries the four typed WSJF inputs"

[[check]]
id = "T14-demo-credits"
check = "demo_credits"
severity = "P0"
description = "every accepted deliverable has a demo credit carrying its evidence"

[[check]]
id = "T14-lessons"
check = "lessons"
severity = "P1"
description = "the tranche retro produced at least one lesson"

[[check]]
id = "T14-product"
check = "product_findings"
severity = "P0"
description = "no open P0 product finding remains for the project"

[[check]]
id = "T14-artefact-standard"
check = "artefact_standard"
severity = "P1"
description = "every mandatory standard artefact this project owns is evidenced"

[[check]]
id = "T14-rework"
check = "rework_resolution"
severity = "P0"
description = "no unresolved P0/P1 rework package remains for the project"
