[project]
key = "S06"
name = "Control plane — claims, runs, approvals, andon, comms and notifications"
gate = "S06's gate is the golden card-type×list path, dual-control approval and retry."
gate_checks = ["S06-project", "S06-baseline", "S06-charter", "S06-closure-outputs", "S06-contract", "S06-review", "S06-closure-gate", "S06-waivers", "S06-pi-cadence", "S06-pi-plan", "S06-pi-objectives", "S06-wsjf", "S06-demo-credits", "S06-lessons", "S06-product"]

[[check]]
id = "S06-project"
check = "project"
status = "active"
severity = "P0"
description = "S06 is active"

[[check]]
id = "S06-baseline"
check = "project_baseline"
require_approved = true
severity = "P0"
description = "the scope baseline is approved; the close gate reads the approved row"

[[check]]
id = "S06-charter"
kind = "command"
severity = "P0"
description = "the charter asset exists and the charter gate is approved"
command = '''python3 scripts/programme-record.py --check --action pm.get --input '{"project_id":"01a1d039-0d2a-7007-bcd8-29bb24f36b54"}' | python3 -c '
import json,sys
s=sys.stdin.read()
d=json.loads(s[s.find("{"):])
o=d.get("output",d)
assert o.get("charter_asset_id"), "no charter asset"
gates={g.get("gate"):g.get("status") for g in o.get("gates",[])}
assert gates.get("charter")=="approved", gates
'
'''

[[check]]
id = "S06-closure-outputs"
check = "closure_outputs"
severity = "P0"
description = "the declared closure outputs are declared and published"

[[check]]
id = "S06-contract"
check = "contract"
severity = "P0"
description = "a live board-approved delivery contract exists"

[[check]]
id = "S06-review"
check = "review"
severity = "P0"
description = "the Phase-G review cites a published standing delegation"

[[check]]
id = "S06-closure-gate"
check = "closure_gate"
severity = "P0"
description = "the closure gate was decided by an approver other than its requester"

[[check]]
id = "S06-waivers"
check = "waivers"
severity = "P0"
description = "no active waiver is expired or owned by its reviewer"

[[check]]
id = "S06-pi-cadence"
check = "pi_cadence"
severity = "P0"
description = "the project's PI has a cadence row and a backlog-refinement row"

[[check]]
id = "S06-pi-plan"
check = "pi_plan"
severity = "P0"
description = "the project tranche's PI plan is published"

[[check]]
id = "S06-pi-objectives"
check = "pi_objectives"
severity = "P0"
description = "the project tranche's PI objectives are published"

[[check]]
id = "S06-wsjf"
check = "wsjf"
severity = "P0"
description = "every WBS deliverable of the project carries the four typed WSJF inputs"

[[check]]
id = "S06-demo-credits"
check = "demo_credits"
severity = "P0"
description = "every accepted deliverable has a demo credit carrying its evidence"

[[check]]
id = "S06-lessons"
check = "lessons"
severity = "P1"
description = "the tranche retro produced at least one lesson"

[[check]]
id = "S06-product"
check = "product_findings"
severity = "P0"
description = "no open P0 product finding remains for the project"
