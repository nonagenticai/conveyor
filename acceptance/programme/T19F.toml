[project]
key = "T19F"
name = "Decision-forum governance (follow-on)"
gate = "A policy change is authored through the tenant's authoring route and published as a new immutable meeting_type version while an in-flight meeting keeps its pinned version; a board subject decision is taken in a board sitting with one approval_decision row per qualifying seat carrying via='meeting'; a cadence row names its meeting type and materialises exactly one meeting; the direct architecture.board_decide path is unchanged; and the project's closure review defers closure to the tranche-6 review."
gate_checks = ["T19F-project", "T19F-baseline", "T19F-charter", "T19F-contract", "T19F-review", "T19F-waivers", "T19F-pi-cadence", "T19F-pi-plan", "T19F-pi-objectives", "T19F-wsjf", "T19F-demo-credits", "T19F-lessons", "T19F-product", "T19F-artefact-standard", "T19F-rework", "T19F-live-gate"]

[[check]]
id = "T19F-project"
check = "project"
status = "active"
severity = "P0"
description = "T19F remains active; closure is deferred to the tranche-6 review"

[[check]]
id = "T19F-baseline"
check = "project_baseline"
require_approved = true
severity = "P0"
description = "the scope baseline is approved; the close gate reads the approved row"

[[check]]
id = "T19F-charter"
kind = "command"
severity = "P0"
description = "the charter asset exists and the charter gate is approved"
command = '''python3 scripts/programme-record.py --check --action pm.get --input '{"project_id":"01a210ba-b6cb-76cc-82a3-a2b45cfb498f"}' | python3 -c '
import json,sys
s=sys.stdin.read()
d=json.loads(s[s.find("{"):])
o=d.get("output",d)
assert o.get("charter_asset_id"), "no charter asset"
gates={g.get("gate"):g.get("status") for g in o.get("gates",[])}
assert gates.get("charter")=="approved", gates
'
'''

[[check]]
id = "T19F-contract"
check = "contract"
severity = "P0"
description = "a live board-approved delivery contract exists"

[[check]]
id = "T19F-review"
check = "review"
severity = "P0"
description = "the Phase-G review cites a published standing delegation"

[[check]]
id = "T19F-waivers"
check = "waivers"
severity = "P0"
description = "no active waiver is expired or owned by its reviewer"

[[check]]
id = "T19F-pi-cadence"
check = "pi_cadence"
severity = "P0"
description = "the project's PI has a cadence row and a backlog-refinement row"

[[check]]
id = "T19F-pi-plan"
check = "pi_plan"
severity = "P0"
description = "the project tranche's PI plan is published"

[[check]]
id = "T19F-pi-objectives"
check = "pi_objectives"
severity = "P0"
description = "the project tranche's PI objectives are published"

[[check]]
id = "T19F-wsjf"
check = "wsjf"
severity = "P0"
description = "every WBS deliverable of the project carries the four typed WSJF inputs"

[[check]]
id = "T19F-demo-credits"
check = "demo_credits"
severity = "P0"
description = "every accepted deliverable has a demo credit carrying its evidence"

[[check]]
id = "T19F-lessons"
check = "lessons"
severity = "P1"
description = "the tranche retro produced at least one lesson"

[[check]]
id = "T19F-product"
check = "product_findings"
severity = "P0"
description = "no open P0 product finding remains for the project"

[[check]]
id = "T19F-artefact-standard"
check = "artefact_standard"
severity = "P1"
description = "every mandatory standard artefact this project owns is evidenced"

[[check]]
id = "T19F-rework"
check = "rework_resolution"
severity = "P0"
description = "no unresolved P0/P1 rework package remains for the project"

[[check]]
id = "T19F-live-gate"
kind = "command"
severity = "P0"
description = "the live decision-forum gate passes on the record"
command = '''python3 scripts/t19f-live-gate-check.py --check'''
