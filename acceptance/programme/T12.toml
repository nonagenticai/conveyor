[project]
key = "T12"
name = "One organisation loop"
gate = "T12 is NOT built, and its acceptance — `SPEC_V2` §12: 'one tenant runs request → PM → delivery jobs → coach interruption → kata → development project → deploy → operations incident → lesson, all audited, within budget; one benefit is baselined before its transition and measured after it, with the delta attributable to the operational area' — is the condition on which it may be closed, not a claim that it is met."
gate_checks = ["T12-project", "T12-baseline", "T12-charter", "T12-contract", "T12-review", "T12-waivers", "T12-pi-cadence", "T12-pi-plan", "T12-pi-objectives", "T12-wsjf", "T12-demo-credits", "T12-lessons", "T12-product", "T12-artefact-standard", "T12-rework"]
[[check]]
id = "T12-project"
check = "project"
status = "active"
severity = "P0"
description = "T12 is active"

[[check]]
id = "T12-baseline"
check = "project_baseline"
require_approved = true
severity = "P0"
description = "the scope baseline is approved; the close gate reads the approved row"

[[check]]
id = "T12-charter"
kind = "command"
severity = "P0"
description = "the charter asset exists and the charter gate is approved"
command = '''python3 scripts/programme-record.py --check --action pm.get --input '{"project_id":"01a1d039-0d36-7de8-891c-4d3dcf110cf5"}' | python3 -c '
import json,sys
s=sys.stdin.read()
d=json.loads(s[s.find("{"):])
o=d.get("output",d)
assert o.get("charter_asset_id"), "no charter asset"
gates={g.get("gate"):g.get("status") for g in o.get("gates",[])}
assert gates.get("charter")=="approved", gates
'
'''

[[check]]
id = "T12-contract"
check = "contract"
severity = "P0"
description = "a live board-approved delivery contract exists"

[[check]]
id = "T12-review"
check = "review"
severity = "P0"
description = "the Phase-G review cites a published standing delegation"

[[check]]
id = "T12-waivers"
check = "waivers"
severity = "P0"
description = "no active waiver is expired or owned by its reviewer"

[[check]]
id = "T12-pi-cadence"
check = "pi_cadence"
severity = "P0"
description = "the project's PI has a cadence row and a backlog-refinement row"

[[check]]
id = "T12-pi-plan"
check = "pi_plan"
severity = "P0"
description = "the project tranche's PI plan is published"

[[check]]
id = "T12-pi-objectives"
check = "pi_objectives"
severity = "P0"
description = "the project tranche's PI objectives are published"

[[check]]
id = "T12-wsjf"
check = "wsjf"
severity = "P0"
description = "every WBS deliverable of the project carries the four typed WSJF inputs"

[[check]]
id = "T12-demo-credits"
check = "demo_credits"
severity = "P0"
description = "every accepted deliverable has a demo credit carrying its evidence"

[[check]]
id = "T12-lessons"
check = "lessons"
severity = "P1"
description = "the tranche retro produced at least one lesson"

[[check]]
id = "T12-product"
check = "product_findings"
severity = "P0"
description = "no open P0 product finding remains for the project"

[[check]]
id = "T12-artefact-standard"
check = "artefact_standard"
severity = "P1"
description = "every mandatory standard artefact this project owns is evidenced"

[[check]]
id = "T12-rework"
check = "rework_resolution"
severity = "P0"
description = "no unresolved P0/P1 rework package remains for the project"
