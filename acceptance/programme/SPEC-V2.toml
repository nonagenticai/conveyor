[project]
key = "SPEC-V2"
name = "SPEC V2 — the organisational operating model"
gate = "The closure review exists and every declared closure output is published; the project re-closes through the one gate."

[[check]]
id = "SPEC-V2-project"
check = "project"
status = "closed"
severity = "P0"
description = "SPEC-V2 is closed"

[[check]]
id = "SPEC-V2-baseline"
check = "project_baseline"
require_approved = true
severity = "P0"
description = "the scope baseline is approved; the close gate reads the approved row"

[[check]]
id = "SPEC-V2-charter"
kind = "command"
severity = "P0"
description = "the charter asset exists and the charter gate is approved"
command = '''python3 scripts/programme-record.py --check --action pm.get --input '{"project_id":"01a1d039-0d39-7f3b-bd04-211f7dfe1e50"}' | python3 -c '
import json,sys
s=sys.stdin.read()
d=json.loads(s[s.find("{"):])
o=d.get("output",d)
assert o.get("charter_asset_id"), "no charter asset"
gates={g.get("gate"):g.get("status") for g in o.get("gates",[])}
assert gates.get("charter")=="approved", gates
'
'''

[[check]]
id = "SPEC-V2-closure-outputs"
check = "closure_outputs"
severity = "P0"
description = "the declared closure outputs are declared and published"

[[check]]
id = "SPEC-V2-contract"
check = "contract"
severity = "P0"
description = "a live board-approved delivery contract exists"

[[check]]
id = "SPEC-V2-review"
check = "review"
severity = "P0"
description = "the Phase-G review cites a published standing delegation"

[[check]]
id = "SPEC-V2-closure-gate"
check = "closure_gate"
severity = "P0"
description = "the closure gate was decided by an approver other than its requester"

[[check]]
id = "SPEC-V2-waivers"
check = "waivers"
severity = "P0"
description = "no active waiver is expired or owned by its reviewer"
