[project]
key = "S20"
name = "Eval hillclimb"
gate = "S20 is accepted when its gate is green: one RLS-forced table with `0029` in the ledger and no spend column, no round before the plan is signed, the train/test split immovable by a climb, a grader fix re-grading stored transcripts into a new run, the comparison refusing across versions, graders or splits, the revert rules in the domain machine, a fourth content round refused after a stall, the cost walk's gates registered before round 1, the final report naming the winner, the served surface matching the lock, and `rbuild --gate`."
gate_checks = ["S20-project", "S20-baseline", "S20-charter", "S20-closure-outputs", "S20-contract", "S20-review", "S20-closure-gate", "S20-waivers", "S20-pi-cadence", "S20-pi-plan", "S20-pi-objectives", "S20-lessons", "S20-wsjf", "S20-demo-credits", "S20-product"]

[[check]]
id = "S20-project"
check = "project"
status = "active"
severity = "P0"
description = "S20 is active"

[[check]]
id = "S20-baseline"
check = "project_baseline"
require_approved = true
severity = "P0"
description = "the scope baseline is approved; the close gate reads the approved row"

[[check]]
id = "S20-charter"
kind = "command"
severity = "P0"
description = "the charter asset exists and the charter gate is approved"
command = '''python3 scripts/programme-record.py --check --action pm.get --input '{"project_id":"01a1d039-0d31-7d0f-ab1f-16240952e223"}' | python3 -c '
import json,sys
s=sys.stdin.read()
d=json.loads(s[s.find("{"):])
o=d.get("output",d)
assert o.get("charter_asset_id"), "no charter asset"
gates={g.get("gate"):g.get("status") for g in o.get("gates",[])}
assert gates.get("charter")=="approved", gates
'
'''

[[check]]
id = "S20-closure-outputs"
check = "closure_outputs"
severity = "P0"
description = "the declared closure outputs are declared and published"

[[check]]
id = "S20-contract"
check = "contract"
severity = "P0"
description = "a live board-approved delivery contract exists"

[[check]]
id = "S20-review"
check = "review"
severity = "P0"
description = "the Phase-G review cites a published standing delegation"

[[check]]
id = "S20-closure-gate"
check = "closure_gate"
severity = "P0"
description = "the closure gate was decided by an approver other than its requester"

[[check]]
id = "S20-waivers"
check = "waivers"
severity = "P0"
description = "no active waiver is expired or owned by its reviewer"

[[check]]
id = "S20-pi-cadence"
check = "pi_cadence"
severity = "P0"
description = "the project's PI has a cadence row and a backlog-refinement row"

[[check]]
id = "S20-pi-plan"
check = "pi_plan"
severity = "P0"
description = "the project tranche's PI plan is published"

[[check]]
id = "S20-pi-objectives"
check = "pi_objectives"
severity = "P0"
description = "the project tranche's PI objectives are published"

[[check]]
id = "S20-lessons"
check = "lessons"
severity = "P1"
description = "the tranche retro produced at least one lesson"

[[check]]
id = "S20-wsjf"
check = "wsjf"
severity = "P0"
description = "every WBS deliverable of the project carries the four typed WSJF inputs"

[[check]]
id = "S20-demo-credits"
check = "demo_credits"
severity = "P0"
description = "every accepted deliverable has a demo credit carrying its evidence"

[[check]]
id = "S20-product"
check = "product_findings"
severity = "P0"
description = "no open P0 product finding remains for the project"
