[project]
key = "T15"
name = "Tool authoring and BYO"
gate = "T15 is closed on delivered acceptance — `SPEC_V2` §12: 'a tool generated from a spec is published and called by a job; publication approval defaults to a human and is tenant-configurable; a BYO MCP server is bound, narrowed and audited; a tenant cannot exceed its effect ceiling' — delivered by PR #666 (merge `a2ef9194eb2c`) and recorded by the published closure review `01a2121b-2e58-7407-84a3-3329dc2c1a8c`; the record row is closed and measured built."
gate_checks = ["T15-project", "T15-baseline", "T15-charter", "T15-contract", "T15-review", "T15-waivers", "T15-pi-cadence", "T15-pi-plan", "T15-pi-objectives", "T15-wsjf", "T15-demo-credits", "T15-lessons", "T15-product", "T15-artefact-standard", "T15-rework"]
[[check]]
id = "T15-project"
check = "project"
status = "closed"
severity = "P0"
description = "T15 is closed"

[[check]]
id = "T15-baseline"
check = "project_baseline"
require_approved = true
severity = "P0"
description = "the scope baseline is approved; the close gate reads the approved row"

[[check]]
id = "T15-charter"
kind = "command"
severity = "P0"
description = "the charter asset exists and the charter gate is approved"
command = '''python3 scripts/programme-record.py --check --action pm.get --input '{"project_id":"01a1d039-0d37-7f20-9959-979c31daeb5e"}' | python3 -c '
import json,sys
s=sys.stdin.read()
d=json.loads(s[s.find("{"):])
o=d.get("output",d)
assert o.get("charter_asset_id"), "no charter asset"
gates={g.get("gate"):g.get("status") for g in o.get("gates",[])}
assert gates.get("charter")=="approved", gates
'
'''

[[check]]
id = "T15-contract"
check = "contract"
severity = "P0"
description = "a live board-approved delivery contract exists"

[[check]]
id = "T15-review"
check = "review"
severity = "P0"
description = "the Phase-G review cites a published standing delegation"

[[check]]
id = "T15-waivers"
check = "waivers"
severity = "P0"
description = "no active waiver is expired or owned by its reviewer"

[[check]]
id = "T15-pi-cadence"
check = "pi_cadence"
severity = "P0"
description = "the project's PI has a cadence row and a backlog-refinement row"

[[check]]
id = "T15-pi-plan"
check = "pi_plan"
severity = "P0"
description = "the project tranche's PI plan is published"

[[check]]
id = "T15-pi-objectives"
check = "pi_objectives"
severity = "P0"
description = "the project tranche's PI objectives are published"

[[check]]
id = "T15-wsjf"
check = "wsjf"
severity = "P0"
description = "every WBS deliverable of the project carries the four typed WSJF inputs"

[[check]]
id = "T15-demo-credits"
check = "demo_credits"
severity = "P0"
description = "every accepted deliverable has a demo credit carrying its evidence"

[[check]]
id = "T15-lessons"
check = "lessons"
severity = "P1"
description = "the tranche retro produced at least one lesson"

[[check]]
id = "T15-product"
check = "product_findings"
severity = "P0"
description = "no open P0 product finding remains for the project"

[[check]]
id = "T15-artefact-standard"
check = "artefact_standard"
severity = "P1"
description = "every mandatory standard artefact this project owns is evidenced"

[[check]]
id = "T15-rework"
check = "rework_resolution"
severity = "P0"
description = "no unresolved P0/P1 rework package remains for the project"
