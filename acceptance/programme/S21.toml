[project]
key = "S21"
name = "Message construction"
gate = "S21 is accepted when a step whose recipe requires `procedure` and whose run has none fails by name before a model call, the same recipe and the same facts compile byte-identically, changing the card changes the hash while changing an unrelated tenant's card does not, an over-budget section refuses with the measured size and never truncates, and the prompt audit can name the compiled text it audited by `(prompt_ref, prompt_sha256)`."
gate_checks = ["S21-project", "S21-baseline", "S21-charter", "S21-contract", "S21-review", "S21-waivers", "S21-pi-cadence", "S21-pi-plan", "S21-pi-objectives", "S21-lessons", "S21-wsjf", "S21-demo-credits", "S21-product"]
[[check]]
id = "S21-project"
check = "project"
status = "active"
severity = "P0"
description = "S21 is active"

[[check]]
id = "S21-baseline"
check = "project_baseline"
require_approved = true
severity = "P0"
description = "the scope baseline is approved; the close gate reads the approved row"

[[check]]
id = "S21-charter"
kind = "command"
severity = "P0"
description = "the charter asset exists and the charter gate is approved"
command = '''python3 scripts/programme-record.py --check --action pm.get --input '{"project_id":"01a1d039-0d32-71f6-bad4-81493c102060"}' | python3 -c '
import json,sys
s=sys.stdin.read()
d=json.loads(s[s.find("{"):])
o=d.get("output",d)
assert o.get("charter_asset_id"), "no charter asset"
gates={g.get("gate"):g.get("status") for g in o.get("gates",[])}
assert gates.get("charter")=="approved", gates
'
'''

[[check]]
id = "S21-contract"
check = "contract"
severity = "P0"
description = "a live board-approved delivery contract exists"

[[check]]
id = "S21-review"
check = "review"
severity = "P0"
description = "the Phase-G review cites a published standing delegation"

[[check]]
id = "S21-waivers"
check = "waivers"
severity = "P0"
description = "no active waiver is expired or owned by its reviewer"

[[check]]
id = "S21-pi-cadence"
check = "pi_cadence"
severity = "P0"
description = "the project's PI has a cadence row and a backlog-refinement row"

[[check]]
id = "S21-pi-plan"
check = "pi_plan"
severity = "P0"
description = "the project tranche's PI plan is published"

[[check]]
id = "S21-pi-objectives"
check = "pi_objectives"
severity = "P0"
description = "the project tranche's PI objectives are published"

[[check]]
id = "S21-lessons"
check = "lessons"
severity = "P1"
description = "the tranche retro produced at least one lesson"

[[check]]
id = "S21-wsjf"
check = "wsjf"
severity = "P0"
description = "every WBS deliverable of the project carries the four typed WSJF inputs"

[[check]]
id = "S21-demo-credits"
check = "demo_credits"
severity = "P0"
description = "every accepted deliverable has a demo credit carrying its evidence"

[[check]]
id = "S21-product"
check = "product_findings"
severity = "P0"
description = "no open P0 product finding remains for the project"
