[project]
key = "S16"
name = "Inference ledger and prompt audit"
gate = "Every model call the conveyor makes becomes a durable, tenant-scoped row carrying the prompt's identity, the token counts and the provider's prompt-cache classes, so \"what did this cost and was it cached\" is a query rather than a guess."
gate_checks = ["S16-project", "S16-baseline", "S16-charter", "S16-closure-outputs", "S16-contract", "S16-review", "S16-closure-gate", "S16-waivers", "S16-pi-cadence", "S16-pi-plan", "S16-pi-objectives", "S16-wsjf", "S16-demo-credits", "S16-lessons", "S16-product"]

[[check]]
id = "S16-project"
check = "project"
severity = "P0"
description = "S16 is closed"

[[check]]
id = "S16-baseline"
check = "project_baseline"
require_approved = true
severity = "P0"
description = "the scope baseline is approved; the close gate reads the approved row"

[[check]]
id = "S16-charter"
kind = "command"
severity = "P0"
description = "the charter asset exists and the charter gate is approved"
command = '''python3 scripts/programme-record.py --check --action pm.get --input '{"project_id":"01a1d039-0d30-72a1-9bba-29fadf6170cf"}' | python3 -c '
import json,sys
s=sys.stdin.read()
d=json.loads(s[s.find("{"):])
o=d.get("output",d)
assert o.get("charter_asset_id"), "no charter asset"
gates={g.get("gate"):g.get("status") for g in o.get("gates",[])}
assert gates.get("charter")=="approved", gates
'
'''

[[check]]
id = "S16-closure-outputs"
check = "closure_outputs"
severity = "P0"
description = "the declared closure outputs are declared and published"

[[check]]
id = "S16-contract"
check = "contract"
severity = "P0"
description = "a live board-approved delivery contract exists"

[[check]]
id = "S16-review"
check = "review"
severity = "P0"
description = "the Phase-G review cites a published standing delegation"

[[check]]
id = "S16-closure-gate"
check = "closure_gate"
severity = "P0"
description = "the closure gate was decided by an approver other than its requester"

[[check]]
id = "S16-waivers"
check = "waivers"
severity = "P0"
description = "no active waiver is expired or owned by its reviewer"

[[check]]
id = "S16-pi-cadence"
check = "pi_cadence"
severity = "P0"
description = "the project's PI has a cadence row and a backlog-refinement row"

[[check]]
id = "S16-pi-plan"
check = "pi_plan"
severity = "P0"
description = "the project tranche's PI plan is published"

[[check]]
id = "S16-pi-objectives"
check = "pi_objectives"
severity = "P0"
description = "the project tranche's PI objectives are published"

[[check]]
id = "S16-wsjf"
check = "wsjf"
severity = "P0"
description = "every WBS deliverable of the project carries the four typed WSJF inputs"

[[check]]
id = "S16-demo-credits"
check = "demo_credits"
severity = "P0"
description = "every accepted deliverable has a demo credit carrying its evidence"

[[check]]
id = "S16-lessons"
check = "lessons"
severity = "P1"
description = "the tranche retro produced at least one lesson"

[[check]]
id = "S16-product"
check = "product_findings"
severity = "P0"
description = "no open P0 product finding remains for the project"
