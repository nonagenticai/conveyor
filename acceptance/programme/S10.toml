[project]
key = "S10"
name = "Copilot / AG-UI — one action surface, proposals, conversations"
gate = "S10 is accepted when a scripted agent session passes — the tool list is the projection of the ActionSpecs the caller's scopes admit, a destructive tool call becomes an S06 approval, and the conversation is two tables plus an SSE stream, not a second action system."
gate_checks = ["S10-project", "S10-baseline", "S10-charter", "S10-closure-outputs", "S10-contract", "S10-review", "S10-closure-gate", "S10-waivers", "S10-pi-cadence", "S10-pi-plan", "S10-pi-objectives", "S10-wsjf", "S10-demo-credits", "S10-lessons", "S10-product"]

[[check]]
id = "S10-project"
check = "project"
severity = "P0"
description = "S10 is closed"

[[check]]
id = "S10-baseline"
check = "project_baseline"
require_approved = true
severity = "P0"
description = "the scope baseline is approved; the close gate reads the approved row"

[[check]]
id = "S10-charter"
kind = "command"
severity = "P0"
description = "the charter asset exists and the charter gate is approved"
command = '''python3 scripts/programme-record.py --check --action pm.get --input '{"project_id":"01a1d039-0d2d-787e-853e-fef542ec8815"}' | python3 -c '
import json,sys
s=sys.stdin.read()
d=json.loads(s[s.find("{"):])
o=d.get("output",d)
assert o.get("charter_asset_id"), "no charter asset"
gates={g.get("gate"):g.get("status") for g in o.get("gates",[])}
assert gates.get("charter")=="approved", gates
'
'''

[[check]]
id = "S10-closure-outputs"
check = "closure_outputs"
severity = "P0"
description = "the declared closure outputs are declared and published"

[[check]]
id = "S10-contract"
check = "contract"
severity = "P0"
description = "a live board-approved delivery contract exists"

[[check]]
id = "S10-review"
check = "review"
severity = "P0"
description = "the Phase-G review cites a published standing delegation"

[[check]]
id = "S10-closure-gate"
check = "closure_gate"
severity = "P0"
description = "the closure gate was decided by an approver other than its requester"

[[check]]
id = "S10-waivers"
check = "waivers"
severity = "P0"
description = "no active waiver is expired or owned by its reviewer"

[[check]]
id = "S10-pi-cadence"
check = "pi_cadence"
severity = "P0"
description = "the project's PI has a cadence row and a backlog-refinement row"

[[check]]
id = "S10-pi-plan"
check = "pi_plan"
severity = "P0"
description = "the project tranche's PI plan is published"

[[check]]
id = "S10-pi-objectives"
check = "pi_objectives"
severity = "P0"
description = "the project tranche's PI objectives are published"

[[check]]
id = "S10-wsjf"
check = "wsjf"
severity = "P0"
description = "every WBS deliverable of the project carries the four typed WSJF inputs"

[[check]]
id = "S10-demo-credits"
check = "demo_credits"
severity = "P0"
description = "every accepted deliverable has a demo credit carrying its evidence"

[[check]]
id = "S10-lessons"
check = "lessons"
severity = "P1"
description = "the tranche retro produced at least one lesson"

[[check]]
id = "S10-product"
check = "product_findings"
severity = "P0"
description = "no open P0 product finding remains for the project"
