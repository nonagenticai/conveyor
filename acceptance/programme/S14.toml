[project]
key = "S14"
name = "Cutover — deploy, seed, rehearse, decommission fr / RM / Planka"
gate = "S14 is accepted when the native gate passes — every used id in `parity/native.tsv` resolves to an `action:`, `test:`, `replacement:` or `dropped:` disposition and the check refuses a missing or unknown row — and the R0–R7 cutover receipts exist; the plan records `docs/cutover/` as absent at HEAD."
gate_checks = ["S14-project", "S14-baseline", "S14-charter", "S14-contract", "S14-review", "S14-waivers", "S14-pi-cadence", "S14-pi-plan", "S14-pi-objectives", "S14-lessons", "S14-wsjf", "S14-demo-credits", "S14-product"]
[[check]]
id = "S14-project"
check = "project"
status = "active"
severity = "P0"
description = "S14 is active"

[[check]]
id = "S14-baseline"
check = "project_baseline"
require_approved = true
severity = "P0"
description = "the scope baseline is approved; the close gate reads the approved row"

[[check]]
id = "S14-charter"
kind = "command"
severity = "P0"
description = "the charter asset exists and the charter gate is approved"
command = '''python3 scripts/programme-record.py --check --action pm.get --input '{"project_id":"01a1d039-0d2f-75f2-a1fb-aa95893aa206"}' | python3 -c '
import json,sys
s=sys.stdin.read()
d=json.loads(s[s.find("{"):])
o=d.get("output",d)
assert o.get("charter_asset_id"), "no charter asset"
gates={g.get("gate"):g.get("status") for g in o.get("gates",[])}
assert gates.get("charter")=="approved", gates
'
'''

[[check]]
id = "S14-contract"
check = "contract"
severity = "P0"
description = "a live board-approved delivery contract exists"

[[check]]
id = "S14-review"
check = "review"
severity = "P0"
description = "the Phase-G review cites a published standing delegation"

[[check]]
id = "S14-waivers"
check = "waivers"
severity = "P0"
description = "no active waiver is expired or owned by its reviewer"

[[check]]
id = "S14-pi-cadence"
check = "pi_cadence"
severity = "P0"
description = "the project's PI has a cadence row and a backlog-refinement row"

[[check]]
id = "S14-pi-plan"
check = "pi_plan"
severity = "P0"
description = "the project tranche's PI plan is published"

[[check]]
id = "S14-pi-objectives"
check = "pi_objectives"
severity = "P0"
description = "the project tranche's PI objectives are published"

[[check]]
id = "S14-lessons"
check = "lessons"
severity = "P1"
description = "the tranche retro produced at least one lesson"

[[check]]
id = "S14-wsjf"
check = "wsjf"
severity = "P0"
description = "every WBS deliverable of the project carries the four typed WSJF inputs"

[[check]]
id = "S14-demo-credits"
check = "demo_credits"
severity = "P0"
description = "every accepted deliverable has a demo credit carrying its evidence"

[[check]]
id = "S14-product"
check = "product_findings"
severity = "P0"
description = "no open P0 product finding remains for the project"
