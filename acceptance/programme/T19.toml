[project]
key = "T19"
name = "Decision forums (meetings)"
gate = "the meeting is a card plus a typed record: an agenda item that decides names one approval, each qualifying seat records one position, close_item derives the item's outcome by arithmetic over the positions and the linked approval's stricter policy (quorum, required departments, dual control, evidence, conflict exclusion), an observer never counts, a human who requested the gate is always excluded (P4), a quorum miss defers with reason inquorate, an item with no outcome cannot close, and no transcript or chat is a decision; the eight meetings suites and the web room spec pass"
gate_checks = ["T19-project", "T19-baseline", "T19-charter", "T19-closure-outputs", "T19-contract", "T19-review", "T19-closure-gate", "T19-waivers", "T19-pi-cadence", "T19-pi-plan", "T19-pi-objectives", "T19-wsjf", "T19-demo-credits", "T19-lessons", "T19-product", "T19-artefact-standard", "T19-rework"]

[[check]]
id = "T19-project"
check = "project"
status = "closed"
severity = "P0"
description = "T19 is closed"

[[check]]
id = "T19-baseline"
check = "project_baseline"
require_approved = true
severity = "P0"
description = "the scope baseline is approved; the close gate reads the approved row"

[[check]]
id = "T19-charter"
kind = "command"
severity = "P0"
description = "the charter asset exists and the charter gate is approved"
command = '''python3 scripts/programme-record.py --check --action pm.get --input '{"project_id":"01a20c80-b9b8-7214-abc6-f2c4f75a1fc1"}' | python3 -c '
import json,sys
s=sys.stdin.read()
d=json.loads(s[s.find("{"):])
o=d.get("output",d)
assert o.get("charter_asset_id"), "no charter asset"
gates={g.get("gate"):g.get("status") for g in o.get("gates",[])}
assert gates.get("charter")=="approved", gates
'
'''

[[check]]
id = "T19-closure-outputs"
check = "closure_outputs"
severity = "P0"
description = "the declared closure outputs are declared and published"

[[check]]
