[project]
key = "T11"
name = "Metrics, metering and maturity"
gate = "The A–D artefacts, the delivery contract, the closure review and the declared outputs exist; the project re-closes through the one gate."
gate_checks = ["T11-project", "T11-baseline", "T11-charter", "T11-closure-outputs", "T11-contract", "T11-review", "T11-closure-gate", "T11-waivers", "T11-pi-cadence", "T11-pi-plan", "T11-pi-objectives", "T11-wsjf", "T11-demo-credits", "T11-lessons", "T11-product", "T11-artefact-standard", "T11-rework"]
[[check]]
id = "T11-project"
check = "project"
status = "closed"
severity = "P0"
description = "T11 is closed"

[[check]]
id = "T11-baseline"
check = "project_baseline"
require_approved = true
severity = "P0"
description = "the scope baseline is approved; the close gate reads the approved row"

[[check]]
id = "T11-charter"
kind = "command"
severity = "P0"
description = "the charter asset exists and the charter gate is approved"
command = '''python3 scripts/programme-record.py --check --action pm.get --input '{"project_id":"01a1d039-0d36-782b-8b18-ff07a64dedbe"}' | python3 -c '
import json,sys
s=sys.stdin.read()
d=json.loads(s[s.find("{"):])
o=d.get("output",d)
assert o.get("charter_asset_id"), "no charter asset"
gates={g.get("gate"):g.get("status") for g in o.get("gates",[])}
assert gates.get("charter")=="approved", gates
'
'''

[[check]]
id = "T11-closure-outputs"
check = "closure_outputs"
severity = "P0"
description = "the declared closure outputs are declared and published"

[[check]]
id = "T11-contract"
check = "contract"
severity = "P0"
description = "a live board-approved delivery contract exists"

[[check]]
id = "T11-review"
check = "review"
severity = "P0"
description = "the Phase-G review cites a published standing delegation"

[[check]]
id = "T11-closure-gate"
check = "closure_gate"
severity = "P0"
description = "the closure gate was decided by an approver other than its requester"

[[check]]
id = "T11-waivers"
check = "waivers"
severity = "P0"
description = "no active waiver is expired or owned by its reviewer"

[[check]]
id = "T11-pi-cadence"
check = "pi_cadence"
severity = "P0"
description = "the project's PI has a cadence row and a backlog-refinement row"

[[check]]
id = "T11-pi-plan"
check = "pi_plan"
severity = "P0"
description = "the tranche-1 PI plan is published"

[[check]]
id = "T11-pi-objectives"
check = "pi_objectives"
severity = "P0"
description = "the tranche-1 PI objectives are published"

[[check]]
id = "T11-wsjf"
check = "wsjf"
severity = "P0"
description = "every WBS deliverable of the project carries the four typed WSJF inputs"

[[check]]
id = "T11-demo-credits"
check = "demo_credits"
severity = "P0"
description = "every accepted deliverable has a demo credit carrying its evidence"

[[check]]
id = "T11-lessons"
check = "lessons"
severity = "P1"
description = "the tranche-1 retro produced at least one lesson"

[[check]]
id = "T11-product"
check = "product_findings"
severity = "P0"
description = "no open P0 product finding remains for the project"

[[check]]
id = "T11-artefact-standard"
check = "artefact_standard"
severity = "P1"
description = "every mandatory standard artefact this project owns is evidenced"

[[check]]
id = "T11-rework"
check = "rework_resolution"
severity = "P0"
description = "no unresolved P0/P1 rework package remains for the project"
