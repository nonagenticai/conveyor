name: Bug report
description: Something in the conveyor or on the public site is wrong.
title: "bug: <one line>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is the public intake for a defect. A maintainer triages an accepted report into a
        `unit` issue with the full contract; the report itself is linked, never rewritten.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The behaviour you saw, with the smallest reproduction you have.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, the URL or screen, and whether you were signed in.
      placeholder: |
        1. Open https://conveyor.nonagentic.ai/design/
        2. …
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version, and the snapshot hash if the page shows one.
      placeholder: Chrome 142 · snapshot 2a76b92bb3a5
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no credential, personal data or private infrastructure detail.
          required: true
