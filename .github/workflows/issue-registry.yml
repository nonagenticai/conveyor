name: issue-registry

# The public issue registry (`docs/design/data/issues.json`) is a commit-time artefact: the API
# serves it from the image (`crates/api/src/design.rs`), and the design pack checks it
# (`docs/design/scripts/check-data.cjs`). Refreshing it by hand is the step that gets skipped —
# measured 2026-11-16: the Contribute page's ready list lagged GitHub until a session happened to
# run the generators. This workflow runs the sanctioned generators on a schedule and opens ONE
# reviewable, generated-data PR. It never merges.
#
# The zero-secret path (docs/decisions/0003-public-ci.md): the only credential is the automatic
# `GITHUB_TOKEN`, which needs the repository setting
# "Allow GitHub Actions to create and approve pull requests" (can_approve_pull_request_reviews).
# No repository secret is added.
#
# ⛔ A PR created with `GITHUB_TOKEN` does not trigger `pull_request` workflows (GitHub's recursion
# guard), so its required contexts would never be created and it could never merge. The dispatch
# below is the exempt event: `gh workflow run ci-public.yml --ref automation/issue-registry`
# attaches the same contexts to the same head commit, and the generated PR merges through the
# normal gate. Do not remove the dispatch.
#
# Disable with: gh workflow disable issue-registry.yml

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-registry
  # Never cancel mid-run: a cancel after the push but before the PR create leaves a branch with
  # no PR. The job is a few minutes; the next run updates whatever is left.
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the public issue registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Regenerate, then open or update the one generated PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/issues-before.json"
          cp docs/design/data/issues.json "$before"
          git checkout -B automation/issue-registry
          scripts/fetch-issues.sh docs/design/data/issues.json
          # The registry is an input to the programme seed and the measured coverage, and the
          # coverage is an input to the tranche — regenerate the whole set to a fixpoint in this
          # order. MEASURED 2026-11-17: the first generated PR (247) failed `design-pack` because
          # only issues.json was regenerated and coverage.json/coverage.js were stale.
          for _ in 1 2 3; do
            python3 scripts/build-programme-seed.py
            python3 scripts/build-coverage.py
            if python3 scripts/build-coverage.py --check; then
              break
            fi
          done
          python3 scripts/build-coverage.py --check
          python3 scripts/build-v2-coverage.py
          python3 scripts/build-v2-coverage.py --check
          # `--check` needs no pandoc (the design-pack job runs it on the same stock runner); the
          # generator does, and the registry refresh never changes a Markdown source.
          python3 docs/design/scripts/build-docs.py --check
          if [ -z "$(git status --porcelain -- docs/design/data seed/programme.json docs/design/docs)" ]; then
            echo "The registry and its derived data match GitHub; no branch, no PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$before" docs/design/data/issues.json > "$RUNNER_TEMP/pr-body.md" <<'PY'
          import json
          import sys

          before = json.load(open(sys.argv[1], encoding="utf-8"))["issues"]
          after = json.load(open(sys.argv[2], encoding="utf-8"))["issues"]


          def ready(rows):
              return [
                  row["number"]
                  for row in rows
                  if row["state"] == "OPEN"
                  and any(label["name"] == "status:ready" for label in row["labels"])
              ]


          def state(rows):
              return {row["number"]: row["state"] for row in rows}


          old, new = state(before), state(after)
          added = sorted(set(new) - set(old))
          removed = sorted(set(old) - set(new))
          moved = sorted(number for number in set(old) & set(new) if old[number] != new[number])


          def listing(numbers):
              shown = ", ".join(f"#{number}" for number in numbers[:40])
              return shown + (" …" if len(numbers) > 40 else "") if shown else "none"


          print("The public issue registry and its derived design-pack data changed upstream.")
          print()
          print("Generated by `.github/workflows/issue-registry.yml`: `scripts/fetch-issues.sh`,")
          print("then the programme seed, the measured coverage, the V2 coverage and the docs in")
          print("their fixpoint order; no hand edits. The registry carries no issue bodies or")
          print("authors; `check-data.cjs` enforces the redaction.")
          print()
          print("| | before | after |")
          print("|---|---|---|")
          print(f"| issues | {len(before)} | {len(after)} |")
          print(f"| open + `status:ready` | {len(ready(before))} | {len(ready(after))} |")
          print()
          print(f"- Added: {listing(added)}")
          print(f"- Closed or reopened: {listing(moved)}")
          print(f"- Removed: {listing(removed)}")
          print()
          print("The workflow dispatches `ci-public` on this branch so the required contexts exist")
          print("on this head (a `GITHUB_TOKEN`-created PR triggers no `pull_request` workflow):")
          print("`checks` runs the suite, `image` builds without pushing, `service-image` builds")
          print("and smokes, and `design-pack` validates the file. Merging rebuilds the image, which")
          print("is how the public design page receives it. This PR is generated and is never")
          print("auto-merged; a maintainer merges it.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "docs: refresh the public issue registry and its derived data (automated)"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/automation/issue-registry"
          open="$(gh pr list --repo "$REPO" --head automation/issue-registry --state open --json number --jq '.[].number')"
          if [ -n "$open" ]; then
            gh pr edit "$open" --repo "$REPO" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Updated the open generated PR #$open." >> "$GITHUB_STEP_SUMMARY"
          else
            # A closed-without-merge PR wedges `gh pr create` (422 "already exists" for this
            # head); reopen it instead of failing every day. Merged PRs are excluded.
            closed="$(gh pr list --repo "$REPO" --head automation/issue-registry --state closed \
              --json number,mergedAt --jq '[.[] | select(.mergedAt == null)][0].number')"
            if [ -n "$closed" ]; then
              gh pr reopen "$closed" --repo "$REPO"
              gh pr edit "$closed" --repo "$REPO" --body-file "$RUNNER_TEMP/pr-body.md"
              echo "Reopened the closed generated PR #$closed." >> "$GITHUB_STEP_SUMMARY"
            else
              gh pr create --repo "$REPO" --base main --head automation/issue-registry \
                --title "docs: refresh the public issue registry (automated)" \
                --body-file "$RUNNER_TEMP/pr-body.md"
            fi
          fi
          # Recursion-guard exemption: `pull_request` workflows do not run for a PR created with
          # `GITHUB_TOKEN`, so nothing would create the required contexts. `workflow_dispatch` is
          # exempt; this run attaches them to the same head commit.
          gh workflow run ci-public.yml --repo "$REPO" --ref automation/issue-registry
