name: issue-registry

# The public issue registry (`docs/design/data/issues.json`) is a commit-time artefact: the API
# serves it from the image (`crates/api/src/design.rs`), and the design pack checks it
# (`docs/design/scripts/check-data.cjs`). Refreshing it by hand is the step that gets skipped —
# measured 2026-11-16: the Contribute page's ready list lagged GitHub until a session happened to
# run the generators. This workflow runs the sanctioned generators on a schedule and opens ONE
# reviewable, generated-data PR. It never merges.
#
# ⛔ THE SCHEDULE ALONE IS NOT ENOUGH. GitHub's `schedule` event is best-effort, and this repo
# drops most of its triggers: measured 2026-11-17, the hourly `board` cron (live since
# 2026-11-15T19:35Z) produced 5 runs in ~35 h, and the 04:23Z trigger here produced none. A merge
# to `main` is the event that always fires, so this workflow also runs on every push to `main`.
# Both extra cases are cheap: the no-change path below exits without a branch and without a PR.
#
# The zero-secret path (docs/decisions/0003-public-ci.md): the only credential is the automatic
# `GITHUB_TOKEN`, which needs the repository setting
# "Allow GitHub Actions to create and approve pull requests" (can_approve_pull_request_reviews).
# No repository secret is added.
#
# ⛔ A PR created with `GITHUB_TOKEN` gets a `pull_request` run that is created but parked at
# `action_required` — its jobs never start, so no required context reports. Approving that run
# starts it, and its checks associate with the PR; a `workflow_dispatch` run's checks attach to
# the commit but do NOT associate with the PR (measured 2026-11-17: the generated PR stayed
# BLOCKED until the parked run was approved). The step below approves the parked run and keeps
# the dispatch only as a fallback when none appears.
#
# Disable with: gh workflow disable issue-registry.yml

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-registry
  # Never cancel mid-run: a cancel after the push but before the PR create leaves a branch with
  # no PR. The job is a few minutes; the next run updates whatever is left.
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the public issue registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Regenerate, then open or update the one generated PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/issues-before.json"
          cp docs/design/data/issues.json "$before"
          # Find the ONE open generated PR — on the fixed head or a timestamped one — before
          # choosing the branch. A closed generated PR is NEVER reopened: its branch may have
          # been force-pushed, and GitHub then refuses `gh pr reopen` for good (measured:
          # #355, #367). With no open PR the run uses a fresh timestamped branch and opens a
          # new PR from it.
          open_prs="$(gh pr list --repo "$REPO" --state open --limit 100 --json number,headRefName)"
          open="$(printf '%s' "$open_prs" | jq -r '[.[] | select(.headRefName | startswith("automation/issue-registry"))][0].number // empty')"
          head_branch="$(printf '%s' "$open_prs" | jq -r '[.[] | select(.headRefName | startswith("automation/issue-registry"))][0].headRefName // empty')"
          if [ -z "$head_branch" ]; then
            head_branch="automation/issue-registry-$(date -u +%Y%m%dT%H%M%SZ)"
          fi
          # ⛔ A branch whose PR is IN THE MERGE QUEUE cannot be updated: GitHub answers
          # `GH006: Protected branch update failed … A pull request for this branch has been
          # added to a merge queue`. This workflow runs on every push to main, so a busy queue
          # turned it red over and over (measured 2026-11-19: run 44495172473 at 09:18Z, while
          # 09:27Z and 09:35Z were green — the same code, a different queue state). A queued
          # generated PR is already the deliverable; the refresh resumes on the next push after
          # the queue lands. Checked BEFORE the regeneration so a no-op run costs seconds.
          if [ -n "$open" ]; then
            # `$owner`/`$name`/`$number` are GraphQL variables the `-f` flags bind, not shell
            # expansions — the single quotes are deliberate (SC2016 is a false positive here).
            # shellcheck disable=SC2016
            queued="$(gh api graphql \
              -f query='query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) { mergeQueueEntry { state } }
                }
              }' \
              -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F number="$open" \
              --jq '.data.repository.pullRequest.mergeQueueEntry.state // empty')"
            if [ -n "$queued" ]; then
              echo "Generated PR #$open ($head_branch) is in the merge queue ($queued); nothing to update this run." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          git checkout -B "$head_branch"
          scripts/fetch-issues.sh docs/design/data/issues.json
          # The registry is an input to the programme seed and the measured coverage, and the
          # coverage is an input to the tranche — regenerate the whole set to a fixpoint in this
          # order. MEASURED 2026-11-17: the first generated PR (247) failed `design-pack` because
          # only issues.json was regenerated and coverage.json/coverage.js were stale.
          for _ in 1 2 3; do
            python3 scripts/build-programme-seed.py
            python3 scripts/build-coverage.py
            if python3 scripts/build-coverage.py --check; then
              break
            fi
          done
          python3 scripts/build-coverage.py --check
          python3 scripts/build-v2-coverage.py
          python3 scripts/build-v2-coverage.py --check
          # `--check` needs no pandoc (the design-pack job runs it on the same stock runner); the
          # generator does, and the registry refresh never changes a Markdown source.
          python3 docs/design/scripts/build-docs.py --check
          if [ -z "$(git status --porcelain -- docs/design/data seed/programme.json docs/design/docs)" ]; then
            echo "The registry and its derived data match GitHub; no branch, no PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$before" docs/design/data/issues.json > "$RUNNER_TEMP/pr-body.md" <<'PY'
          import json
          import sys

          before = json.load(open(sys.argv[1], encoding="utf-8"))["issues"]
          after = json.load(open(sys.argv[2], encoding="utf-8"))["issues"]


          def ready(rows):
              return [
                  row["number"]
                  for row in rows
                  if row["state"] == "OPEN"
                  and any(label["name"] == "status:ready" for label in row["labels"])
              ]


          def state(rows):
              return {row["number"]: row["state"] for row in rows}


          old, new = state(before), state(after)
          added = sorted(set(new) - set(old))
          removed = sorted(set(old) - set(new))
          moved = sorted(number for number in set(old) & set(new) if old[number] != new[number])


          def listing(numbers):
              shown = ", ".join(f"#{number}" for number in numbers[:40])
              return shown + (" …" if len(numbers) > 40 else "") if shown else "none"


          print("The public issue registry and its derived design-pack data changed upstream.")
          print()
          print("Generated by `.github/workflows/issue-registry.yml`: `scripts/fetch-issues.sh`,")
          print("then the programme seed, the measured coverage, the V2 coverage and the docs in")
          print("their fixpoint order; no hand edits. The registry carries no issue bodies or")
          print("authors; `check-data.cjs` enforces the redaction.")
          print()
          print("| | before | after |")
          print("|---|---|---|")
          print(f"| issues | {len(before)} | {len(after)} |")
          print(f"| open + `status:ready` | {len(ready(before))} | {len(ready(after))} |")
          print()
          print(f"- Added: {listing(added)}")
          print(f"- Closed or reopened: {listing(moved)}")
          print(f"- Removed: {listing(removed)}")
          print()
          print("The workflow approves the parked `pull_request` run so its checks associate with")
          print("this PR (`checks`, `image` without a push, `service-image` build+smoke,")
          print("`design-pack`, `lint`). If the approval is refused, a maintainer approves the run")
          print("from the PR's checks list. Merging rebuilds the image, which is how the public")
          print("design page receives it. This PR is generated and is never auto-merged.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "docs: refresh the public issue registry and its derived data (automated)"
          # The queue can reach the PR between the check above and this push (the run takes
          # minutes). That ONE refusal is a no-op, not a failure; every other push failure still
          # fails the step.
          if ! git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${head_branch}" 2>"$RUNNER_TEMP/push.err"; then
            if grep -q 'GH006' "$RUNNER_TEMP/push.err" && grep -q 'merge queue' "$RUNNER_TEMP/push.err"; then
              echo "Generated PR #$open is in the merge queue; the push was refused (GH006). Nothing to do." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cat "$RUNNER_TEMP/push.err"
            exit 1
          fi
          if [ -n "$open" ]; then
            gh pr edit "$open" --repo "$REPO" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Updated the open generated PR #$open ($head_branch)." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --repo "$REPO" --base main --head "$head_branch" \
              --title "docs: refresh the public issue registry (automated)" \
              --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Opened a generated PR from the fresh branch $head_branch." >> "$GITHUB_STEP_SUMMARY"
          fi
          # A `pull_request` run's checks associate with the PR; a dispatch run's do not. Approve
          # the parked run so the required contexts land on the pull request itself.
          head="$(git rev-parse HEAD)"
          parked=""
          # ⛔ SIX POLLS OF 5 s IS TOO SHORT. The held run is not reported as `action_required` the
          # moment it is created — measured 2026-11-17: run 44059172812 was created 09:49:56Z and
          # still had no settled conclusion when the last poll ran (~09:50:23Z), so the fallback
          # dispatched CI and the generated PR (#271) had no required contexts at all. The same run
          # accepted the approval minutes later, so only the window was wrong. Five minutes is far
          # beyond any observed settling time.
          for _ in $(seq 1 60); do
            parked="$(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request" \
              --jq '[.workflow_runs[] | select(.conclusion == "action_required") | .id] | first // empty')"
            if [ -n "$parked" ]; then
              break
            fi
            sleep 5
          done
          if [ -n "$parked" ]; then
            if gh api -X POST "repos/$REPO/actions/runs/$parked/approve" >/dev/null; then
              echo "Approved the parked pull_request run $parked; its checks associate with the PR." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "The parked pull_request run $parked needs a maintainer's approval." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No parked pull_request run appeared; dispatching CI (its checks do not associate with the PR)." >> "$GITHUB_STEP_SUMMARY"
            gh workflow run ci-public.yml --repo "$REPO" --ref automation/issue-registry
          fi

  # The programme's one GitHub face (#433). A separate job on purpose: it reads the seed committed
  # on `main`, so the table can never describe a generated PR that has not merged. An issue body
  # needs no PR — it is the same rows the public download serves, and it is deterministic.
  programme-issue:
    name: Sync the tracked programme issue
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Create the tracked issue once, then update it only when a row changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build-programme-view.py --sync
