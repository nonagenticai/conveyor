[package]
name = "conveyor-deck"
description = "One deck model -> deterministic OOXML (.pptx), fixed v1 layouts (ADR 0007 §7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `JsonSchema` is a derive from schemars; the rest are the model's serde shape and its typed
# refusals. Deliberately no zip crate: `src/zip.rs` writes the stored archive itself so the
# determinism contract is a property of this code, not a feature flag of a dependency.
conveyor-render = { path = "../render" }
# #366: the stored-ZIP writer moved here so the `.xlsx` writer emits the same deterministic
# archive rather than a second implementation of the same contract.
conveyor-zipstore = { path = "../zipstore" }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
