[package]
name = "conveyor-sheets"
description = "One workbook model -> deterministic OOXML (.xlsx), and a real workbook read back."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# READING a real workbook: deflated parts, shared strings, relationships and style-resolved
# dates. WRITING is ours — `conveyor-zipstore` plus this crate — because byte-for-byte
# reproducibility of what conveyor produces is a contract, not a dependency feature flag.
calamine = { workspace = true }
conveyor-zipstore = { path = "../zipstore" }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The round-trip property over generated workbooks.
proptest = { workspace = true }
# The fixture writer deflates its parts, so the reader's inflate path is exercised by a
# producer that is not our own stored-ZIP writer.
flate2 = "1.1.11"
