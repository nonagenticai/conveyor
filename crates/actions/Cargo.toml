[package]
name = "conveyor-actions"
description = "ActionSpec, registry, invocation, MCP projection and external OpenAPI ingest (S04)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
conveyor-actions-derive = { path = "../actions-derive" }
conveyor-auth = { path = "../auth" }
# #161 P3: `decks.render` renders the deck model; the action layer holds no OOXML writer.
conveyor-deck = { path = "../deck" }
# #366: `sheets.export` and `sheets.import` — the workbook model, its writer and its reader.
conveyor-sheets = { path = "../sheets" }
conveyor-domain = { path = "../domain" }
# #172 (T7): the bare-metal host client behind `ops.host_*` — the forced-command agent session
# and the pinned host key live there, not in this crate.
conveyor-host = { path = "../host" }
# #170 (T7): the cluster operations client behind `ops.*` — the credential, the fail-closed
# configuration and the read transport live there, not in this crate.
conveyor-ops = { path = "../ops" }
# #163 P3: `produce.script` binds the model's prose to shot ids the library derives; the id and
# budget rules live there, free of transport, and are tested without a model.
conveyor-produce = { path = "../produce" }
conveyor-workflow = { path = "../workflow" }
# `analyse.site` calls the analysis library (ADR 0007 §5). The edge is one-way and the library
# is pure, so this adds no transport, no connection and no clock to the action surface.
conveyor-analysis = { path = "../analysis" }
# The three exchange actions (S08 B2) call the pure renderer; CONTRACT §1 records the edge.
conveyor-render = { path = "../render" }
conveyor-store = { path = "../store" }
base64 = { workspace = true }
chrono = { workspace = true }
http = { workspace = true }
inventory = { workspace = true }
openapiv3 = { workspace = true }
# S09: the object-store client and the external-action breaker.
object_store = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
# `position` is `numeric`; the actions layer formats it for the wire and seeds a board
# position. All midpoint arithmetic still happens in `store::position` on `Decimal`.
rust_decimal = { workspace = true }
rmcp = { workspace = true }
# T13 P4: a tool version's closed schema may carry `pattern`; the one validator reads it before
# the broker makes any network call.
regex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# The GitHub blob SHA in the publish delta.
sha1 = { workspace = true }
# T16's BPMN 2.0 reader: a pull parser that never resolves an external entity (the same pin
# crates/render uses for XMI).
quick-xml = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
# The eval export writes a gzip JSONL bundle (S19 Part C step 15); the same crate the parity
# gate's banked-log reader uses.
flate2 = "1.1.11"

[dev-dependencies]
tar = "0.4.46"
# #172's host tests run the client against a stand-in `ssh`, so the harness needs a tempdir for
# the key, the pinned `known_hosts` and the script itself.
tempfile = "3.27.0"
# The bus tests (`tests/bus_delivery.rs`) publish and consume through the real port against a real
# Redis, so the transport is exercised rather than a mock of it.
conveyor-bus = { path = "../bus" }
# The integration tests start a real HTTP server, so they need the composition root's
# router. A dev-dependency cycle (api → actions) is legal: the cycle is broken in the test
# target, and it is the only way `cargo test -p conveyor-actions` can exercise HTTP and MCP.
conveyor-api = { path = "../api" }
axum = { workspace = true }
tower = { workspace = true }
# #412: the metered-drain tests build a slow SSE-style body from a channel, so the drop of the
# reader is observable as a failed send rather than inferred.
tokio-stream = { workspace = true }
