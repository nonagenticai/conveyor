# structure_analysis — uses tools to evaluate the structure of the codebase (schema: seed/processes/README.md).
#
# Content sources: seed/catalogue.json (the type's inputs/outputs/acceptance and rules
# container_read_exec, no_reclassify_target) and
# n8n-designs/design/choices/v4/capabilities/analysis.yaml (text, phase, item_kinds, inspect
# criteria). Items are architecture, coupling, layout, dependency and library; the refactorings
# that follow are planned from the report in a later phase, never created here.
card_type: structure_analysis
capability: analysis
outputs:
  - draft_artifact_id
  - report_artifact_id
  - published_artifact_id

agent:
  key: structure_analysis
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: structure_analysis.ready
    title: Structure analysis — definition of ready
    definition_of_ready: {checks: [scope_paths_exist]}
    definition_of_done: {checks: [scope_paths_read]}
    acceptance_criteria:
      - {name: scope_paths_exist, text: "Every path in the card's scope exists in the imported workspace, or the analysis names it as missing before it reads anything else."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []

  - key: structure_analysis.doing
    title: Structure analysis — definition of doing
    definition_of_ready: {checks: [scope_paths_read]}
    definition_of_done: {checks: [every_finding_cites_evidence, every_cited_path_exists, every_finding_is_structural]}
    acceptance_criteria:
      - {name: every_finding_cites_evidence, text: "Every structural problem cites the imports, paths or manifest entries that show it."}
      - {name: every_cited_path_exists, text: "Every path a finding cites exists in the workspace at the revision analysed."}
      - {name: every_finding_is_structural, text: "Every finding is about architecture, coupling, layout, dependencies or libraries, not about style or naming."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: structure_analysis.qa
    title: Structure analysis — definition of QA
    definition_of_ready: {checks: [every_finding_cites_evidence]}
    definition_of_done: {checks: [every_confirmed_location_exists, capability_acceptance_met]}
    acceptance_criteria:
      - {name: every_confirmed_location_exists, text: "Every problem the report confirms names paths that exist in the revision analysed."}
      - {name: capability_acceptance_met, text: "The report is true of every acceptance statement the structure analysis card type declares."}
      - {name: findings_located, text: "Every confirmed problem names the paths it spans and, when there is one, the function."}
      - {name: findings_are_structural, text: "Every confirmed problem is about architecture, coupling, layout, dependencies or libraries, not style or naming."}
      - {name: proposed_change_preserves_behaviour, text: "Every confirmed problem's proposed change removes it without changing behaviour."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [report_artifact_id]

  - key: structure_analysis.done
    title: Structure analysis — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [artifact_is_qa_version]}
    acceptance_criteria:
      - {name: artifact_is_qa_version, text: "The report published to the card is the exact revision QA reviewed; no problem was added, dropped or reworded after the review."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [published_artifact_id]

  - key: structure_analysis.system
    title: Structure analysis — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: structure_analysis.READY
    list: ready
    title: Structure analysis — ready
    outputs: []
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: structure_analysis
        sop: structure_analysis.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: structure_analysis.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: structure_analysis.DOING
    list: doing
    title: Structure analysis — doing
    outputs: [draft_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: structure_analysis, sop: structure_analysis.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: structure_analysis, sop: structure_analysis.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: structure_analysis, sop: structure_analysis.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: structure_analysis, sop: structure_analysis.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: structure_analysis.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: structure_analysis.QA
    list: qa
    title: Structure analysis — QA
    outputs: [report_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: structure_analysis, sop: structure_analysis.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: structure_analysis, sop: structure_analysis.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: structure_analysis, sop: structure_analysis.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: structure_analysis, sop: structure_analysis.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: structure_analysis.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: structure_analysis.DONE
    list: done
    title: Structure analysis — done
    outputs: [published_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: structure_analysis, sop: structure_analysis.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: structure_analysis, sop: structure_analysis.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: structure_analysis, sop: structure_analysis.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: structure_analysis, sop: structure_analysis.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: structure_analysis.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
