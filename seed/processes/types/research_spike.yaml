# research_spike — gain knowledge on one question, before anything is built
# (schema: seed/processes/README.md).
#
# Content sources: seed/catalogue.json (card_type research_spike: outputs draft/reviewed/published
# and acceptance outline_within_card_scope, every_claim_cites_a_source, every_cited_source_exists,
# no_unsupported_claims, capability_acceptance_met, artifact_is_qa_version) and
# n8n-designs/design/choices/v4/capabilities/research.yaml (text "gain knowledge on a given topic",
# phase preliminary, upstream none — it is the entry card — sections question / findings / options /
# open_questions / recommendation, signoff false, uses_repo false, uses_knowledge false, and the
# three inspect.criteria the QA stage judges by).
#
# ⚠ `uses_knowledge: false` is not a permission, it is a boundary the document has to live inside:
# the spike has no web tool (HTTP is banned in flows, O-W3-WEB) and no knowledge base to query
# (O-W3-KAG), so its sources are the repository, the cards it can read and the model's own
# knowledge — and the last one has to be said out loud wherever it does the work of a finding.
# That is why DOING splits a sourced claim from a recalled one instead of asking for a citation to
# a thing that does not exist. Every preliminary card that names this spike as its upstream reads
# it, so an open question it leaves is what they inherit, and a finding it marks uncertain is one
# they must not read as settled.
card_type: research_spike
capability: research
outputs:
  - draft_artifact_id
  - reviewed_artifact_id
  - published_artifact_id

agent:
  key: research_spike
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: research_spike.ready
    title: Research spike — definition of ready
    definition_of_ready: {checks: [question_present]}
    definition_of_done: {checks: [outline_within_card_scope]}
    acceptance_criteria:
      - {name: outline_within_card_scope, text: "The outline holds the spike's five sections — question, findings, options, open_questions, recommendation — and its question is the one the card asks, narrowed far enough that a finding could answer it and no wider than the card allows. The outline changes nothing in the repository; this card settles nothing a later card must act on."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []

  - key: research_spike.doing
    title: Research spike — definition of doing
    definition_of_ready: {checks: [outline_within_card_scope]}
    definition_of_done: {checks: [every_claim_cites_a_source, every_cited_source_exists]}
    acceptance_criteria:
      - {name: every_claim_cites_a_source, text: "Every finding names what it rests on: a repository path and symbol the card read, a passage in a card or artifact it read, or the model's own knowledge, which the document must label as recall and not as a finding. A finding with no source moves to open_questions rather than being written as fact."}
      - {name: every_cited_source_exists, text: "Every repository path the document cites resolves at the pinned head the card read, and every card passage it cites is in the version the spike read. The spike has no web tool and no knowledge base (O-W3-WEB, O-W3-KAG), so a source outside the repository, the cards it read and its own recall cannot have been checked: a statement that reads as outside research fails this check even when it is true."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: research_spike.qa
    title: Research spike — definition of QA
    definition_of_ready: {checks: [every_cited_source_exists]}
    definition_of_done: {checks: [answers_the_question, options_compared, open_questions_listed, no_unsupported_claims, capability_acceptance_met]}
    acceptance_criteria:
      - {name: no_unsupported_claims, text: "findings, options and recommendation assert nothing their cited sources do not state, and any claim carried from the model's own knowledge stays marked as recall wherever it changes the recommendation."}
      - {name: answers_the_question, text: "findings and recommendation answer the question the card names, not a neighbouring question the spike found easier to settle; where the question turned out to be two questions, the spike says which one it answered."}
      - {name: options_compared, text: "options lists at least two options with their trade-offs, or says why there is only one — a single-option spike states what would have made a second one worth considering."}
      - {name: open_questions_listed, text: "open_questions lists what the inputs could not settle, including every finding the spike had to mark as recall, or says there is nothing. An open question here is what the downstream cards inherit, so an empty list is a claim the spike has to be able to make."}
      - {name: capability_acceptance_met, text: "The spike meets every acceptance statement the research_spike card type declares for READY, DOING and QA."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [reviewed_artifact_id]

  - key: research_spike.done
    title: Research spike — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [artifact_is_qa_version]}
    acceptance_criteria:
      - {name: artifact_is_qa_version, text: "The spike published to the card is the exact revision QA reviewed; no finding, option, open question or recommendation was added, cut or reworded after the review. Every card that names this spike as its upstream reads the reviewed revision, so an edit made after it is an edit made behind their back."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [published_artifact_id]

  - key: research_spike.system
    title: Research spike — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: research_spike.READY
    list: ready
    title: Research spike — ready
    outputs: []
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: research_spike
        sop: research_spike.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: research_spike.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: research_spike.DOING
    list: doing
    title: Research spike — doing
    outputs: [draft_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: research_spike, sop: research_spike.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: research_spike, sop: research_spike.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: research_spike, sop: research_spike.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: research_spike, sop: research_spike.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: research_spike.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: research_spike.QA
    list: qa
    title: Research spike — QA
    outputs: [reviewed_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: research_spike, sop: research_spike.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: research_spike, sop: research_spike.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: research_spike, sop: research_spike.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: research_spike, sop: research_spike.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: research_spike.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: research_spike.DONE
    list: done
    title: Research spike — done
    outputs: [published_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: research_spike, sop: research_spike.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: research_spike, sop: research_spike.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: research_spike, sop: research_spike.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: research_spike, sop: research_spike.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: research_spike.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
