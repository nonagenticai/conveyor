# feasibility_study — can this be implemented in the repository, and under what conditions
# (schema: seed/processes/README.md).
#
# Content sources: seed/catalogue.json (card_type feasibility_study: outputs draft/reviewed/published
# and acceptance outline_within_card_scope, every_claim_cites_a_source, every_cited_source_exists,
# no_unsupported_claims, capability_acceptance_met, artifact_is_qa_version) and
# n8n-designs/design/choices/v4/capabilities/research.yaml (text "study based on
# prototype_experiment and research_spike outcomes to decide feasibility for implementation into the
# repo", phase preliminary, upstream [research_spike, prototype_experiment], sections question /
# evidence / constraints / verdict / conditions with verdict one of feasible | not_feasible |
# conditional, signoff true, uses_repo false, uses_knowledge false, and the three inspect.criteria
# the QA stage judges by).
#
# `uses_repo: false` is load-bearing: the evidence is the two upstream cards, so DOING may cite a
# prototype measurement but may not re-derive or re-run it — a second measurement taken here is not
# this card's evidence and would silently disagree with the one the prototype reported. `signoff:
# true` is why DONE waits for the approval to be recorded: the verdict is what releases
# implementation work, so it is signed off on the revision QA reviewed, never edited into place.
card_type: feasibility_study
capability: research
outputs:
  - draft_artifact_id
  - reviewed_artifact_id
  - published_artifact_id

agent:
  key: feasibility_study
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: feasibility_study.ready
    title: Feasibility study — definition of ready
    definition_of_ready: {checks: [upstream_research_spike_done, upstream_prototype_experiment_done]}
    definition_of_done: {checks: [outline_within_card_scope]}
    acceptance_criteria:
      - {name: outline_within_card_scope, text: "The outline holds the study's five sections — question, evidence, constraints, verdict, conditions — and its question fixes the decision the card names, in advance, so the verdict has something to be right or wrong about. The outline decides nothing before evidence is assembled and adds no question the card did not ask."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []

  - key: feasibility_study.doing
    title: Feasibility study — definition of doing
    definition_of_ready: {checks: [outline_within_card_scope]}
    definition_of_done: {checks: [every_claim_cites_a_source, every_cited_source_exists]}
    acceptance_criteria:
      - {name: every_claim_cites_a_source, text: "Every item of evidence names the research spike finding or the prototype run it came from, and every constraint names the brief, policy or upstream card that states it. Evidence taken from a prototype run is cited as that run reported it, not re-derived on this card, because a second measurement taken here is not what the prototype measured."}
      - {name: every_cited_source_exists, text: "Every cited finding, measurement, run and artifact version is present in the version of the upstream card the study read. A prototype result cited when no run produced it, or a finding the spike marked uncertain and the study quotes as settled, is reported on the card and kept out of the evidence."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: feasibility_study.qa
    title: Feasibility study — definition of QA
    definition_of_ready: {checks: [every_cited_source_exists]}
    definition_of_done: {checks: [verdict_is_one_word, verdict_follows_evidence, conditions_match_verdict, no_unsupported_claims, capability_acceptance_met]}
    acceptance_criteria:
      - {name: no_unsupported_claims, text: "The verdict, and every sentence under it, claims no more than the evidence section shows. A study whose evidence supports only part of the decision says which part, rather than rounding up to a verdict the evidence cannot carry."}
      - {name: verdict_is_one_word, text: "verdict starts with exactly one of feasible, not_feasible or conditional, before any reason, so the stage that reads it can branch on the word without parsing prose."}
      - {name: verdict_follows_evidence, text: "The verdict is the one the evidence section supports, and the study names the evidence that decided it — if the same evidence would equally have supported a different verdict, the study says what separated them."}
      - {name: conditions_match_verdict, text: "conditions lists every condition that makes implementation viable when the verdict is conditional, and states that there are none when it is feasible or not_feasible. A condition nothing in the evidence could establish is a condition the study has invented to soften its verdict."}
      - {name: capability_acceptance_met, text: "The study meets every acceptance statement the feasibility_study card type declares for READY, DOING and QA."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [reviewed_artifact_id]

  - key: feasibility_study.done
    title: Feasibility study — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [artifact_is_qa_version, signoff_recorded]}
    acceptance_criteria:
      - {name: artifact_is_qa_version, text: "The study published to the card is the exact revision QA reviewed and the sign-off was recorded against; no word of the verdict or the conditions changed after review. A change requested at sign-off sends the card back for review, it is never edited into the published revision."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [published_artifact_id]

  - key: feasibility_study.system
    title: Feasibility study — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: feasibility_study.READY
    list: ready
    title: Feasibility study — ready
    outputs: []
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: feasibility_study
        sop: feasibility_study.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: feasibility_study.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: feasibility_study.DOING
    list: doing
    title: Feasibility study — doing
    outputs: [draft_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: feasibility_study, sop: feasibility_study.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: feasibility_study, sop: feasibility_study.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: feasibility_study, sop: feasibility_study.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: feasibility_study, sop: feasibility_study.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: feasibility_study.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: feasibility_study.QA
    list: qa
    title: Feasibility study — QA
    outputs: [reviewed_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: feasibility_study, sop: feasibility_study.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: feasibility_study, sop: feasibility_study.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: feasibility_study, sop: feasibility_study.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: feasibility_study, sop: feasibility_study.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: feasibility_study.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: feasibility_study.DONE
    list: done
    title: Feasibility study — done
    outputs: [published_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: feasibility_study, sop: feasibility_study.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: feasibility_study, sop: feasibility_study.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: feasibility_study, sop: feasibility_study.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: feasibility_study, sop: feasibility_study.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: feasibility_study.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
