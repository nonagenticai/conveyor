# development_bug_fix — the exemplar type file (schema: seed/processes/README.md).
#
# Content sources: seed/catalogue.json (the type's inputs/outputs/acceptance), and
# n8n-designs/design/choices/v4/capabilities/development.yaml (text, phase, proof, inspect
# criteria). The four-stage ladder is the measured v4 shape: READY = readying + move;
# DOING/QA/DONE = readying → doing → inspecting → releasing + move.
card_type: development_bug_fix
capability: development
outputs:
  - commit_sha
  - pr_number
  - pr_url
  - head_sha
  - fix_report_artifact_id
  - merge_sha

agent:
  key: development_bug_fix
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  # One SOP per stage for the agent steps, plus one mechanical SOP for every computed move.
  - key: development_bug_fix.ready
    title: Bug fix — definition of ready
    definition_of_ready: {checks: [finding_location_exists, planned_files_exist]}
    definition_of_done: {checks: [workspace_imported]}
    acceptance_criteria:
      - {name: finding_location_exists, text: "The finding names a file and symbol that exist in the repository."}
      - {name: planned_files_exist, text: "Every file the plan names exists, or its absence is explained."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: development_bug_fix.doing
    title: Bug fix — definition of doing
    definition_of_ready: {checks: [workspace_imported]}
    definition_of_done: {checks: [regression_test_added, suite_green_after]}
    acceptance_criteria:
      - {name: diff_only_planned_files, text: "The diff touches only the files the plan named."}
      - {name: regression_test_added, text: "The diff adds a test that exercises the finding's symptom."}
      - {name: failed_before_on_new_test_only, text: "The new test fails before the fix and only it fails."}
      - {name: suite_green_after, text: "The suite is green after the fix."}
      - {name: change_is_minimal, text: "The diff changes only what the finding's root cause needs, plus the regression test."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [pr_number, pr_url, head_sha]

  - key: development_bug_fix.qa
    title: Bug fix — definition of QA
    definition_of_ready: {checks: [regression_test_added]}
    definition_of_done: {checks: [fix_addresses_root_cause, capability_acceptance_met]}
    acceptance_criteria:
      - {name: fix_addresses_root_cause, text: "The diff removes the finding's root cause, not its symptom."}
      - {name: capability_acceptance_met, text: "Every acceptance statement for the card type is true."}
      - {name: no_unrelated_behaviour_change, text: "The diff changes no behaviour outside the finding's function, except what the fix needs."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [fix_report_artifact_id]

  - key: development_bug_fix.done
    title: Bug fix — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [pr_merged]}
    acceptance_criteria:
      - {name: pr_merged, text: "The pull request is merged and its merge sha is recorded."}
    inspection: {kind: checker, rule: non_empty}
    outputs: [merge_sha]

  - key: development_bug_fix.system
    title: Bug fix — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: development_bug_fix.READY
    list: ready
    title: Bug fix — ready
    outputs: [draft_artifact_id]
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: development_bug_fix
        sop: development_bug_fix.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: development_bug_fix.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: development_bug_fix.DOING
    list: doing
    title: Bug fix — doing
    outputs: [pr_number, pr_url, head_sha]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: development_bug_fix, sop: development_bug_fix.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: development_bug_fix, sop: development_bug_fix.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: development_bug_fix, sop: development_bug_fix.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: development_bug_fix, sop: development_bug_fix.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: development_bug_fix.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: development_bug_fix.QA
    list: qa
    title: Bug fix — QA
    outputs: [fix_report_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: development_bug_fix, sop: development_bug_fix.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: development_bug_fix, sop: development_bug_fix.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: development_bug_fix, sop: development_bug_fix.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: development_bug_fix, sop: development_bug_fix.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: development_bug_fix.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: development_bug_fix.DONE
    list: done
    title: Bug fix — done
    outputs: [merge_sha]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: development_bug_fix, sop: development_bug_fix.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: development_bug_fix, sop: development_bug_fix.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: development_bug_fix, sop: development_bug_fix.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: development_bug_fix, sop: development_bug_fix.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: development_bug_fix.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
