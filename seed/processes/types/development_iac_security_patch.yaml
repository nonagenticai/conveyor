# development_iac_security_patch — fix an IaC misconfiguration (schema: seed/processes/README.md).
#
# Content sources: seed/catalogue.json (card_type development_iac_security_patch: outputs and
# acceptance) and n8n-designs/design/choices/v4/capabilities/development.yaml (text "fix an
# infrastructure-as-code misconfiguration and open a pull request", phase execution, proof
# iac_rescan, test_files none, inspect criteria). The card arrives from a security_analysis item
# of kind iac; no test file is planned or changed, and QA's proof is a fresh rescan of the item's
# file in the QA workspace where the item's trivy-iac rule is gone (R227).
card_type: development_iac_security_patch
capability: development
outputs:
  - commit_sha
  - pr_number
  - pr_url
  - head_sha
  - fix_report_artifact_id
  - merge_sha

agent:
  key: development_iac_security_patch
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: development_iac_security_patch.ready
    title: IaC security patch — definition of ready
    definition_of_ready: {checks: [finding_file_exists, planned_files_exist]}
    definition_of_done: {checks: [workspace_imported]}
    acceptance_criteria:
      - {name: finding_file_exists, text: "The security_analysis item names an IaC file that exists in the imported workspace."}
      - {name: planned_files_exist, text: "Every file the plan names exists in the imported workspace, including any module the misconfigured resource calls."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: development_iac_security_patch.doing
    title: IaC security patch — definition of doing
    definition_of_ready: {checks: [workspace_imported]}
    definition_of_done: {checks: [suite_green_after, rule_not_reported_after]}
    acceptance_criteria:
      - {name: diff_only_planned_files, text: "The diff touches only the IaC files the plan named for the misconfiguration."}
      - {name: suite_green_before, text: "The suite is green on the base revision before any IaC change is made."}
      - {name: suite_green_after, text: "The full suite is green after the patch on the same revision the diff is measured against."}
      - {name: rule_not_reported_after, text: "A rescan of the item's file in the fresh QA workspace reports none of the trivy-iac rule the item names."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [pr_number, pr_url, head_sha]

  - key: development_iac_security_patch.qa
    title: IaC security patch — definition of QA
    definition_of_ready: {checks: [rule_not_reported_after]}
    definition_of_done: {checks: [change_fixes_misconfiguration, capability_acceptance_met]}
    acceptance_criteria:
      - {name: change_fixes_misconfiguration, text: "The finding's misconfiguration is gone at its file, and the fix does not silence the scanner or drop the scan scope."}
      - {name: capability_acceptance_met, text: "Every acceptance statement the development iac security patch card type declares is true of the patch, including the rescan's clean result."}
      - {name: misconfiguration_fixed, text: "The diff fixes the misconfiguration the item's rule names instead of silencing the scanner."}
      - {name: change_is_minimal, text: "The diff changes only the resource or setting the item names."}
      - {name: needed_resources_kept, text: "The diff deletes no resource the system still needs."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [fix_report_artifact_id]

  - key: development_iac_security_patch.done
    title: IaC security patch — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [pr_merged]}
    acceptance_criteria:
      - {name: pr_merged, text: "The pull request is squash-merged and the patch's merge sha is recorded on the card."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [merge_sha]

  - key: development_iac_security_patch.system
    title: IaC security patch — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: development_iac_security_patch.READY
    list: ready
    title: IaC security patch — ready
    outputs: [draft_artifact_id]
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: development_iac_security_patch
        sop: development_iac_security_patch.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: development_iac_security_patch.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: development_iac_security_patch.DOING
    list: doing
    title: IaC security patch — doing
    outputs: [pr_number, pr_url, head_sha]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: development_iac_security_patch, sop: development_iac_security_patch.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: development_iac_security_patch, sop: development_iac_security_patch.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: development_iac_security_patch, sop: development_iac_security_patch.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: development_iac_security_patch, sop: development_iac_security_patch.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: development_iac_security_patch.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: development_iac_security_patch.QA
    list: qa
    title: IaC security patch — QA
    outputs: [fix_report_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: development_iac_security_patch, sop: development_iac_security_patch.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: development_iac_security_patch, sop: development_iac_security_patch.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: development_iac_security_patch, sop: development_iac_security_patch.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: development_iac_security_patch, sop: development_iac_security_patch.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: development_iac_security_patch.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: development_iac_security_patch.DONE
    list: done
    title: IaC security patch — done
    outputs: [merge_sha]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: development_iac_security_patch, sop: development_iac_security_patch.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: development_iac_security_patch, sop: development_iac_security_patch.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: development_iac_security_patch, sop: development_iac_security_patch.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: development_iac_security_patch, sop: development_iac_security_patch.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: development_iac_security_patch.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
