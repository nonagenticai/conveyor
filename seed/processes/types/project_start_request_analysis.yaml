# project_start_request_analysis — the card `projects.create` files and starts (S13 §5.8).
#
# The start card carries the project's brief (problem statement, desired outcome, success
# criteria, scope). READY analyses the brief; the move that ends READY puts the card in the
# board's `active` lane, where the project's own card types take over.
card_type: project_start_request_analysis
capability: project_management
outputs: []

agent:
  key: project_start_request_analysis
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: project_start_request_analysis.ready
    title: Start request — definition of ready
    definition_of_ready: {checks: [brief_present]}
    definition_of_done: {checks: [brief_unchanged]}
    acceptance_criteria:
      - {name: brief_unchanged, text: "The analysis adds no requirement the brief did not state."}
      - {name: scope_is_stated, text: "The analysis names what is in scope and what is not."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []

  - key: project_start_request_analysis.doing
    title: Start request — definition of doing
    definition_of_ready: {checks: [brief_unchanged]}
    definition_of_done: {checks: [gaps_identified]}
    acceptance_criteria:
      - {name: every_gap_named, text: "Every question the brief leaves open is written as a gap."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []

  - key: project_start_request_analysis.qa
    title: Start request — definition of QA
    definition_of_ready: {checks: [gaps_identified]}
    definition_of_done: {checks: [no_open_approval_on_card, all_gaps_closed]}
    acceptance_criteria:
      - {name: no_open_approval_on_card, text: "The card has no approval waiting on a person."}
      - {name: all_gaps_closed, text: "Every gap the analysis named is answered or explicitly deferred."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []

  - key: project_start_request_analysis.done
    title: Start request — definition of done
    definition_of_ready: {checks: [all_gaps_closed]}
    definition_of_done: {checks: [brief_accepted]}
    acceptance_criteria:
      - {name: brief_accepted, text: "The project's brief is accepted and the card is released."}
    inspection: {kind: checker, rule: non_empty}
    outputs: []

  - key: project_start_request_analysis.system
    title: Start request — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: project_start_request_analysis.READY
    list: ready
    title: Start request — ready
    outputs: []
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: project_start_request_analysis
        sop: project_start_request_analysis.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: project_start_request_analysis.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: project_start_request_analysis.DOING
    list: doing
    title: Start request — doing
    outputs: []
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: project_start_request_analysis, sop: project_start_request_analysis.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: project_start_request_analysis, sop: project_start_request_analysis.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: project_start_request_analysis, sop: project_start_request_analysis.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: project_start_request_analysis, sop: project_start_request_analysis.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: project_start_request_analysis.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: project_start_request_analysis.QA
    list: qa
    title: Start request — QA
    outputs: []
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: project_start_request_analysis, sop: project_start_request_analysis.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: project_start_request_analysis, sop: project_start_request_analysis.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: project_start_request_analysis, sop: project_start_request_analysis.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: project_start_request_analysis, sop: project_start_request_analysis.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: project_start_request_analysis.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: project_start_request_analysis.DONE
    list: done
    title: Start request — done
    outputs: []
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: project_start_request_analysis, sop: project_start_request_analysis.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: project_start_request_analysis, sop: project_start_request_analysis.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: project_start_request_analysis, sop: project_start_request_analysis.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: project_start_request_analysis, sop: project_start_request_analysis.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: project_start_request_analysis.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
