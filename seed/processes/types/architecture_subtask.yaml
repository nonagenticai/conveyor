# architecture_subtask — applies the task's directive to one piece of work (v4 P-W4-1, design phase).
#
# Content sources: seed/catalogue.json (card_type architecture_subtask: outputs and acceptance) and
# n8n-designs/design/choices/v4/capabilities/architecture.yaml (text, sections, upstream
# architecture_task, inspect.criteria). A subtask is a document, not code work: the development
# cards it names do the code. Its upstream task must exist, so READY starts from that directive.
card_type: architecture_subtask
capability: architecture
outputs:
  - draft_artifact_id
  - reviewed_artifact_id
  - published_artifact_id

agent:
  key: architecture_subtask
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: architecture_subtask.ready
    title: Architecture subtask — definition of ready
    definition_of_ready: {checks: [task_directive_present]}
    definition_of_done: {checks: [outline_within_card_scope]}
    acceptance_criteria:
      - {name: outline_within_card_scope, text: "The outline covers only the subtask's five sections — scope, decision, interfaces, tasks and open_questions — and answers no question the task left open."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: architecture_subtask.doing
    title: Architecture subtask — definition of doing
    definition_of_ready: {checks: [outline_within_card_scope]}
    definition_of_done: {checks: [every_claim_cites_a_source, every_cited_source_exists]}
    acceptance_criteria:
      - {name: every_claim_cites_a_source, text: "Every interface and every decision the subtask records names the upstream task passage, repository module or function it rests on."}
      - {name: every_cited_source_exists, text: "Every cited module, function or endpoint exists at the commit the card fixed and says what the subtask says it says."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id, reviewed_artifact_id]

  - key: architecture_subtask.qa
    title: Architecture subtask — definition of QA
    definition_of_ready: {checks: [every_cited_source_exists]}
    definition_of_done: {checks: [no_unsupported_claims, decision_follows_directive, interfaces_located, tasks_are_workable, capability_acceptance_met]}
    acceptance_criteria:
      - {name: no_unsupported_claims, text: "The subtask records no interface, decision or work item that no cited source supports."}
      - {name: decision_follows_directive, text: "decision applies the upstream task's directive_for_subtasks to this card's scope."}
      - {name: interfaces_located, text: "Every interface names its module, function or endpoint, with its repository path when it exists."}
      - {name: tasks_are_workable, text: "Every item in tasks is one concrete piece of work a development card can take."}
      - {name: capability_acceptance_met, text: "The subtask meets every acceptance statement the architecture_subtask card type declares."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [reviewed_artifact_id, published_artifact_id]

  - key: architecture_subtask.done
    title: Architecture subtask — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [artifact_is_qa_version]}
    acceptance_criteria:
      - {name: artifact_is_qa_version, text: "The subtask published to the development cards it feeds is the version QA approved; no interface or work item changed after review."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [published_artifact_id]

  - key: architecture_subtask.system
    title: Architecture subtask — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: architecture_subtask.READY
    list: ready
    title: Architecture subtask — ready
    outputs: [draft_artifact_id]
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: architecture_subtask
        sop: architecture_subtask.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: architecture_subtask.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: architecture_subtask.DOING
    list: doing
    title: Architecture subtask — doing
    outputs: [draft_artifact_id, reviewed_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_subtask, sop: architecture_subtask.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_subtask, sop: architecture_subtask.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_subtask, sop: architecture_subtask.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_subtask, sop: architecture_subtask.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: architecture_subtask.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: architecture_subtask.QA
    list: qa
    title: Architecture subtask — QA
    outputs: [reviewed_artifact_id, published_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_subtask, sop: architecture_subtask.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_subtask, sop: architecture_subtask.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_subtask, sop: architecture_subtask.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_subtask, sop: architecture_subtask.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: architecture_subtask.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: architecture_subtask.DONE
    list: done
    title: Architecture subtask — done
    outputs: [published_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_subtask, sop: architecture_subtask.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_subtask, sop: architecture_subtask.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_subtask, sop: architecture_subtask.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_subtask, sop: architecture_subtask.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: architecture_subtask.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
