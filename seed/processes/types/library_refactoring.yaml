# library_refactoring — change the library choices and version configuration a manifest declares
# (schema: seed/processes/README.md).
#
# Content sources: seed/catalogue.json (card_type library_refactoring: outputs and acceptance) and
# n8n-designs/design/choices/v4/capabilities/refactoring.yaml (text "refactoring of library choices
# and library version configurations", phase execution, proof package_upgrade, test_files none,
# inspect criteria). The card carries one item of a structure_analysis report of kind library.
# This is the one refactoring type whose proof is package_upgrade: it may change manifests and lock
# files, so DOING's suite_green_after includes the package manager resolving the new manifest, and
# QA's manifests_consistent replaces the usual change_is_minimal.
card_type: library_refactoring
capability: refactoring
outputs:
  - commit_sha
  - pr_number
  - pr_url
  - head_sha
  - fix_report_artifact_id
  - merge_sha

agent:
  key: library_refactoring
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: library_refactoring.ready
    title: Library refactoring — definition of ready
    definition_of_ready: {checks: [planned_files_exist]}
    definition_of_done: {checks: [workspace_imported]}
    acceptance_criteria:
      - {name: planned_files_exist, text: "Every manifest, lock file and source file the plan names for the library change exists at the imported revision, or the plan explains why the new library brings the file with it."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: library_refactoring.doing
    title: Library refactoring — definition of doing
    definition_of_ready: {checks: [workspace_imported]}
    definition_of_done: {checks: [suite_green_after, item_gone_at_location]}
    acceptance_criteria:
      - {name: diff_only_planned_files, text: "The diff touches only the manifests, lock files and source files the plan named; the lock file is regenerated by the package manager, never hand-edited."}
      - {name: suite_green_before, text: "The suite is green on the base revision with the old library and version configuration still in place."}
      - {name: suite_green_after, text: "The package manager's install resolves the changed manifest in the workspace and the suite is green after the library change."}
      - {name: item_gone_at_location, text: "The manifest no longer declares the library choice or version the item names; where the library remains, it is at the version the plan chose and the item's complaint no longer holds."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [pr_number, pr_url, head_sha]

  - key: library_refactoring.qa
    title: Library refactoring — definition of QA
    definition_of_ready: {checks: [item_gone_at_location]}
    definition_of_done: {checks: [change_preserves_behaviour, capability_acceptance_met]}
    acceptance_criteria:
      - {name: change_preserves_behaviour, text: "The tests that cover code using the changed library pass unchanged, so the library swap altered no observable behaviour."}
      - {name: change_removes_item, text: "The library choice or version problem the card's structure_analysis item names (kind library) is gone from the manifest."}
      - {name: capability_acceptance_met, text: "Every acceptance statement the library refactoring card type declares is true of the final diff."}
      - {name: removes_the_item, text: "The diff removes the library choice or version problem the card's item names."}
      - {name: preserves_behaviour, text: "The diff changes no observable behaviour: the code that uses the changed library produces the same results through its public interface."}
      - {name: manifests_consistent, text: "Manifest and lock files agree on every changed package version, and a clean install from them succeeds in the QA workspace."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [fix_report_artifact_id]

  - key: library_refactoring.done
    title: Library refactoring — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [pr_merged]}
    acceptance_criteria:
      - {name: pr_merged, text: "The pull request is squash-merged and the library change's merge sha is recorded on the card."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [merge_sha]

  - key: library_refactoring.system
    title: Library refactoring — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: library_refactoring.READY
    list: ready
    title: Library refactoring — ready
    outputs: [draft_artifact_id]
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: library_refactoring
        sop: library_refactoring.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: library_refactoring.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: library_refactoring.DOING
    list: doing
    title: Library refactoring — doing
    outputs: [pr_number, pr_url, head_sha]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: library_refactoring, sop: library_refactoring.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: library_refactoring, sop: library_refactoring.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: library_refactoring, sop: library_refactoring.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: library_refactoring, sop: library_refactoring.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: library_refactoring.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: library_refactoring.QA
    list: qa
    title: Library refactoring — QA
    outputs: [fix_report_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: library_refactoring, sop: library_refactoring.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: library_refactoring, sop: library_refactoring.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: library_refactoring, sop: library_refactoring.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: library_refactoring, sop: library_refactoring.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: library_refactoring.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: library_refactoring.DONE
    list: done
    title: Library refactoring — done
    outputs: [merge_sha]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: library_refactoring, sop: library_refactoring.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: library_refactoring, sop: library_refactoring.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: library_refactoring, sop: library_refactoring.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: library_refactoring, sop: library_refactoring.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: library_refactoring.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
