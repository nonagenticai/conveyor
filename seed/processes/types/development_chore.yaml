# development_chore — uncategorized coding jobs (schema: seed/processes/README.md).
#
# Content sources: seed/catalogue.json (card_type development_chore: outputs and acceptance) and
# n8n-designs/design/choices/v4/capabilities/development.yaml (text "uncategorized coding job",
# phase execution, proof suite_only, test_files none, inspect criteria). The card arrives from a
# code_quality_analysis issue or a consistency_analysis deviation, so READY proves that located
# issue exists and DOING's proof is the suite: green before, green after, and the issue gone.
card_type: development_chore
capability: development
outputs:
  - commit_sha
  - pr_number
  - pr_url
  - head_sha
  - fix_report_artifact_id
  - merge_sha

agent:
  key: development_chore
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: development_chore.ready
    title: Chore — definition of ready
    definition_of_ready: {checks: [finding_location_exists, planned_files_exist]}
    definition_of_done: {checks: [workspace_imported]}
    acceptance_criteria:
      - {name: finding_location_exists, text: "The code_quality or consistency finding the card names points at a file and a symbol that exist in the repository."}
      - {name: planned_files_exist, text: "Every file the plan names for the chore exists in the imported workspace, or the absence is explained before the change starts."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: development_chore.doing
    title: Chore — definition of doing
    definition_of_ready: {checks: [workspace_imported]}
    definition_of_done: {checks: [suite_green_after, issue_gone_at_location]}
    acceptance_criteria:
      - {name: diff_only_planned_files, text: "The diff touches only the files the plan named, and no test file, because a chore changes no test."}
      - {name: suite_green_before, text: "The suite is green on the base revision, so the chore starts from a known-good baseline."}
      - {name: suite_green_after, text: "The suite is green after the chore on the same revision the diff is measured against."}
      - {name: issue_gone_at_location, text: "The issue is no longer present at the location the finding named, checked at the revision the diff produces."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [pr_number, pr_url, head_sha]

  - key: development_chore.qa
    title: Chore — definition of QA
    definition_of_ready: {checks: [issue_gone_at_location]}
    definition_of_done: {checks: [change_preserves_behaviour, capability_acceptance_met]}
    acceptance_criteria:
      - {name: change_preserves_behaviour, text: "The tests that cover the touched code pass unchanged, so no user-visible behaviour moved."}
      - {name: capability_acceptance_met, text: "Every acceptance statement the development chore card type declares is true of the final diff and the evidence recorded for it."}
      - {name: removes_the_issue, text: "The diff removes the issue the card names."}
      - {name: preserves_behaviour, text: "The diff changes no observable behaviour."}
      - {name: change_is_minimal, text: "The diff changes only what removing the issue needs."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [fix_report_artifact_id]

  - key: development_chore.done
    title: Chore — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [pr_merged]}
    acceptance_criteria:
      - {name: pr_merged, text: "The pull request is squash-merged and the chore's merge sha is recorded on the card."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [merge_sha]

  - key: development_chore.system
    title: Chore — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: development_chore.READY
    list: ready
    title: Chore — ready
    outputs: [draft_artifact_id]
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: development_chore
        sop: development_chore.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: development_chore.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: development_chore.DOING
    list: doing
    title: Chore — doing
    outputs: [pr_number, pr_url, head_sha]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: development_chore, sop: development_chore.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: development_chore, sop: development_chore.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: development_chore, sop: development_chore.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: development_chore, sop: development_chore.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: development_chore.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: development_chore.QA
    list: qa
    title: Chore — QA
    outputs: [fix_report_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: development_chore, sop: development_chore.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: development_chore, sop: development_chore.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: development_chore, sop: development_chore.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: development_chore, sop: development_chore.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: development_chore.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: development_chore.DONE
    list: done
    title: Chore — done
    outputs: [merge_sha]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: development_chore, sop: development_chore.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: development_chore, sop: development_chore.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: development_chore, sop: development_chore.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: development_chore, sop: development_chore.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: development_chore.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
