# narrative_design — the narrative that carries design intent to a named audience
# (schema: seed/processes/README.md).
#
# Content sources: seed/catalogue.json (card_type narrative_design: outputs
# draft/reviewed/published, acceptance outline_within_card_scope, every_claim_cites_a_source,
# every_cited_source_exists, no_unsupported_claims, capability_acceptance_met,
# artifact_is_qa_version) and n8n-designs/design/choices/v4/capabilities/design.yaml (text,
# phase design, sections audience/intent/narrative/open_points, signoff false, uses_repo false,
# inspect.criteria). The card changes no code and writes no file: its deliverable is the document,
# which is why the ladder judges what the text says, never a diff.
card_type: narrative_design
capability: design
outputs:
  - draft_artifact_id
  - reviewed_artifact_id
  - published_artifact_id

agent:
  key: narrative_design
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: narrative_design.ready
    title: Narrative design — definition of ready
    definition_of_ready: {checks: [outline_within_card_scope]}
    definition_of_done: {checks: [narrative_outline_planned]}
    acceptance_criteria:
      - {name: outline_within_card_scope, text: "The outline holds only the narrative's four sections — audience, intent, narrative and open_points — and claims nothing outside the design this card describes."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []

  - key: narrative_design.doing
    title: Narrative design — definition of doing
    definition_of_ready: {checks: [narrative_outline_planned]}
    definition_of_done: {checks: [every_claim_cites_a_source, every_cited_source_exists]}
    acceptance_criteria:
      - {name: every_claim_cites_a_source, text: "Every statement the narrative makes about the design's structure or intent names the upstream architecture, domain or RM view it comes from."}
      - {name: every_cited_source_exists, text: "Every artifact id and RM view_id the narrative cites resolves at the revision the card read; a citation that does not resolve is reported, not narrated."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: narrative_design.qa
    title: Narrative design — definition of QA
    definition_of_ready: {checks: [every_cited_source_exists]}
    definition_of_done: {checks: [no_unsupported_claims, capability_acceptance_met]}
    acceptance_criteria:
      - {name: no_unsupported_claims, text: "The narrative asserts no behaviour, interface or intent that the sources it cites do not state."}
      - {name: capability_acceptance_met, text: "The narrative meets every acceptance statement the narrative_design card type declares."}
      - {name: audience_named, text: "audience names who the narrative is for."}
      - {name: intent_explained, text: "narrative explains the design intent in words that audience can follow."}
      - {name: open_points_listed, text: "open_points lists what the design leaves open, or says there is nothing."}
      - {name: structure_described, text: "narrative names the components, their functions or interfaces and the relations between them as the RM model holds them, and cites the RM view by its view_id (an artifact id is not a view id)."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [reviewed_artifact_id]

  - key: narrative_design.done
    title: Narrative design — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [artifact_is_qa_version]}
    acceptance_criteria:
      - {name: artifact_is_qa_version, text: "The narrative published to the card is the exact revision QA reviewed; no sentence was added, cut or reworded after the review."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [published_artifact_id]

  - key: narrative_design.system
    title: Narrative design — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: narrative_design.READY
    list: ready
    title: Narrative design — ready
    outputs: []
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: narrative_design
        sop: narrative_design.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: narrative_design.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: narrative_design.DOING
    list: doing
    title: Narrative design — doing
    outputs: [draft_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: narrative_design, sop: narrative_design.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: narrative_design, sop: narrative_design.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: narrative_design, sop: narrative_design.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: narrative_design, sop: narrative_design.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: narrative_design.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: narrative_design.QA
    list: qa
    title: Narrative design — QA
    outputs: [reviewed_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: narrative_design, sop: narrative_design.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: narrative_design, sop: narrative_design.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: narrative_design, sop: narrative_design.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: narrative_design, sop: narrative_design.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: narrative_design.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: narrative_design.DONE
    list: done
    title: Narrative design — done
    outputs: [published_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: narrative_design, sop: narrative_design.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: narrative_design, sop: narrative_design.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: narrative_design, sop: narrative_design.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: narrative_design, sop: narrative_design.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: narrative_design.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
