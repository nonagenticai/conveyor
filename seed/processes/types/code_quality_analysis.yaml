# code_quality_analysis — evaluate code quality: smells, performance, other quality issues.
#
# Content sources: seed/catalogue.json (outputs + acceptance) and
# n8n-designs/design/choices/v4/capabilities/analysis.yaml (text "uses tools to evaluate code
# quality", phase `analysis`, item_kinds smell/performance/other, code_quality_analysis
# inspect.criteria). The card reports issues and creates no cards; the refactors are planned from
# the report later (R150). Ladder: READY = readying + move; DOING/QA/DONE = four agents + move.
card_type: code_quality_analysis
capability: analysis
outputs:
  - draft_artifact_id
  - report_artifact_id
  - published_artifact_id

agent:
  key: code_quality_analysis
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: code_quality_analysis.ready
    title: Code quality analysis — definition of ready
    definition_of_ready: {checks: [scope_paths_exist]}
    definition_of_done: {checks: [draft_artifact_id]}
    acceptance_criteria:
      - {name: scope_paths_exist, text: "Every file or directory the card's title and description name exists in the workspace."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: code_quality_analysis.doing
    title: Code quality analysis — definition of doing
    definition_of_ready: {checks: [scope_paths_exist]}
    definition_of_done: {checks: [every_finding_cites_evidence, every_cited_location_exists, no_style_only_findings]}
    acceptance_criteria:
      - {name: every_finding_cites_evidence, text: "Every quality issue names the metric, tool run or code excerpt that measures it."}
      - {name: every_cited_location_exists, text: "Every file, function and line span an issue cites exists in the workspace at the commit the card pins."}
      - {name: no_style_only_findings, text: "No issue recorded in the report is a formatting or naming issue a formatter or linter rename would fix."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [report_artifact_id]

  - key: code_quality_analysis.qa
    title: Code quality analysis — definition of QA
    definition_of_ready: {checks: [every_cited_location_exists]}
    definition_of_done: {checks: [every_confirmed_location_exists, capability_acceptance_met]}
    acceptance_criteria:
      - {name: every_confirmed_location_exists, text: "Every location of every confirmed issue still exists in the workspace when QA runs."}
      - {name: capability_acceptance_met, text: "Every acceptance statement the code_quality_analysis card type carries is true of the report."}
      - {name: findings_located, text: "Every confirmed issue names a file, a function (null at module level) and a line span."}
      - {name: proposed_change_preserves_behaviour, text: "Every confirmed issue's proposed change removes it without changing behaviour."}
      - {name: no_style_only_findings, text: "No confirmed issue is a formatting or naming issue a formatter or linter rename would fix."}
      - {name: findings_in_card_scope, text: "Every issue lies inside the part of the repository the card's title and description name."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []

  - key: code_quality_analysis.done
    title: Code quality analysis — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [artifact_is_qa_version]}
    acceptance_criteria:
      - {name: artifact_is_qa_version, text: "The published report is the version QA confirmed; no issue was edited after QA."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [published_artifact_id]

  - key: code_quality_analysis.system
    title: Code quality analysis — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: code_quality_analysis.READY
    list: ready
    title: Code quality analysis — ready
    outputs: [draft_artifact_id]
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: code_quality_analysis
        sop: code_quality_analysis.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: code_quality_analysis.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: code_quality_analysis.DOING
    list: doing
    title: Code quality analysis — doing
    outputs: [report_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: code_quality_analysis, sop: code_quality_analysis.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: code_quality_analysis, sop: code_quality_analysis.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: code_quality_analysis, sop: code_quality_analysis.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: code_quality_analysis, sop: code_quality_analysis.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: code_quality_analysis.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: code_quality_analysis.QA
    list: qa
    title: Code quality analysis — QA
    outputs: []
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: code_quality_analysis, sop: code_quality_analysis.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: code_quality_analysis, sop: code_quality_analysis.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: code_quality_analysis, sop: code_quality_analysis.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: code_quality_analysis, sop: code_quality_analysis.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: code_quality_analysis.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: code_quality_analysis.DONE
    list: done
    title: Code quality analysis — done
    outputs: [published_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: code_quality_analysis, sop: code_quality_analysis.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: code_quality_analysis, sop: code_quality_analysis.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: code_quality_analysis, sop: code_quality_analysis.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: code_quality_analysis, sop: code_quality_analysis.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: code_quality_analysis.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
