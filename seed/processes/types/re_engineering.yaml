# re_engineering — restructure one named component of the repository (schema: seed/processes/README.md).
#
# Content sources: seed/catalogue.json (card_type re_engineering: outputs and acceptance) and
# n8n-designs/design/choices/v4/capabilities/refactoring.yaml (text "full fletched reconsideration
# of existing repo", phase execution, source card, proof suite_only, test_files none, inspect
# criteria). This type has NO analysis item: the card is the scope and names one component (the PM
# plans one card per component from the brief). READY therefore finds the component's paths and the
# repository's own test command, and DOING/QA run that recorded argv so before and after are
# comparable.
card_type: re_engineering
capability: refactoring
outputs:
  - commit_sha
  - pr_number
  - pr_url
  - head_sha
  - fix_report_artifact_id
  - merge_sha

agent:
  key: re_engineering
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: re_engineering.ready
    title: Re engineering — definition of ready
    definition_of_ready: {checks: [component_paths_exist, planned_files_exist]}
    definition_of_done: {checks: [workspace_imported]}
    acceptance_criteria:
      - {name: component_paths_exist, text: "Every path the card names for the component exists at the imported revision, and the repository's own test command is found in its metadata rather than assumed, so DOING and QA run the same argv."}
      - {name: planned_files_exist, text: "Every file the restructuring plan names exists at the imported revision, or the plan explains why the restructuring adds or removes the file."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: re_engineering.doing
    title: Re engineering — definition of doing
    definition_of_ready: {checks: [workspace_imported]}
    definition_of_done: {checks: [suite_green_after, change_follows_plan]}
    acceptance_criteria:
      - {name: diff_only_planned_files, text: "The diff touches only the component's planned files, and no test file."}
      - {name: suite_green_before, text: "The component's test command, recorded in READY, is green on the base revision before any restructuring."}
      - {name: suite_green_after, text: "The component's test command is green after the restructuring, run with the same argv READY recorded."}
      - {name: change_follows_plan, text: "The diff restructures the component along the plan's steps in their order, and reaches no part of the repository the card does not name."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [pr_number, pr_url, head_sha]

  - key: re_engineering.qa
    title: Re engineering — definition of QA
    definition_of_ready: {checks: [change_follows_plan]}
    definition_of_done: {checks: [change_preserves_behaviour, capability_acceptance_met]}
    acceptance_criteria:
      - {name: change_preserves_behaviour, text: "The component behaves as it did before the restructuring: its existing tests pass untouched and its public surface answers as before."}
      - {name: change_achieves_target, text: "The diff reaches the target the card names for the component, not a nearby tidy-up of it."}
      - {name: capability_acceptance_met, text: "Every acceptance statement the re engineering card type declares is true of the final diff."}
      - {name: achieves_target, text: "The diff reaches the target the card names."}
      - {name: preserves_behaviour, text: "The diff changes no observable behaviour of the component, including its error paths and side effects."}
      - {name: structure_simpler, text: "The resulting structure is simpler or clearer than before, in the way the target asks, and a reader can follow it without the old indirection."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [fix_report_artifact_id]

  - key: re_engineering.done
    title: Re engineering — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [pr_merged]}
    acceptance_criteria:
      - {name: pr_merged, text: "The pull request is squash-merged and the restructuring's merge sha is recorded on the card."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [merge_sha]

  - key: re_engineering.system
    title: Re engineering — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: re_engineering.READY
    list: ready
    title: Re engineering — ready
    outputs: [draft_artifact_id]
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: re_engineering
        sop: re_engineering.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: re_engineering.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: re_engineering.DOING
    list: doing
    title: Re engineering — doing
    outputs: [pr_number, pr_url, head_sha]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: re_engineering, sop: re_engineering.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: re_engineering, sop: re_engineering.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: re_engineering, sop: re_engineering.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: re_engineering, sop: re_engineering.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: re_engineering.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: re_engineering.QA
    list: qa
    title: Re engineering — QA
    outputs: [fix_report_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: re_engineering, sop: re_engineering.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: re_engineering, sop: re_engineering.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: re_engineering, sop: re_engineering.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: re_engineering, sop: re_engineering.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: re_engineering.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: re_engineering.DONE
    list: done
    title: Re engineering — done
    outputs: [merge_sha]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: re_engineering, sop: re_engineering.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: re_engineering, sop: re_engineering.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: re_engineering, sop: re_engineering.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: re_engineering, sop: re_engineering.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: re_engineering.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
