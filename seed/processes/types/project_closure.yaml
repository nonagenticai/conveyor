# project_closure — closes the project and records its outcome (project_management, S13 §5.2).
#
# Content sources: seed/catalogue.json (the type's outputs, and its DOING / DONE acceptance strings) and
# n8n-designs/design/choices/v4 — capabilities/project_management.yaml ("special card for closing
# projects"), model.md §6 (n8n closes the project in RM, R17; Closure is fr's project-page step plus this
# card, not an RM phase) and dependencies.md D22 (the type's matrix). v4 carries NO inspect.criteria for
# this capability, so a stage the catalogue leaves silent gets one criterion derived from that prose and
# is marked `derived` below. Ladder: READY = readying + the move; DOING/QA/DONE = four agents
# (readying → doing → inspecting → releasing) + the move.
card_type: project_closure
capability: project_management
outputs:
  - final_report_artifact_id
  - final_brief_version
  - status_set
  - published_artifact_id

agent:
  key: project_closure
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: project_closure.ready
    title: Project closure — definition of ready
    definition_of_ready: {checks: [project_is_open]}
    definition_of_done: {checks: [phase_is_final]}
    acceptance_criteria:
      # derived: model.md §6 / R17 — the project is open and its last phase has run before it is closed
      - {name: project_is_open, text: "RM still shows the project open, so this card is the one that closes it and the work is not a reopen."}
      - {name: phase_is_final, text: "The project's RM phase is the last phase the project type lists, so no phase work is left unclosed."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []

  - key: project_closure.doing
    title: Project closure — definition of doing
    definition_of_ready: {checks: [phase_is_final]}
    definition_of_done: {checks: [every_phase_report_linked, report_covers_every_phase]}
    acceptance_criteria:
      - {name: every_phase_report_linked, text: "Every link the final report makes to a phase report resolves to a report that exists and is the one that phase closed with."}
      # derived: R348 (4) / R351 (1) — a phase may be skipped or added mid-project, so the report says so
      - {name: report_covers_every_phase, text: "The final report names every phase the project ran and names each phase it skipped with the reason the phase plan gave."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [final_report_artifact_id]

  - key: project_closure.qa
    title: Project closure — definition of QA
    definition_of_ready: {checks: [every_phase_report_linked]}
    definition_of_done: {checks: [report_answers_brief, capability_acceptance_met]}
    acceptance_criteria:
      # derived: model.md §7 / R24 — closure is judged against the brief the project started with
      - {name: report_answers_brief, text: "Every success criterion the brief carried when the project started is answered as met or not met, each citing the phase report that shows it."}
      - {name: capability_acceptance_met, text: "Every acceptance statement the project_closure card type carries is true of the report, checked against the board and RM rather than the report's own summary."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []

  - key: project_closure.done
    title: Project closure — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [project_not_closed_yet]}
    acceptance_criteria:
      - {name: project_not_closed_yet, text: "RM still shows the project open at the moment this card sets the closing status, so the status changes once and a second closure card cannot close the same project again."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [final_brief_version, status_set, published_artifact_id]

  - key: project_closure.system
    title: Project closure — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: project_closure.READY
    list: ready
    title: Project closure — ready
    outputs: []
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: project_closure
        sop: project_closure.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: project_closure.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: project_closure.DOING
    list: doing
    title: Project closure — doing
    outputs: [final_report_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: project_closure, sop: project_closure.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: project_closure, sop: project_closure.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: project_closure, sop: project_closure.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: project_closure, sop: project_closure.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: project_closure.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: project_closure.QA
    list: qa
    title: Project closure — QA
    outputs: []
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: project_closure, sop: project_closure.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: project_closure, sop: project_closure.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: project_closure, sop: project_closure.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: project_closure, sop: project_closure.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: project_closure.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: project_closure.DONE
    list: done
    title: Project closure — done
    outputs: [final_brief_version, status_set, published_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: project_closure, sop: project_closure.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: project_closure, sop: project_closure.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: project_closure, sop: project_closure.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: project_closure, sop: project_closure.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: project_closure.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
