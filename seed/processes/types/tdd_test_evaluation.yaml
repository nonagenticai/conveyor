# tdd_test_evaluation — do the existing unit tests carry the brief? (schema: seed/processes/README.md).
#
# Content sources: seed/catalogue.json (card_type tdd_test_evaluation: outputs and acceptance) and
# n8n-designs/design/choices/v4/capabilities/bddtdd.yaml (text "evaluation of created tests", phase
# design, inspect criteria). The archetype is analysis: the card reads tests and changes nothing, and
# each confirmed finding becomes one tdd_test_improvement card (v4 P-W3-2), planned later — never
# created here. A finding's kind is one of missing_test, weak_assertion or brittle_test, and its
# evidence is the test line, or for a missing test the code line, it rests on.
card_type: tdd_test_evaluation
capability: bdd_tdd
outputs:
  - draft_artifact_id
  - report_artifact_id
  - published_artifact_id

agent:
  key: tdd_test_evaluation
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: tdd_test_evaluation.ready
    title: TDD test evaluation — definition of ready
    definition_of_ready: {checks: [scope_paths_exist]}
    definition_of_done: {checks: [tests_read]}
    acceptance_criteria:
      - {name: scope_paths_exist, text: "Every test file and test directory the card scopes the evaluation to exists at the revision the card reads, and a path that does not is reported as missing before any test is judged."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []

  - key: tdd_test_evaluation.doing
    title: TDD test evaluation — definition of doing
    definition_of_ready: {checks: [tests_read]}
    definition_of_done: {checks: [every_finding_cites_evidence, every_cited_test_exists, every_missing_test_subject_exists]}
    acceptance_criteria:
      - {name: every_finding_cites_evidence, text: "Every finding quotes the test function, assertion or fixture line it rests on — or, for a missing test, the brief or code line that asks for the behaviour — from the revision the evaluation read."}
      - {name: every_cited_test_exists, text: "Every test file and test a finding cites exists in that revision, and the quoted body is the body as written there."}
      - {name: every_missing_test_subject_exists, text: "Every finding that reports a missing test names a subject — a function, endpoint or branch — that exists in that revision and is reachable from it; a missing test for a subject that does not exist is not a finding."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: tdd_test_evaluation.qa
    title: TDD test evaluation — definition of QA
    definition_of_ready: {checks: [every_cited_test_exists]}
    definition_of_done: {checks: [every_confirmed_location_exists, capability_acceptance_met]}
    acceptance_criteria:
      - {name: every_confirmed_location_exists, text: "Every finding the report confirms still points at the test file and test it quotes — or, for a missing test, at the subject it names — at the revision the report publishes, and a quote whose line moved or vanished is re-quoted or downgraded before publication."}
      - {name: capability_acceptance_met, text: "The report is true of every acceptance statement the tdd_test_evaluation card type declares, and each verdict quotes the test, the subject or the code line that supports it."}
      - {name: findings_located, text: "Every confirmed finding names its test file and test, or, for a missing test, its subject."}
      - {name: kind_fits_symptom, text: "Every confirmed finding's kind (missing_test, weak_assertion, brittle_test) fits its symptom."}
      - {name: proposed_change_concrete, text: "Every confirmed finding's proposed change says what the test must check."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [report_artifact_id]

  - key: tdd_test_evaluation.done
    title: TDD test evaluation — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [artifact_is_qa_version]}
    acceptance_criteria:
      - {name: artifact_is_qa_version, text: "The report published to the card is the exact revision QA reviewed, and each confirmed finding is the one a tdd_test_improvement card will be planned from — none added, dropped or reworded after the review."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [published_artifact_id]

  - key: tdd_test_evaluation.system
    title: TDD test evaluation — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: tdd_test_evaluation.READY
    list: ready
    title: TDD test evaluation — ready
    outputs: []
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: tdd_test_evaluation
        sop: tdd_test_evaluation.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: tdd_test_evaluation.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: tdd_test_evaluation.DOING
    list: doing
    title: TDD test evaluation — doing
    outputs: [draft_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: tdd_test_evaluation, sop: tdd_test_evaluation.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: tdd_test_evaluation, sop: tdd_test_evaluation.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: tdd_test_evaluation, sop: tdd_test_evaluation.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: tdd_test_evaluation, sop: tdd_test_evaluation.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: tdd_test_evaluation.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: tdd_test_evaluation.QA
    list: qa
    title: TDD test evaluation — QA
    outputs: [report_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: tdd_test_evaluation, sop: tdd_test_evaluation.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: tdd_test_evaluation, sop: tdd_test_evaluation.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: tdd_test_evaluation, sop: tdd_test_evaluation.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: tdd_test_evaluation, sop: tdd_test_evaluation.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: tdd_test_evaluation.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: tdd_test_evaluation.DONE
    list: done
    title: TDD test evaluation — done
    outputs: [published_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: tdd_test_evaluation, sop: tdd_test_evaluation.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: tdd_test_evaluation, sop: tdd_test_evaluation.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: tdd_test_evaluation, sop: tdd_test_evaluation.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: tdd_test_evaluation, sop: tdd_test_evaluation.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: tdd_test_evaluation.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
