# development_feature_new — build a new feature (schema: seed/processes/README.md).
#
# Content sources: seed/catalogue.json (card_type development_feature_new: outputs and acceptance)
# and n8n-designs/design/choices/v4/capabilities/development.yaml (text "development of a new
# feature", phase execution, proof acceptance_test, item_kinds [new], tdd_link true, inspect
# criteria). The card arrives from a gap_analysis gap of kind new, so READY proves the planned
# paths are allowed and DOING writes the acceptance test first and proves it failed before.
card_type: development_feature_new
capability: development
outputs:
  - commit_sha
  - pr_number
  - pr_url
  - head_sha
  - fix_report_artifact_id
  - merge_sha

agent:
  key: development_feature_new
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: development_feature_new.ready
    title: New feature — definition of ready
    definition_of_ready: {checks: [planned_files_allowed]}
    definition_of_done: {checks: [workspace_imported]}
    acceptance_criteria:
      - {name: planned_files_allowed, text: "Every path the plan adds or changes lies inside the workspace's source or test tree and outside generated or vendored output."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: development_feature_new.doing
    title: New feature — definition of doing
    definition_of_ready: {checks: [workspace_imported]}
    definition_of_done: {checks: [acceptance_test_added, suite_green_after]}
    acceptance_criteria:
      - {name: diff_only_planned_files, text: "The diff touches only the source and test paths the plan named for the new feature."}
      - {name: acceptance_test_added, text: "The diff adds an acceptance test for the gap, or un-marks the tests-first test that already states it."}
      - {name: failed_before_on_new_test_only, text: "The new acceptance test fails on the base revision and no other test does."}
      - {name: suite_green_after, text: "The full suite, including the new acceptance test, is green after the feature."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [pr_number, pr_url, head_sha]

  - key: development_feature_new.qa
    title: New feature — definition of QA
    definition_of_ready: {checks: [acceptance_test_added]}
    definition_of_done: {checks: [change_meets_acceptance, capability_acceptance_met]}
    acceptance_criteria:
      - {name: change_meets_acceptance, text: "The change makes the gap's acceptance sentence true, including the edge cases gap_analysis stated with it."}
      - {name: capability_acceptance_met, text: "Every acceptance statement the development feature new card type declares is true of the delivered feature."}
      - {name: meets_acceptance, text: "The diff makes the gap's acceptance sentence true."}
      - {name: acceptance_test_targets_gap, text: "The diff adds a test, or un-marks a tests-first test, that checks the gap's acceptance sentence."}
      - {name: change_is_minimal, text: "The diff changes only what the new feature needs, plus its tests."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [fix_report_artifact_id]

  - key: development_feature_new.done
    title: New feature — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [pr_merged]}
    acceptance_criteria:
      - {name: pr_merged, text: "The pull request is squash-merged and the new feature's merge sha is recorded on the card."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [merge_sha]

  - key: development_feature_new.system
    title: New feature — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: development_feature_new.READY
    list: ready
    title: New feature — ready
    outputs: [draft_artifact_id]
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: development_feature_new
        sop: development_feature_new.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: development_feature_new.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: development_feature_new.DOING
    list: doing
    title: New feature — doing
    outputs: [pr_number, pr_url, head_sha]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: development_feature_new, sop: development_feature_new.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: development_feature_new, sop: development_feature_new.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: development_feature_new, sop: development_feature_new.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: development_feature_new, sop: development_feature_new.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: development_feature_new.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: development_feature_new.QA
    list: qa
    title: New feature — QA
    outputs: [fix_report_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: development_feature_new, sop: development_feature_new.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: development_feature_new, sop: development_feature_new.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: development_feature_new, sop: development_feature_new.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: development_feature_new, sop: development_feature_new.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: development_feature_new.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: development_feature_new.DONE
    list: done
    title: New feature — done
    outputs: [merge_sha]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: development_feature_new, sop: development_feature_new.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: development_feature_new, sop: development_feature_new.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: development_feature_new, sop: development_feature_new.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: development_feature_new, sop: development_feature_new.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: development_feature_new.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
