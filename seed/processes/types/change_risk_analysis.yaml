# change_risk_analysis — the risk of the changes planned to be made (document archetype).
#
# Content sources: seed/catalogue.json (outputs + acceptance) and
# n8n-designs/design/choices/v4/capabilities/analysis.yaml (text, phase `analysis`, upstream
# change_impact_analysis and plateau_planning_analysis, sections planned_changes/risks/
# residual_risk, uses_repo true, signoff false, change_risk_analysis inspect.criteria). A risk is
# only judgeable once it names the planned change it comes from, so that tie is the DOING
# evidence and the QA criterion. The document is written into the draft READY creates, so DOING
# declares no new artifact; QA leaves the reviewed version and DONE publishes it.
card_type: change_risk_analysis
capability: analysis
outputs:
  - draft_artifact_id
  - reviewed_artifact_id
  - published_artifact_id

agent:
  key: change_risk_analysis
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: change_risk_analysis.ready
    title: Change risk analysis — definition of ready
    definition_of_ready: {checks: [outline_within_card_scope]}
    definition_of_done: {checks: [draft_artifact_id]}
    acceptance_criteria:
      - {name: outline_within_card_scope, text: "The outline covers only the planned changes the card names, plus the risks and residual risk that follow from them."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: change_risk_analysis.doing
    title: Change risk analysis — definition of doing
    definition_of_ready: {checks: [outline_within_card_scope]}
    definition_of_done: {checks: [every_claim_cites_a_source, every_cited_source_exists]}
    acceptance_criteria:
      - {name: every_claim_cites_a_source, text: "Every risk, likelihood and impact names the planned change, the impact analysis or the repository path it comes from."}
      - {name: every_cited_source_exists, text: "Every planned change, upstream artifact version and repository path a claim cites exists when the claim is written."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []

  - key: change_risk_analysis.qa
    title: Change risk analysis — definition of QA
    definition_of_ready: {checks: [every_cited_source_exists]}
    definition_of_done: {checks: [no_unsupported_claims, capability_acceptance_met]}
    acceptance_criteria:
      - {name: no_unsupported_claims, text: "No likelihood, impact or residual-risk statement goes beyond what its cited sources support."}
      - {name: capability_acceptance_met, text: "Every acceptance statement the change_risk_analysis card type carries is true of the document."}
      - {name: risks_tied_to_changes, text: "Every risk names the planned change it comes from."}
      - {name: risks_rated_and_mitigated, text: "Every risk states its likelihood, its impact and a mitigation."}
      - {name: residual_risk_stated, text: "residual_risk states what remains after the mitigations."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [reviewed_artifact_id]

  - key: change_risk_analysis.done
    title: Change risk analysis — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [artifact_is_qa_version]}
    acceptance_criteria:
      - {name: artifact_is_qa_version, text: "The published document is the version QA confirmed; no risk was edited after QA."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [published_artifact_id]

  - key: change_risk_analysis.system
    title: Change risk analysis — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: change_risk_analysis.READY
    list: ready
    title: Change risk analysis — ready
    outputs: [draft_artifact_id]
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: change_risk_analysis
        sop: change_risk_analysis.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: change_risk_analysis.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: change_risk_analysis.DOING
    list: doing
    title: Change risk analysis — doing
    outputs: []
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: change_risk_analysis, sop: change_risk_analysis.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: change_risk_analysis, sop: change_risk_analysis.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: change_risk_analysis, sop: change_risk_analysis.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: change_risk_analysis, sop: change_risk_analysis.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: change_risk_analysis.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: change_risk_analysis.QA
    list: qa
    title: Change risk analysis — QA
    outputs: [reviewed_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: change_risk_analysis, sop: change_risk_analysis.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: change_risk_analysis, sop: change_risk_analysis.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: change_risk_analysis, sop: change_risk_analysis.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: change_risk_analysis, sop: change_risk_analysis.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: change_risk_analysis.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: change_risk_analysis.DONE
    list: done
    title: Change risk analysis — done
    outputs: [published_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: change_risk_analysis, sop: change_risk_analysis.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: change_risk_analysis, sop: change_risk_analysis.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: change_risk_analysis, sop: change_risk_analysis.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: change_risk_analysis, sop: change_risk_analysis.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: change_risk_analysis.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
