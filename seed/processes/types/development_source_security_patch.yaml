# development_source_security_patch — close a source-code weakness and open a PR
# (schema: seed/processes/README.md).
#
# Content sources: seed/catalogue.json (card_type development_source_security_patch: outputs and
# acceptance) and n8n-designs/design/choices/v4/capabilities/development.yaml (text "fix a
# source-code security finding and open a pull request", phase execution, proof regression_test,
# inspect criteria weakness_closed / regression_test_targets_weakness / no_new_weakness; the v4 note
# under P-W3-2 pairs it with development_security_patch, which now takes dependency items only).
# vendor/trigger_registry.md:235 carries only the one-line text.
#
# ⚠ this is the ONE development type whose catalogue entry declares no `definition_of_done`, so the
# DONE SOP closes on pr_merged, the same closing condition its siblings declare. Recorded as missing
# catalogue data, not chosen here.
card_type: development_source_security_patch
capability: development
outputs:
  - commit_sha
  - pr_number
  - pr_url
  - head_sha
  - fix_report_artifact_id
  - merge_sha

agent:
  key: development_source_security_patch
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: development_source_security_patch.ready
    title: Source security patch — definition of ready
    definition_of_ready: {checks: [finding_location_exists]}
    definition_of_done: {checks: [workspace_imported]}
    acceptance_criteria:
      - {name: finding_location_exists, text: "The finding names the file, the function and the sink that makes it exploitable — the query, the command, the deserialisation or the rendered output — and that location exists in the workspace at the commit the finding cites. A finding that names only a file has not located the weakness this card must close."}
      - {name: planned_files_exist, text: "Every file the plan names exists in the workspace, or the plan says why the fix needs a file that is not there. A plan that presumes a helper, a sanitiser or a test fixture the repository does not have fails here, before the diff is written."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: development_source_security_patch.doing
    title: Source security patch — definition of doing
    definition_of_ready: {checks: [workspace_imported]}
    definition_of_done: {checks: [regression_test_added, suite_green_after]}
    acceptance_criteria:
      - {name: diff_only_planned_files, text: "The diff touches only the files the plan named, plus the regression test. A fix that also reformats the module around the sink hides the change a security reviewer has to read."}
      - {name: regression_test_added, text: "The diff adds a test that reaches the vulnerable path through the same input the finding used, so the test fails while the weakness is present and passes once it is closed. A test that only asserts the fixed function returns a value does not exercise the weakness."}
      - {name: failed_before_on_new_test_only, text: "The new test fails on the code before the fix and no other test fails, so the red is the weakness itself and the fix is shown to change it."}
      - {name: suite_green_after, text: "The suite is green after the fix, with the new test passing and every test that passed before still passing — a fix that closes the path by refusing input the rest of the system sends has moved the breakage, not removed it."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [pr_number, pr_url, head_sha]

  - key: development_source_security_patch.qa
    title: Source security patch — definition of QA
    definition_of_ready: {checks: [regression_test_added]}
    definition_of_done: {checks: [fix_addresses_root_cause, capability_acceptance_met]}
    acceptance_criteria:
      - {name: fix_addresses_root_cause, text: "The fix removes the weakness at the sink the finding names — the input is validated, encoded, parameterised or rejected there — and not at the caller, in configuration, or in the test that exposed it. A guard placed where only one caller passes leaves every other caller exposed."}
      - {name: capability_acceptance_met, text: "Every acceptance statement the development_source_security_patch card type declares is true of the diff and of the report QA reviews."}
      - {name: weakness_closed, text: "The diff removes the weakness at the finding's file and function: the input the finding used no longer reaches the sink unvalidated or unencoded, on any path into that function."}
      - {name: regression_test_targets_weakness, text: "The diff adds a test that exercises the weakness and would fail without the fix, so a later change that reopens the path turns the suite red rather than passing quietly."}
      - {name: no_new_weakness, text: "The diff adds no insecure pattern — no string-built query or command, no disabled escaping, no broadened permission, no secret in a log line — and disables no check, lint rule, scanner rule or test."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [fix_report_artifact_id]

  - key: development_source_security_patch.done
    title: Source security patch — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [pr_merged]}
    acceptance_criteria:
      - {name: pr_merged, text: "The pull request is merged, and the merge sha carries the same fix and the same regression test QA reviewed — no follow-up commit weakened the fix on the way in."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [merge_sha]

  - key: development_source_security_patch.system
    title: Source security patch — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: development_source_security_patch.READY
    list: ready
    title: Source security patch — ready
    outputs: [draft_artifact_id]
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: development_source_security_patch
        sop: development_source_security_patch.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: development_source_security_patch.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: development_source_security_patch.DOING
    list: doing
    title: Source security patch — doing
    outputs: [pr_number, pr_url, head_sha]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: development_source_security_patch, sop: development_source_security_patch.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: development_source_security_patch, sop: development_source_security_patch.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: development_source_security_patch, sop: development_source_security_patch.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: development_source_security_patch, sop: development_source_security_patch.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: development_source_security_patch.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: development_source_security_patch.QA
    list: qa
    title: Source security patch — QA
    outputs: [fix_report_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: development_source_security_patch, sop: development_source_security_patch.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: development_source_security_patch, sop: development_source_security_patch.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: development_source_security_patch, sop: development_source_security_patch.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: development_source_security_patch, sop: development_source_security_patch.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: development_source_security_patch.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: development_source_security_patch.DONE
    list: done
    title: Source security patch — done
    outputs: [merge_sha]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: development_source_security_patch, sop: development_source_security_patch.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: development_source_security_patch, sop: development_source_security_patch.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: development_source_security_patch, sop: development_source_security_patch.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: development_source_security_patch, sop: development_source_security_patch.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: development_source_security_patch.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
