# testing_plan — how the tests will be executed and how their results are evaluated (schema:
# seed/processes/README.md).
#
# Content sources: seed/catalogue.json (card_type testing_plan: outputs draft/reviewed/published
# and acceptance outline_within_card_scope, every_claim_cites_a_source, every_cited_source_exists,
# no_unsupported_claims, capability_acceptance_met, artifact_is_qa_version) and
# n8n-designs/design/choices/v4/capabilities/testing.yaml (archetype document, text "defines how
# tests will be executed and what the evaluation process is", phase test, upstream
# testing_strategy, sections test_items / execution_order / environments / evaluation_process,
# uses_repo true, uses_knowledge false, signoff false, and the inspect.criteria the QA stage judges
# by). Its upstream is the testing strategy: a plan admits only the items the strategy's scope and
# levels admit, so READY waits for that card when one exists and says so when none does (the v4
# minimal upstream gate). The plan is written to be run as written — testing_execution runs it, and
# testing_evaluation judges the results against the strategy's exit criteria.
card_type: testing_plan
capability: testing
outputs:
  - draft_artifact_id
  - reviewed_artifact_id
  - published_artifact_id

agent:
  key: testing_plan
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  # One SOP per stage for the agent steps, plus one mechanical SOP for every computed move.
  - key: testing_plan.ready
    title: Testing plan — definition of ready
    definition_of_ready: {checks: [upstream_testing_strategy_done_or_absent, strategy_levels_resolved]}
    definition_of_done: {checks: [outline_within_card_scope]}
    acceptance_criteria:
      - {name: outline_within_card_scope, text: "The outline holds only the plan's four sections — test_items, execution_order, environments and evaluation_process — and every test item in it lies inside the upstream strategy's scope."}
      - {name: strategy_levels_resolved, text: "Every test level the outline plans against is one the upstream strategy's levels section names; a level the plan needs and the strategy lacks is reported as a gap in the strategy rather than planned against here."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []

  - key: testing_plan.doing
    title: Testing plan — definition of doing
    definition_of_ready: {checks: [outline_within_card_scope]}
    definition_of_done: {checks: [every_claim_cites_a_source, every_cited_source_exists]}
    acceptance_criteria:
      - {name: every_claim_cites_a_source, text: "Every test item names the requirement, acceptance criterion or strategy objective it tests, and every environment names the configuration file or the service it stands for."}
      - {name: every_cited_source_exists, text: "Every citation resolves at the pinned head the card read — the strategy objective and level exist, the requirement id exists in RM, and the test file or suite an item names exists in the repository."}
      - {name: items_are_runnable_as_written, text: "Every test item states a test that can be run as written — the command, the suite and the data it needs — rather than a behaviour someone must check by hand."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: testing_plan.qa
    title: Testing plan — definition of QA
    definition_of_ready: {checks: [every_cited_source_exists]}
    definition_of_done: {checks: [items_follow_strategy, execution_order_complete, evaluation_process_defined, no_unsupported_claims, capability_acceptance_met]}
    acceptance_criteria:
      - {name: items_follow_strategy, text: "test_items follow the upstream strategy's scope and levels."}
      - {name: execution_order_complete, text: "execution_order covers every test item."}
      - {name: evaluation_process_defined, text: "evaluation_process says how results are judged against the strategy's exit criteria."}
      - {name: no_unsupported_claims, text: "The plan promises no coverage, environment or evaluation step that the strategy and the repository do not support."}
      - {name: capability_acceptance_met, text: "The plan is true of every acceptance statement the testing_plan card type declares."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [reviewed_artifact_id]

  - key: testing_plan.done
    title: Testing plan — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [artifact_is_qa_version]}
    acceptance_criteria:
      - {name: artifact_is_qa_version, text: "The plan published to the card is the exact revision QA reviewed; no test item, ordering step, environment or evaluation rule was added, cut or reordered after the review."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [published_artifact_id]

  - key: testing_plan.system
    title: Testing plan — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: testing_plan.READY
    list: ready
    title: Testing plan — ready
    outputs: []
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: testing_plan
        sop: testing_plan.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: testing_plan.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: testing_plan.DOING
    list: doing
    title: Testing plan — doing
    outputs: [draft_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: testing_plan, sop: testing_plan.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: testing_plan, sop: testing_plan.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: testing_plan, sop: testing_plan.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: testing_plan, sop: testing_plan.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: testing_plan.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: testing_plan.QA
    list: qa
    title: Testing plan — QA
    outputs: [reviewed_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: testing_plan, sop: testing_plan.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: testing_plan, sop: testing_plan.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: testing_plan, sop: testing_plan.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: testing_plan, sop: testing_plan.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: testing_plan.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: testing_plan.DONE
    list: done
    title: Testing plan — done
    outputs: [published_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: testing_plan, sop: testing_plan.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: testing_plan, sop: testing_plan.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: testing_plan, sop: testing_plan.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: testing_plan, sop: testing_plan.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: testing_plan.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
