# bdd_test_evaluation — do the existing BDD scenarios carry the brief? (schema: seed/processes/README.md).
#
# Content sources: seed/catalogue.json (card_type bdd_test_evaluation: outputs and acceptance) and
# n8n-designs/design/choices/v4/capabilities/bddtdd.yaml (text, phase design, inspect criteria).
# The card reads feature files and changes nothing; each confirmed finding becomes one
# bdd_test_improvement card (v4 P-W3-2), planned later — never created here.
card_type: bdd_test_evaluation
capability: bdd_tdd
outputs:
  - draft_artifact_id
  - report_artifact_id
  - published_artifact_id

agent:
  key: bdd_test_evaluation
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: bdd_test_evaluation.ready
    title: BDD test evaluation — definition of ready
    definition_of_ready: {checks: [scope_paths_exist]}
    definition_of_done: {checks: [scenarios_read]}
    acceptance_criteria:
      - {name: scope_paths_exist, text: "Every feature file and feature directory the card scopes the evaluation to exists at the revision the card reads, and a path that does not is reported as missing before any scenario is judged."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []

  - key: bdd_test_evaluation.doing
    title: BDD test evaluation — definition of doing
    definition_of_ready: {checks: [scenarios_read]}
    definition_of_done: {checks: [every_finding_cites_evidence, every_cited_scenario_exists]}
    acceptance_criteria:
      - {name: every_finding_cites_evidence, text: "Every finding quotes the Given, When or Then step it rests on, or, for a missing behaviour, the brief line that asks for it, from the revision the evaluation read."}
      - {name: every_cited_scenario_exists, text: "Every feature file and scenario a finding cites exists in that revision, and the quoted step is the step as written there."}
      - {name: every_missing_scenario_cites_a_brief_item, text: "Every finding that reports a missing or misaligned behaviour names the brief item that asks for it, and that item asks for that behaviour rather than a neighbouring one."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: bdd_test_evaluation.qa
    title: BDD test evaluation — definition of QA
    definition_of_ready: {checks: [every_cited_scenario_exists]}
    definition_of_done: {checks: [every_confirmed_location_exists, capability_acceptance_met]}
    acceptance_criteria:
      - {name: every_confirmed_location_exists, text: "Every finding the report confirms still names a feature file and scenario, or a brief item for a missing scenario, that the QA pass found at the revision the report publishes."}
      - {name: capability_acceptance_met, text: "The report is true of every acceptance statement the bdd_test_evaluation card type declares, and each verdict quotes the scenario or brief item that supports it."}
      - {name: findings_located, text: "Every confirmed finding names its feature file and scenario, or, for a missing scenario, the brief item."}
      - {name: findings_cite_brief, text: "Every confirmed missing or misaligned scenario names the brief item it is measured against."}
      - {name: proposed_change_concrete, text: "Every confirmed finding's proposed change says what the scenario must check."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [report_artifact_id]

  - key: bdd_test_evaluation.done
    title: BDD test evaluation — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [artifact_is_qa_version]}
    acceptance_criteria:
      - {name: artifact_is_qa_version, text: "The report published to the card is the exact revision QA reviewed, and its confirmed findings are the ones bdd_test_improvement cards will be planned from — none added, dropped or reworded after the review."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [published_artifact_id]

  - key: bdd_test_evaluation.system
    title: BDD test evaluation — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: bdd_test_evaluation.READY
    list: ready
    title: BDD test evaluation — ready
    outputs: []
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: bdd_test_evaluation
        sop: bdd_test_evaluation.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: bdd_test_evaluation.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: bdd_test_evaluation.DOING
    list: doing
    title: BDD test evaluation — doing
    outputs: [draft_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: bdd_test_evaluation, sop: bdd_test_evaluation.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: bdd_test_evaluation, sop: bdd_test_evaluation.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: bdd_test_evaluation, sop: bdd_test_evaluation.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: bdd_test_evaluation, sop: bdd_test_evaluation.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: bdd_test_evaluation.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: bdd_test_evaluation.QA
    list: qa
    title: BDD test evaluation — QA
    outputs: [report_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: bdd_test_evaluation, sop: bdd_test_evaluation.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: bdd_test_evaluation, sop: bdd_test_evaluation.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: bdd_test_evaluation, sop: bdd_test_evaluation.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: bdd_test_evaluation, sop: bdd_test_evaluation.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: bdd_test_evaluation.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: bdd_test_evaluation.DONE
    list: done
    title: BDD test evaluation — done
    outputs: [published_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: bdd_test_evaluation, sop: bdd_test_evaluation.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: bdd_test_evaluation, sop: bdd_test_evaluation.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: bdd_test_evaluation, sop: bdd_test_evaluation.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: bdd_test_evaluation, sop: bdd_test_evaluation.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: bdd_test_evaluation.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
