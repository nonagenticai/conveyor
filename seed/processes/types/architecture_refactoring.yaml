# architecture_refactoring — remove one architecture problem from the repository and open a PR
# (schema: seed/processes/README.md).
#
# Content sources: seed/catalogue.json (card_type architecture_refactoring: outputs, acceptance and
# definition_of_done pr_merged) and n8n-designs/design/choices/v4/capabilities/refactoring.yaml
# (text "architectural refactoring of repo", phase execution, proof suite_only, test_files none,
# inspect criteria removes_the_item / preserves_behaviour / change_is_minimal). The card carries one
# confirmed item of kind architecture from structure_analysis (v4 P-W3-2: one card = one confirmed
# report item), so READY also gates on that item resolving and naming paths the workspace holds —
# that gate is a definition-of-ready check, not an acceptance criterion, because the catalogue's
# READY list is planned_files_exist alone.
#
# ⚠ proof is suite_only and R233 fixes test_files: none — no test file is planned or changed
# (computed gates no_test_file_planned, no_test_changed). That is why diff_only_planned_files
# refuses a touched test outright instead of judging whether the touch was harmless: the untouched
# suite IS this type's evidence that behaviour held.
card_type: architecture_refactoring
capability: refactoring
outputs:
  - commit_sha
  - pr_number
  - pr_url
  - head_sha
  - fix_report_artifact_id
  - merge_sha

agent:
  key: architecture_refactoring
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: architecture_refactoring.ready
    title: Architecture refactoring — definition of ready
    definition_of_ready: {checks: [source_item_located, planned_files_exist]}
    definition_of_done: {checks: [workspace_imported]}
    acceptance_criteria:
      - {name: planned_files_exist, text: "Every module, package and file the restructure plan names exists in the imported workspace, or the plan says which one the restructure has to create. A plan that names a directory the repository does not have, or that omits the module the structure_analysis item names, produces a diff nobody can review against the item."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: architecture_refactoring.doing
    title: Architecture refactoring — definition of doing
    definition_of_ready: {checks: [workspace_imported]}
    definition_of_done: {checks: [suite_green_after, item_gone_at_location]}
    acceptance_criteria:
      - {name: diff_only_planned_files, text: "The diff touches only the source files the plan named, and it changes no test file. A test the restructure had to edit is a behaviour change wearing a refactor's name, and R233 makes the untouched test file the one piece of evidence this type cannot manufacture."}
      - {name: suite_green_before, text: "The whole suite is green on the base revision the workspace imported, so the green the change is graded on starts from a state that worked and a red afterwards can be attributed to the restructure rather than to a baseline that was already failing."}
      - {name: suite_green_after, text: "The whole suite is green again on the revision the diff produces — run in full, not only around the moved modules, because an architectural move reaches callers, registrations and imports the item never mentions."}
      - {name: item_gone_at_location, text: "The structural relation the item named is gone at the paths it named: where the report found one module reaching into another's internals, a dependency cycle, or a layer reaching upward, the diff shows that edge removed rather than renamed, wrapped in a new helper or moved to a file with a different name."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [pr_number, pr_url, head_sha]

  - key: architecture_refactoring.qa
    title: Architecture refactoring — definition of QA
    definition_of_ready: {checks: [item_gone_at_location]}
    definition_of_done: {checks: [change_preserves_behaviour, capability_acceptance_met]}
    acceptance_criteria:
      - {name: change_preserves_behaviour, text: "Every test that covers the touched modules passes unchanged, and no public signature a caller outside the restructure uses has moved. The evidence is the untouched test file plus the callers that were not edited, not the author's assurance that the move was safe."}
      - {name: change_removes_item, text: "Reading the same paths the structure_analysis item read, at the final revision and with the same tool or reading method that raised it, finds no instance of the relation the item described — not a smaller one, and not the same one behind a new indirection."}
      - {name: capability_acceptance_met, text: "Every acceptance statement the architecture_refactoring card type declares is true of the final diff and of the fix report QA reviews."}
      - {name: removes_the_item, text: "The diff removes the structural problem the card's item names, at the paths the item names, rather than the same problem recurring somewhere the report happened to look next."}
      - {name: preserves_behaviour, text: "The restructure changes no observable behaviour: the same entry points take the same inputs, return the same results and raise the same errors, whatever internal boundary moved."}
      - {name: change_is_minimal, text: "The diff changes only what removing the item needs — no interface redesign, no dependency or version move and no rename the item does not ask for, so every changed file traces back to the item rather than to the restructurer's taste."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [fix_report_artifact_id]

  - key: architecture_refactoring.done
    title: Architecture refactoring — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [pr_merged]}
    acceptance_criteria:
      - {name: pr_merged, text: "The pull request carrying the restructure is squash-merged, and the merge sha is recorded on the card against the head sha QA graded, so the diff that landed is the diff that was inspected."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [merge_sha]

  - key: architecture_refactoring.system
    title: Architecture refactoring — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: architecture_refactoring.READY
    list: ready
    title: Architecture refactoring — ready
    outputs: [draft_artifact_id]
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: architecture_refactoring
        sop: architecture_refactoring.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: architecture_refactoring.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: architecture_refactoring.DOING
    list: doing
    title: Architecture refactoring — doing
    outputs: [pr_number, pr_url, head_sha]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_refactoring, sop: architecture_refactoring.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_refactoring, sop: architecture_refactoring.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_refactoring, sop: architecture_refactoring.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_refactoring, sop: architecture_refactoring.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: architecture_refactoring.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: architecture_refactoring.QA
    list: qa
    title: Architecture refactoring — QA
    outputs: [fix_report_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_refactoring, sop: architecture_refactoring.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_refactoring, sop: architecture_refactoring.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_refactoring, sop: architecture_refactoring.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_refactoring, sop: architecture_refactoring.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: architecture_refactoring.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: architecture_refactoring.DONE
    list: done
    title: Architecture refactoring — done
    outputs: [merge_sha]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_refactoring, sop: architecture_refactoring.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_refactoring, sop: architecture_refactoring.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_refactoring, sop: architecture_refactoring.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: architecture_refactoring, sop: architecture_refactoring.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: architecture_refactoring.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
