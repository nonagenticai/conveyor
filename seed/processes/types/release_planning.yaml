# release_planning — what a release contains, in what order it lands, what makes it ready,
# how it is undone, and what is still open (document archetype; schema: seed/processes/README.md).
#
# Content sources: seed/catalogue.json (outputs + the READY/DOING/QA/DONE acceptance names) and
# n8n-designs/design/choices/v4/capabilities/change_management.yaml (text "Defining preparing
# releases", phase `preliminary`, upstream future_state_analysis and change_requirement_development,
# sections release_goal/release_contents/sequencing/readiness_criteria/rollback/open_questions,
# signoff false, uses_repo false, and the three release_planning inspect.criteria the QA stage
# judges by). The plan is written into the draft READY creates, so DOING declares no new artifact;
# QA is the first stage that leaves a new version (reviewed_artifact_id) and DONE publishes it.
card_type: release_planning
capability: change_management
outputs:
  - draft_artifact_id
  - reviewed_artifact_id
  - published_artifact_id

agent:
  key: release_planning
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  - key: release_planning.ready
    title: Release planning — definition of ready
    definition_of_ready: {checks: [outline_within_card_scope]}
    definition_of_done: {checks: [draft_artifact_id]}
    acceptance_criteria:
      - {name: outline_within_card_scope, text: "The outline's six sections and the questions it opens cover the release the card asks for — goal, contents, sequencing, readiness, rollback, open questions — and plan no work the card did not ask for."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [draft_artifact_id]

  - key: release_planning.doing
    title: Release planning — definition of doing
    definition_of_ready: {checks: [outline_within_card_scope]}
    definition_of_done: {checks: [every_claim_cites_a_source, every_cited_source_exists]}
    acceptance_criteria:
      - {name: every_claim_cites_a_source, text: "Every goal, release item, sequence step and readiness criterion names the future state analysis section, the strategic requirement or the brief field it comes from."}
      - {name: every_cited_source_exists, text: "Every upstream artifact, artifact version and brief field a section cites exists when the section is written."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []

  - key: release_planning.qa
    title: Release planning — definition of QA
    definition_of_ready: {checks: [every_cited_source_exists]}
    definition_of_done: {checks: [no_unsupported_claims, capability_acceptance_met]}
    acceptance_criteria:
      - {name: no_unsupported_claims, text: "No section promises a scope item, a date or a rollback step that the sources it cites do not state."}
      - {name: capability_acceptance_met, text: "Every acceptance statement the release_planning card type declares is true of the plan."}
      - {name: contents_traceable, text: "Every item in release_contents names the requirement or analysis it comes from."}
      - {name: readiness_checkable, text: "Every readiness criterion can be checked as met or not met before the release."}
      - {name: rollback_concrete, text: "rollback says how to undo the release, step by step."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [reviewed_artifact_id]

  - key: release_planning.done
    title: Release planning — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [artifact_is_qa_version]}
    acceptance_criteria:
      - {name: artifact_is_qa_version, text: "The published release plan is the version QA confirmed; no section was edited after QA."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [published_artifact_id]

  - key: release_planning.system
    title: Release planning — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: release_planning.READY
    list: ready
    title: Release planning — ready
    outputs: [draft_artifact_id]
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: release_planning
        sop: release_planning.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: release_planning.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: release_planning.DOING
    list: doing
    title: Release planning — doing
    outputs: []
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: release_planning, sop: release_planning.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: release_planning, sop: release_planning.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: release_planning, sop: release_planning.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: release_planning, sop: release_planning.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: release_planning.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: release_planning.QA
    list: qa
    title: Release planning — QA
    outputs: [reviewed_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: release_planning, sop: release_planning.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: release_planning, sop: release_planning.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: release_planning, sop: release_planning.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: release_planning, sop: release_planning.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: release_planning.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: release_planning.DONE
    list: done
    title: Release planning — done
    outputs: [published_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: release_planning, sop: release_planning.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: release_planning, sop: release_planning.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: release_planning, sop: release_planning.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: release_planning, sop: release_planning.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: release_planning.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
