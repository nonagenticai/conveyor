# principle_development — the brief's principles as RM records (v4 P-W3-6: the `rm_asset`
# reference type, design phase).
#
# Content sources: seed/catalogue.json (card_type principle_development: outputs and the
# READY/DOING/QA/DONE acceptance names) and
# n8n-designs/design/choices/v4/capabilities/architecture.yaml (text "creation, review, and
# updating", phase design, no upstream, asset_kind principle — RM principles {title, statement},
# and the inspect.criteria the QA stage judges by). Under the `rm_asset` archetype the agent
# proposes and the flow writes RM (R207), so DONE closes on the version QA approved plus the ids
# that write returned. With no upstream, the brief is this type's only source.
card_type: principle_development
capability: architecture
outputs:
  - changes_artifact_id
  - reviewed_changes_artifact_id
  - published_artifact_id
  - written_ids

agent:
  key: principle_development
  role: process_agent
  prompt: agent
  model: claude-sonnet-5-5
  max_iterations: 12
  timeout_secs: 120

sops:
  # One SOP per stage for the agent steps, plus one mechanical SOP for every computed move.
  - key: principle_development.ready
    title: Principle development — definition of ready
    definition_of_ready: {checks: [brief_present]}
    definition_of_done: {checks: [changes_artifact_id]}
    acceptance_criteria:
      - {name: every_ask_cites_the_brief, text: "Every ask the draft changes answers names the brief passage it came from, and that passage asks for a principle."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [changes_artifact_id]

  - key: principle_development.doing
    title: Principle development — definition of doing
    definition_of_ready: {checks: [changes_artifact_id]}
    definition_of_done: {checks: [every_change_cites_a_source, every_ask_has_a_change]}
    acceptance_criteria:
      - {name: every_change_cites_a_source, text: "Every proposed principle change names the brief passage or upstream artifact it comes from, and that source asks for the statement it writes."}
      - {name: every_ask_has_a_change, text: "Every ask the brief makes about the principles has one change answering it, and no change answers an ask the brief does not make."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [changes_artifact_id, reviewed_changes_artifact_id]

  - key: principle_development.qa
    title: Principle development — definition of QA
    definition_of_ready: {checks: [reviewed_changes_artifact_id]}
    definition_of_done: {checks: [every_revise_addressed, changes_cite_sources, principle_is_a_rule, no_duplicate_records, capability_acceptance_met]}
    acceptance_criteria:
      - {name: every_revise_addressed, text: "Every revise left on the reviewed principles is applied in the artifact, or the thread records why the principle stays as written."}
      - {name: changes_cite_sources, text: "Every change names the brief passage or upstream artifact it comes from, and that source asks for it."}
      - {name: principle_is_a_rule, text: "Every principle's statement is a rule a later decision can be checked against, not a goal or a task."}
      - {name: no_duplicate_records, text: "No change creates a record that repeats an existing one; it updates that record instead."}
      - {name: capability_acceptance_met, text: "The reviewed principles meet every acceptance statement the principle_development card type declares."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [reviewed_changes_artifact_id, published_artifact_id]

  - key: principle_development.done
    title: Principle development — definition of done
    definition_of_ready: {checks: [capability_acceptance_met]}
    definition_of_done: {checks: [artifact_is_qa_version, principles_written_to_rm]}
    acceptance_criteria:
      - {name: artifact_is_qa_version, text: "The principles the flow writes to RM are the version QA approved; no title or statement changed after review."}
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: [published_artifact_id, written_ids]

  - key: principle_development.system
    title: Principle development — a computed move has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []

processes:
  - key: principle_development.READY
    list: ready
    title: Principle development — ready
    outputs: [changes_artifact_id]
    steps:
      - position: 1
        kind: agent
        actor: process_agent
        action: agent.run
        process_agent: principle_development
        sop: principle_development.ready
        on_result: fail
        max_attempts: 1
        input_template: {stage: ready, phase: readying}
      - position: 2
        kind: computed
        actor: system
        action: cards.move
        sop: principle_development.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.active}}"
          _version: "{{card.version}}"

  - key: principle_development.DOING
    list: doing
    title: Principle development — doing
    outputs: [changes_artifact_id, reviewed_changes_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: principle_development, sop: principle_development.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: principle_development, sop: principle_development.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: principle_development, sop: principle_development.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: principle_development, sop: principle_development.doing, on_result: fail, max_attempts: 1, input_template: {stage: doing, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: principle_development.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.waiting}}"
          _version: "{{card.version}}"

  - key: principle_development.QA
    list: qa
    title: Principle development — QA
    outputs: [reviewed_changes_artifact_id, published_artifact_id]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: principle_development, sop: principle_development.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: principle_development, sop: principle_development.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: principle_development, sop: principle_development.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: principle_development, sop: principle_development.qa, on_result: fail, max_attempts: 1, input_template: {stage: qa, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: principle_development.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.done}}"
          _version: "{{card.version}}"

  - key: principle_development.DONE
    list: done
    title: Principle development — done
    outputs: [published_artifact_id, written_ids]
    steps:
      - {position: 1, kind: agent, actor: process_agent, action: agent.run, process_agent: principle_development, sop: principle_development.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: readying}}
      - {position: 2, kind: agent, actor: process_agent, action: agent.run, process_agent: principle_development, sop: principle_development.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: doing}}
      - {position: 3, kind: agent, actor: process_agent, action: agent.run, process_agent: principle_development, sop: principle_development.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: inspecting}}
      - {position: 4, kind: agent, actor: process_agent, action: agent.run, process_agent: principle_development, sop: principle_development.done, on_result: fail, max_attempts: 1, input_template: {stage: done, phase: releasing}}
      - position: 5
        kind: computed
        actor: system
        action: cards.move
        sop: principle_development.system
        on_result: fail
        max_attempts: 1
        input_template:
          id: "{{card.id}}"
          list_id: "{{board.lists.archive}}"
          _version: "{{card.version}}"
