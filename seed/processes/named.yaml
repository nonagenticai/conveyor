  # ── project_management ──────────────────────────────────────────────────────────────
  - key: cap.project_management.create_type.sop
    title: Project type create — the type's contract
    definition_of_ready: {checks: [no_existing_type_fits]}
    definition_of_done: {checks: [phases_are_ordered_and_real, every_card_type_is_a_real_catalogue_type]}
    acceptance_criteria:
      - name: phases_are_ordered_and_real
        text: >-
          The type names RM phases in an order, setup first and the closure phase last, and every
          phase is a row RM holds; a type that reuses another type's order says which one and why.
      - name: every_card_type_is_a_real_catalogue_type
        text: >-
          Every capability-to-card-type cell names a real capability and one of its card types,
          and every entry card type's declared inputs are fields the brief can carry (R193, R194).
      - name: written_only_after_the_sign_off
        text: >-
          The type reaches RM only after the sign-off: the draft is a proposal a person reads, and
          creating it changes no existing project's type.
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []
  - key: cap.project_management.select_type.sop
    title: Project type select — the proposal's contract
    definition_of_ready: {checks: [brief_loaded]}
    definition_of_done: {checks: [type_exists_in_rm_and_fits_the_brief]}
    acceptance_criteria:
      - name: type_exists_in_rm_and_fits_the_brief
        text: >-
          The proposed type is one RM holds, and its required entry inputs are the ones the brief
          provides; a type whose entry inputs the brief does not carry is refused rather than
          proposed.
      - name: proposal_cites_the_brief
        text: >-
          The proposal names the brief passage it rests on and says in one sentence why the other
          candidate types do not fit.
      - name: nothing_is_written_before_the_sign_off
        text: >-
          The flow proposes and writes nothing: the user confirms the type at the brief or
          contract sign-off, and the confirming step writes it (R343, R15).
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []
  - key: cap.project_management.unblock.sop
    title: Project management unblock — the remedy's contract
    definition_of_ready: {checks: [block_comment_present]}
    definition_of_done: {checks: [one_remedy_from_the_closed_set]}
    acceptance_criteria:
      - name: one_remedy_from_the_closed_set
        text: >-
          Exactly one remedy out of rerun, ask_fr, repull and escalate_kata, with one or two
          sentences on why it fits the block's class and the card's state (R344 (3)).
      - name: rerun_only_when_no_live_execution
        text: >-
          A rerun is refused while a new, waiting or running execution exists for the card, and a
          release-op or phase-mover DONE flow is never rerun (R311 rerun guard).
      - name: kata_only_for_a_replayable_flow
        text: >-
          escalate_kata is proposed only for a flow the kata sandbox can replay — an
          executeWorkflow trigger and no main-path executeWorkflow carrying a computed workflowId
          (R362).
      - name: the_coach_or_a_human_applies_it
        text: >-
          The flow proposes and writes nothing: the coach's block path or a human applies the
          remedy, and the card stays BLOCKED until it is applied.
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []
