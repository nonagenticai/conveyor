        text: >-
          Every proposed card type names the brief passage, the phase goal or the prior-phase
          report it serves, and that source asks for it; a need the sources do not show goes into
          questions for PM, never into cards. BDD/TDD proposes test work only: its cards change
          test files, so a proposal that changes production code is refused.
      - name: card_types_are_own_and_placed
        text: >-
          Every name is a card type of this capability that the project type places in this phase,
          or allows for it where the phase is read as a name or an id; a type placed only in
          another phase states why this phase needs it, and a phase with none of this capability's
          types answers involvement none with a declined sentence, never an invented type.
