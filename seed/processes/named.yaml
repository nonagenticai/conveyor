        text: >-
          The draft is one card spec for the plan entry at this position — card_type, title,
          description, goal, inputs and source ids — and its recomputed spec_hash equals the one
          the sign-off approved; a hash that does not match is refused, because creation is
          idempotent on that hash and a drifted spec would be born as a different card.
