      - name: involvement_and_the_card_set_agree
        text: >-
          involvement none holds exactly when the answer carries no card types plus a declined
          reason; light is one or two cards; standard and heavy are sized by rigor and complexity
          under the plan maximum; every count, purpose, when and needs/feeds names only consulted
          capabilities, never this one, and the answer writes nothing.
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []
