    title: Development unblock — the proposal's contract
    definition_of_ready: {checks: [block_comment_present]}
    definition_of_done: {checks: [proposal_states_the_remedy, card_specs_stay_in_this_capability]}
    acceptance_criteria:
      - name: proposal_states_the_remedy
        text: >-
