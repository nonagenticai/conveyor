sops:
  # ── analysis ────────────────────────────────────────────────────────────────────────
  - key: cap.analysis.consult.sop
    title: Analysis consult — the advisory's contract
    definition_of_ready: {checks: [phase_and_capability_loaded]}
    definition_of_done: {checks: [answer_is_grounded_in_the_sources, card_types_are_own_and_placed]}
    acceptance_criteria:
      - name: answer_is_grounded_in_the_sources
        text: >-
          Every proposed card type names the brief passage, the phase goal or the prior-phase
          report it serves, and that source asks for it; a need the sources do not show goes into
          questions for PM, never into cards. Analysis proposes reading work only: a proposal to
          change code is refused, because its cards report what is true and the change that
          follows is planned by another capability from that report (R150).
      - name: card_types_are_own_and_placed
        text: >-
          Every name is a card type of this capability that the project type places in this phase,
          or allows for it where the phase is read as a name or an id; a type placed only in
          another phase states why this phase needs it, and a phase with none of this capability's
          types answers involvement none with a declined sentence, never an invented type.
      - name: involvement_and_the_card_set_agree
        text: >-
          involvement none holds exactly when the answer carries no card types plus a declined
          reason; light is one or two cards; standard and heavy are sized by rigor and complexity
          under the plan maximum; every count, purpose, when and needs/feeds names only consulted
          capabilities, never this one, and the answer writes nothing.
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []
  - key: cap.analysis.create.sop
    title: Analysis create — the card-spec contract
    definition_of_ready: {checks: [signed_off_plan_entry_present]}
    definition_of_done: {checks: [spec_is_the_signed_off_card, inputs_and_sources_are_the_plan]}
    acceptance_criteria:
      - name: spec_is_the_signed_off_card
        text: >-
          The draft is one card spec for the plan entry at this position — card_type, title,
          description, goal, inputs and source ids — and its recomputed spec_hash equals the one
          the sign-off approved; a hash that does not match is refused, because creation is
          idempotent on that hash and a drifted spec would be born as a different card.
      - name: title_and_description_carry_the_work
        text: >-
          The title is at most 80 characters and names the project and the card's purpose; the
          description states the goal and a scope READY can act on in two to four sentences, in
          English (R209).
      - name: inputs_and_sources_are_the_plan
        text: >-
          The inputs keys are exactly the card type's declared inputs and none is empty; the
          source ids are the plan's; an input the plan leaves empty is refused rather than filled
          from the model's own knowledge.
      - name: card_stays_inside_the_capability
        text: >-
          The card's deliverable is a findings report or a document, never a code change; the fix
          a finding implies is another capability's card in a later phase (R150).
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []
  - key: cap.analysis.inspect.sop
    title: Analysis inspect — the judging contract
    definition_of_ready: {checks: [deliverable_and_card_type_present]}
    definition_of_done: {checks: [one_check_per_criterion, checks_judge_the_deliverable]}
    acceptance_criteria:
      - name: one_check_per_criterion
        text: >-
          Exactly one check per criterion of this capability's criteria for the card's type,
          carrying that criterion's own name; a card type with no criteria answers no_criteria at
          once and no judgement runs.
      - name: checks_judge_the_deliverable
        text: >-
          Every check judges what the card produced — the report, the document, the diff or the
          evaluation, with the artifact ids it read — and cites the card, comment or artifact its
          verdict rests on; a claim the deliverable does not show fails its check.
      - name: inspection_is_read_only
        text: >-
          The inspection proposes no fix, moves no card and writes nothing: the caller folds
          capability_acceptance_met into its own inspecting slot and applies whatever the outcome
          means (R239).
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []
  - key: cap.analysis.plan.sop
    title: Analysis plan — the plan's contract
    definition_of_ready: {checks: [capability_card_types_loaded]}
    definition_of_done: {checks: [card_type_of_capability_in_phase, required_inputs_and_sources_come_from_the_inputs]}
    acceptance_criteria:
      - name: card_type_of_capability_in_phase
        text: >-
          Every card is a card type of this capability that the project type allows in this phase,
          and the set is sized to the consult — none for involvement none, at most two for light —
          under the plan maximum; items it does not plan appear in not_planned with a reason, and
          open points go into questions for PM, because a capability never talks to the user.
      - name: required_inputs_and_sources_come_from_the_inputs
        text: >-
          Every key in the card type's declared inputs is present and non-empty, and every source
          id is one of the input source ids; an id the flow did not supply is never invented.
      - name: no_duplicate_source_item_and_count_within_max
        text: >-
          No card type and source-item pair repeats when the item id is not null, and the card
          count stays within the flow's max_cards.
      - name: same_capability_upstream_planned_or_done
        text: >-
          Every upstream card type of a planned card that belongs to this same capability is
          either in this answer or already DONE on the board; another capability's upstream types
          are left to PM's own gate.
      - name: at_least_one_actionable_card
        text: >-
          The plan returns at least one card whose title and description give READY a scope it can
          act on; a phase with nothing to examine returns no card and says why in not_planned
          (R219 proof).
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []
  - key: cap.analysis.unblock.sop
    title: Analysis unblock — the proposal's contract
    definition_of_ready: {checks: [block_comment_present]}
    definition_of_done: {checks: [proposal_states_the_remedy, card_specs_stay_in_this_capability]}
    acceptance_criteria:
      - name: proposal_states_the_remedy
        text: >-
          The proposal is two to six sentences: why the card is blocked, taken from the block
          comment and the card's own state, and the remedy a human or the coach can apply; its
          reason is the R139 reason of the block's first line.
      - name: card_specs_stay_in_this_capability
        text: >-
          Every card spec the proposal adds is a card type of this capability (a split follows
          R44) and an empty list is normal; a spec naming another capability's card type is
          refused.
      - name: nothing_makes_the_block_worse
        text: >-
          The flow writes nothing itself: a failed lookup, a failed call or any non-ok answer
          posts no comment and leaves the card BLOCKED exactly as it was, so an unblock can never
          make blocking worse (R239).
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []
  # ── architecture ────────────────────────────────────────────────────────────────────
  - key: cap.architecture.consult.sop
    title: Architecture consult — the advisory's contract
    definition_of_ready: {checks: [phase_and_capability_loaded]}
