# named.yaml — the catalogue's NAMED processes (schema + rules: seed/processes/README.md).
#
# The 53 processes that are not a card type's four list stages: the 51 `cap.<family>.<fn>` capability
# processes measured in `parity/n8n-dispositions.tsv` (`procedure:` rows), `ask_fr`, and `kata.open`
# (SPEC D20, S13). A named process has no card type and no list stage (`list` is absent — `ProcessSpec`
# reads a missing `list` as null), so nothing here moves a card: each process runs one agent step
# against one SOP and returns its answer to the caller, which writes.
#
# ⛔ One agent and one SOP per process, and the agent key EQUALS the process key (the convention the 280
# type files follow). Each agent carries its own `capability:` because the process's capability override
# does not reach the agent row — the agent hangs off the capability its process runs under.
#
# Capability per process = its family code. The two processes v4 does not spell as `cap.<family>.<fn>`
# take the capability their v4 flow names:
#   - `ask_fr`    → `kanban_coach`.  R311 (George 2026-10-19, G4): the coach decides to engage the user
#                   "(ask_fr)"; `ask_fr` is reached only through the coach's ask path (§4.6, R303, U0),
#                   and it asks one question on the card the coach is working.
#   - `kata.open` → `kata`.  SPEC D20 (amended 2026-11-09) names `kata` one of the three system
#                   capabilities (`project_management`, `kanban_coach`, `kata`); `kata.open` is that
#                   capability's own flow — the coach escalates to it (R344 (3)) but does not own it.
#
# Content sources: n8n-designs `design/choices/v4/capability-flows.md` (§2 flow kinds, §4 `plan`, §5
# `create`, §8.1 `inspect`, §8.2 `unblock`, §12 `consult`), each family's `capabilities/<family>.yaml`
# (`capability_flows.purpose` + `inspect.criteria` — the criteria `inspect` judges by),
# `kanban-coach-errors.md` (R311) and the re-authored named procedures in `fixtures/named/` (`ask_fr`,
# `cap.kanban_coach.handle_error`, and `katas.open` — the fixture's own key for `kata.open`). The live
# n8n flow remains the truth for prompts, tools and slot outputs (R352); these SOPs are the contract a
# step is judged against, not a copy of a prompt.
#
# ⚠ Catalogue notes (re-measured 2026-11-10 — two of these used to be recorded as open defects
# and are now closed, so they are stated as facts, not as warnings):
#   - the family GROUPING in this file is `bddtdd` (the key prefix and the section heading),
#     while every agent and process names the capability CODE `bdd_tdd` — the code
#     `seed/capability.json` actually carries. `capability_id()` resolves the code it is given,
#     so the two spellings never meet; `bddtdd` is a name, not a code.
#   - `kata` IS a row in `seed/capability.json` (18 codes today, `kata` among them), so
#     `kata.open` resolves its capability once `migrate --seed` has run for the tenant.
#   - `cap.project_management.update_type_card_types` exists in the measured n8n flow set, while R351 (3)
#     records "no update_type_card_types flow"; its SOP keeps the cell change behind the consult and the
#     phase-plan sign-off, which is the behaviour R351 (3) describes.
#
file: named.yaml
capability: analysis

