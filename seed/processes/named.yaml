    title: Project type cards — the cells' contract
    definition_of_ready: {checks: [cell_and_consult_loaded]}
    definition_of_done: {checks: [every_cell_names_a_real_capability_and_card_type]}
    acceptance_criteria:
      - name: every_cell_names_a_real_capability_and_card_type
        text: >-
          Every cell names a real capability and one of its card types that RM holds; a card type
          of another capability, or one RM does not hold, is refused.
      - name: the_change_comes_from_a_consult_and_a_sign_off
        text: >-
          A cell changes only from a capability consult's proposal confirmed at the phase-plan
          sign-off (R351 (3)); the flow never widens the matrix on its own.
      - name: a_removed_cell_leaves_planned_cards_alone
        text: >-
          Removing a cell changes what a later phase may plan and never touches a card already
          planned or born: the change is recorded, not back-applied.
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []
  - key: cap.project_management.update_type_phases.sop
    title: Project type phases — the order's contract
    definition_of_ready: {checks: [type_and_phase_order_loaded]}
    definition_of_done: {checks: [order_is_a_real_rm_phase_sequence]}
    acceptance_criteria:
      - name: order_is_a_real_rm_phase_sequence
        text: >-
          Every phase in the new order is one RM holds — an added phase is named as an addition —
          setup stays first and the closure phase last, and the order contains no cycle.
      - name: replan_only_at_a_closure_and_laya_judged
        text: >-
          A phase order is re-planned only at a phase closure and the re-plan is laya-judged
          before it is written (R351 (1)); a re-plan proposed mid-phase is refused.
      - name: a_skipped_phase_records_its_reason
        text: >-
          A phase whose plan comes out empty is skipped with its reason recorded and the next
          phase started in the same run, with no closure card for the skipped phase (R348 (4)).
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []
  # ── kanban_coach ────────────────────────────────────────────────────────────────────
  - key: cap.kanban_coach.handle_error.sop
    title: Kanban coach — the handle_error contract
    definition_of_ready: {checks: [failure_and_caller_chain_present]}
    definition_of_done: {checks: [remedy_comes_from_the_class_and_the_board, only_the_admitted_coach_acts]}
    acceptance_criteria:
      - name: remedy_comes_from_the_class_and_the_board
        text: >-
          The remedy is one of rerun, move, repull, block, ask or note, computed from the error
          class and the board state (R311 (3)); the diagnose agent runs only for an unknown class
          and proposes, never acts.
      - name: one_ask_per_entry
        text: >-
          An ask goes through ask_fr, and there is no second ask on the same entry across R303,
          R286, U0 and the coach; an ask that cannot run because ask_fr is unreachable is a block
          (E25).
      - name: only_the_admitted_coach_acts
        text: >-
          The list entry and the wait=True caller chain travel in the contract and are never
          derived; only the coach RM admits posts its marker, after a board re-read made after
          Admit; a coach that cannot reach RM never moves a card and posts only its Not acted by
          the kanban coach: comment, and one that can neither act nor comment notifies fr
          project.coach_failed.
      - name: caps_and_escalation_hold
        text: >-
          One remedy per entry, three per card and ten incidents per project per phase visit,
          counted in RM; a rerun is refused while a new, waiting or running execution exists for
          the card; escalation opens a kata only for a flow the sandbox can replay (R362).
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []
  - key: ask_fr.sop
    title: ask_fr — the question's contract
    definition_of_ready: {checks: [question_present]}
    definition_of_done: {checks: [one_question_per_run]}
    acceptance_criteria:
      - name: one_question_per_run
        text: >-
          One question, in one plain sentence, with the context a human needs to answer it, posted
          on the card as the ask; a second question is a second run by the caller, never a
          follow-up inside this one.
      - name: the_question_waits_for_a_human
        text: >-
          The run posts the ask and parks at the human_approval gate; it resumes only on a
          recorded decision, nothing answers for the human on a timeout, and an ask that cannot
          run is a block, so no card is moved on a failed ask (E25).
      - name: the_answer_is_recorded_and_the_caller_applies
        text: >-
          The decision is recorded as the approval and one closing comment marks the answer; the
          flow applies nothing else — the caller (sub.block_ask, the coach, or PM's unblock)
          decides what the answer means for the card.
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []
  # A gate and a call carry no quality question of their own: the human decision IS the
  # inspection, and a child run is judged by its own steps. Both still need a published SOP,
  # because every step is judged against one.
  - key: ask_fr.system
    title: ask_fr — the human gate has no quality question
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []
  - key: cap.kanban_coach.handle_error.system
    title: Kanban coach — a child kata run is judged by its own steps
    definition_of_ready: {checks: []}
    definition_of_done: {checks: []}
    acceptance_criteria: []
    inspection: {kind: checker, rule: always}
    outputs: []
  # ── kata ────────────────────────────────────────────────────────────────────────────
  - key: kata.open.sop
    title: kata.open — the kata's contract
    definition_of_ready: {checks: [blocked_card_present]}
    definition_of_done: {checks: [only_a_replayable_flow_opens_a_kata]}
    acceptance_criteria:
      - name: the_card_and_its_flow_are_read
        text: >-
          The card, its board and its previous runs are read before anything opens; the trace is
          exported only when a previous run exists, and the symptom is the block text, else flow,
          node and check, else conveyor block when the block text is empty (R362 (6)).
      - name: only_a_replayable_flow_opens_a_kata
        text: >-
          A kata opens only on a flow the sandbox can replay — an executeWorkflow trigger and no
          main-path executeWorkflow carrying a computed workflowId; otherwise nothing opens, one
          comment says why, and the card stays BLOCKED for a human (R362 (2), (4)).
      - name: a_failed_kata_keeps_the_cord
        text: >-
          The open accepts the conveyor token alone, with no HMAC (R351 (9)); the kata records its
          base and the failing run; a kata that fails is archived and keeps the whole-conveyor
          cord, and nothing releases or resumes it on a timer (R354 (1)).
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []

