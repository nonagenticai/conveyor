      - name: card_stays_inside_the_capability
        text: >-
          The card's deliverable is a document, or an RM record written only after the sign-off —
          the agent proposes, the flow writes (R207) — and no code changes.
    inspection: {kind: laya, threshold: 0.7, max_rejects: 2}
    outputs: []
  - key: cap.architecture.inspect.sop
    title: Architecture inspect — the judging contract
    definition_of_ready: {checks: [deliverable_and_card_type_present]}
    definition_of_done: {checks: [one_check_per_criterion, checks_judge_the_deliverable]}
