[package]
name = "seed-benchmark"
description = "One-time generator for seed/benchmark/<slug>.json (S17). Not part of the product workspace."
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "LicenseRef-Proprietary"
publish = false

# Deliberately its own workspace: this tool reads the pinned parquet once, and its heavy
# dependency (parquet/arrow) must never enter the conveyor's lock, build or image.
[workspace]

[dependencies]
conveyor-domain = { path = "../../crates/domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Reads the pinned dataset parquet directly: no Python, no Hugging Face SDK. The pinned file
# is SNAPPY/UNCOMPRESSED only, so that is the only codec feature it needs.
parquet = { version = "60.1.0", default-features = false, features = ["snap"] }
