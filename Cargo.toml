# conveyor — the workspace. Members are the globs below: every crate under `crates/` and every
# app under `apps/`. A new service is a directory, not an edit to this file; the count is whatever
# `cargo metadata` reports.
#
# S01 closed 2026-11-08: Leptos CSR/WASM (docs/decisions/0001-ui-stack.md); `apps/web` is a
# dependency-free placeholder until S12 builds the screens.
#
# S13 adds `crates/bus` (CONTRACT §1, amended 2026-11-09: the care-bus replaces the DAG engine).
# `crates/workflow` retires with the last DAG flow; until then the workspace genuinely has both.
[workspace]
resolver = "3"
members = [
    "crates/*",
    "apps/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Exact pins, from the template (0c7396a) and this slice's plan. A floating version is how
# two services silently diverge; bump deliberately, never by accident.
tokio = { version = "1.53.3", features = ["full"] }
axum = "0.8.9"
# Runtime queries only (sqlx::query / query_as with binds). The `macros` feature exists for
# `sqlx::migrate!`, which embeds migrations/ and needs no database at build time. `uuid`
# is for binding `uuid` columns; `json` for jsonb; `chrono` for `timestamptz` columns
# (`event.created_at`, `job.run_after`, `job.lease_until`, `app_licence.expires_at`).
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "migrate",
    "macros",
    "json",
    "uuid",
    "chrono",
    # `position numeric`: exact decimal, never a float. See rust_decimal below.
    "rust_decimal",
] }
# `uuid` and `chrono`: S05's read projections carry path uuids and timestamptz
# fields in their documented schemas.
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.3.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# S13: the default process catalogue is YAML content (`seed/processes/**`), embedded at
# compile time by `crates/store` so a deployment carries it without the `seed/` directory.
serde_yaml = "0.9.34"
include_dir = "0.7.4"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace"] }
uuid = { version = "1.28.0", features = ["v7", "v5", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "json",
    "http2",
    # `stream`: the SSE test reads `bytes_stream()`. The service itself never streams HTTP.
    "stream",
    # `multipart`: `documents.ingest` pushes the bytes to `strata_ingest`, whose only file route is
    # multipart/form-data (S09 §5.6).
    "multipart",
] }
base64 = "0.23.1"
# `timestamptz` in Rust (job leases, event timestamps, licence expiry) and the schedule
# next-run arithmetic. Pinned; the estate's agent-api uses the same crate.
chrono = { version = "0.4.45", features = ["serde"] }
# `position numeric`: a midpoint insert `(a+b)/2` must stay exact. Planka's float degraded
# after ~50 halvings and needed a compaction job nobody wrote (data-arch §2.3, §4).
rust_decimal = { version = "1.43.0", features = ["serde"] }
# `ReceiverStream`: the SSE connection's bounded channel as an axum `Sse` body. Both crates
# are already in the graph through axum/hyper; they are pinned here because they are now
# imported directly.
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures-util = "0.3.34"
# Property tests (S03 gate: ≥256 cases) and the Card field-set snapshot. Test-only
# dependencies; nothing in the service links them.
# S04. `schemars` is the one schema source: ActionSpec.input/output are schemars values,
# and the OpenAPI operation and MCP tool are projections of them. `inventory` is the
# compile-time registry (one submit! per #[action]). `sha2` hashes one canonical
# projection of an ActionSpec into `spec_hash`. `rmcp` is the /mcp transport.
schemars = { version = "1.2.3", features = ["derive", "chrono04", "uuid1"] }
inventory = "0.3.25"
sha2 = "0.10.9"
# GitHub's Git Data API addresses blobs by their git SHA-1 (`sha1("blob <len>\0" + bytes)`), so the
# publish delta can skip an unchanged file without fetching it.
sha1 = "0.11.0"
# Platform outputs: the one Markdown -> HTML renderer used at publish time. Raw HTML in a body is
# neutralised by the renderer's event filter (see apps/server/src/publish_outputs.rs), never by
# trusting the author.
pulldown-cmark = "0.13.6"
# S17: the log parsers and the verdict ladder are ports of swebench 5.0.2's regexes; the
# benchmark's number is only as faithful as the pattern that produced it.
regex = "1.13.1"
rmcp = { version = "3.9.0", features = ["server", "transport-streamable-http-server"] }
openapiv3 = "2.2.0"
# rmcp and axum both speak http 1.x; the MCP credential resolver takes the header map.
http = "1.3.1"
syn = { version = "3.0.9", features = ["full"] }
quote = "1.0.41"
proc-macro2 = "1.0.103"
proptest = "1.12.0"
insta = { version = "1.49.0", features = ["json"] }
# ── S08 Part B2: the renderer ──────────────────────────────────────────────────────────────
# ONE `usvg` tree serves all three formats: `resvg` rasterises it, `svg2pdf` converts it, so
# PNG and PDF cannot disagree about the page. The versions are a MATCHED SET, not three
# independent pins: `svg2pdf 0.13.0` declares `usvg ^0.45`, and `resvg 0.45.1` is the release
# on `usvg ^0.45.1` + the same `tiny-skia ^0.11.4`. Bumping one alone puts a second `usvg` in
# the graph and the PDF would be built from a different parse than the PNG.
#
# ⛔ `system-fonts` is deliberately NOT enabled (it is on by default in both crates). With it
# off, `load_system_fonts()` does not exist to be called, so "the container's fonts cannot
# change a golden byte" is a compile-time fact rather than a rule someone must remember. The
# faces are vendored in `crates/render/fonts/` and embedded with `include_bytes!`.
# `memmap-fonts` is off for the same reason (a file-backed face is a filesystem dependency).
# `raster-images`/`image` are off: the renderer emits vector shapes and text, never bitmaps.
resvg = { version = "0.45.1", default-features = false, features = ["text"] }
usvg = { version = "0.45.1", default-features = false, features = ["text"] }
svg2pdf = { version = "0.13.0", default-features = false, features = ["text"] }
# `usvg::Options::fontdb` is an `Arc<fontdb::Database>`, and the renderer must register the
# vendored faces into it. 0.23 is the version `usvg 0.45.1` declares — a 0.24 here would put
# two `fontdb`s in the graph and the registration would be invisible to the parser.
# ⚠️ `default-features = false` here would NOT remove `load_system_fonts()`: `svg2pdf` depends
# on `fontdb` with its defaults, so `fs`/`fontconfig` are on regardless. What actually stops
# host fonts is (a) `usvg`/`resvg` pinned with `default-features = false`, so usvg's
# `system-fonts` feature is off and the parser never scans the system on its own, and (b) the
# renderer never calling `load_system_fonts()` — guarded by a source-scan test in `font.rs`.
fontdb = "0.24.0"
# XMI. `quick-xml` is a pull parser: it never resolves an external entity, and a `DOCTYPE`
# arrives as `Event::DocType`, which the importer refuses (RM's exchange adapter does the same).
quick-xml = "0.42.0"
# ── S09: secrets at rest and object storage ───────────────────────────────────────────────
# Sealed values are XChaCha20-Poly1305 (24-byte nonce: safe to generate randomly per write, which an
# IETF 12-byte nonce is not at the message counts a shared key sees); the per-tenant key is
# HKDF-SHA256(KEK, salt = tenant_id). Both are RustCrypto, audited, and add no OS crypto dependency.
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
hkdf = "0.12.4"
# MinIO speaks S3. `object_store`'s aws backend is the client (S09 §5.2) — deliberately NOT a
# hand-rolled SigV4: signing is the part nobody tests until it fails in production, and
# `artifacts`/`s3` crates would drag in the AWS SDK for one bucket.
object_store = { version = "0.14.2", features = ["aws"] }
# The object store's payload type; re-exported by `object_store`, pinned here because it is imported.
bytes = "1.10.1"
# The glyph-coverage check reads the embedded faces' cmap directly; a codepoint outside it is
# a refused render, never tofu.
ttf-parser = "0.25.1"
# ── S12: the web UI (Leptos CSR/WASM, ADR 0001) ───────────────────────────────────────────
# Exact pins from the S01 spike's resolved graph (measured on m1, 2026-11-09). The three
# wasm-bindgen-family versions are the ones `leptos 0.9.0-rc1` already resolves, so declaring
# them here cannot put a second copy in the graph. `cargo check -p conveyor-web` on the HOST
# target compiles in 41 s with these deps — that measurement is what keeps `apps/web` a normal
# member of `cargo test --workspace` (S12 risk #2, closed).
leptos = { version = "0.9.0-rc1", features = ["csr"] }
leptos_router = "0.9.0-rc1"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
js-sys = "0.3.107"
console_error_panic_hook = "0.1.7"
# ── S13: the care-bus (Redis Streams) ─────────────────────────────────────────────────────
# CONTRACT §7: the bus is a nudge, never the record — Postgres `event` is the truth and every
# handler is idempotent on the envelope id. `tokio-comp` is redis 1.8.1's async-runtime feature
# (its Cargo.toml `[features]`: `aio` + `tokio/net` + `tokio/rt` + `tokio/time`); `streams` is on
# by default but is named here because every typed reply the port parses (`StreamReadReply`,
# `StreamAutoClaimReply`, `StreamPendingCountReply`, `StreamRangeReply`) sits behind it, so a later
# `default-features = false` cannot silently remove them.
redis = { version = "1.8.1", features = ["tokio-comp", "streams"] }

# ─────────────────────────────────────────────────────────────────────────────
# dev profile: line-tables-only debug info.
#
# Measured 2026-11-08: this workspace (387 dependencies) produced 53 GiB of
# target/debug — 40 GiB deps + 9.8 GiB incremental — on a 228 GiB disk, taking it
# to 12.8 GiB free. Cargo's DEFAULT dev profile is `debug = 2` (full DWARF for
# every crate); this file had never said otherwise.
#
# `debug = 1` keeps file:line in panic backtraces and drops full type/variable
# info, which is the bulk of the bytes. Proven by execution 2026-11-08: with
# `debug = 1` the rustc invocation contains `-C debuginfo=1`; with no profile it
# contains `-C debuginfo=2`.
#
# ⛔ Deliberately here rather than in ~/.cargo/config.toml: cargo gives config.toml
# precedence OVER this file, so a machine-level value would silently overrule a
# per-workspace choice and would not exist in CI or on any other clone.
#
# ⚠️ Changing this invalidates every cached artifact, so the NEXT `cargo build`
# is a full rebuild of all 387 crates. Do it when the disk has headroom — the
# build-artifact pruner maintains 25-35 GiB free for exactly this reason.
[profile.dev]
debug = 1
