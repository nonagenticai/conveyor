[package]
name = "conveyor-research"
description = "The captured webscraper contract: static-page scraping, link scoring and declarative CSS extraction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "conveyor_research"
path = "src/lib.rs"

[[bin]]
name = "conveyor-research"
path = "src/main.rs"

[[bin]]
name = "conveyor-research-media"
path = "src/media/main.rs"

[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
scraper = "0.25"
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = "2"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { workspace = true }
