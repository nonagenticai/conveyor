# Fields the parity test normalises before comparing a golden to the port's answer.
#
# Semantics: a name here is matched against the KEY of a JSON object anywhere in the document. A
# value whose key is listed is replaced by the sentinel before both sides are compared; every other
# key must match exactly, and a difference under an unlisted key fails the run. A listed key that
# does not appear in either side is not an error — the list is a declaration of volatility, not a
# checklist.
#
# Adding a name here is a claim that the field is volatile BY CONSTRUCTION. "The port computes it
# differently" is not a tolerance; it is a defect, and it belongs in the diff.

volatile = [
  # Minted per row by the reference.
  "id",
  "item_id",
  "session_id",
  "job_id",
  "collection_id",
  "media_item_id",

  # Wall clock at capture time.
  "created_at",
  "updated_at",
  "timestamp",

  # One per request, generated by the error middleware.
  "request_id",

  # Measured duration of a federated search.
  "search_time_ms",

  # Exponential decay from `now()`, and the weighted total that consumes it. Frozen at capture,
  # recomputed at replay: the signal is time-dependent by design, not by accident.
  "quality_score",
  "freshness",
]
