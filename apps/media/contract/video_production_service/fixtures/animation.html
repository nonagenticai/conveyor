<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture motion template</title>
<style>
  html, body { margin: 0; height: 100%; background: #101c2c; }
  #stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #bar { position: absolute; top: 45%; left: 0; height: 10%; width: 12%; background: #4fd1c5; }
</style>
</head>
<body>
<div id="stage"><div id="bar"></div></div>
<script>
  window.RENDER_DURATION_MS = 1000;
  window.render = function (t) {
    var p = Math.max(0, Math.min(1, t / window.RENDER_DURATION_MS));
    document.getElementById('bar').style.left = (p * 88) + '%';
    document.body.style.background = p > 0.5 ? '#132a3c' : '#101c2c';
  };
</script>
</body>
</html>
