<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture sample page</title>
<style>
  html, body { margin: 0; font-family: sans-serif; background: #f7f7f2; color: #1b1b1b; }
  header { padding: 24px 32px; background: #24506b; color: #fff; }
  main { padding: 32px; }
  .card { margin: 16px 0; padding: 24px; background: #fff; border: 1px solid #d8d8d8; border-radius: 8px; }
  .swatch { display: inline-block; width: 48px; height: 48px; margin-right: 8px; border-radius: 6px; }
</style>
</head>
<body>
<header><h1>Contract capture sample</h1><p>One local page, no external resources.</p></header>
<main>
  <div class="card"><h2>Section one</h2><p>Synthetic content for a deterministic screen recording.</p></div>
  <div class="card"><h2>Section two</h2>
    <span class="swatch" style="background:#24506b"></span>
    <span class="swatch" style="background:#4fd1c5"></span>
    <span class="swatch" style="background:#e0a800"></span>
  </div>
  <div class="card"><h2>Section three</h2><p>End of the one-page fixture.</p></div>
</main>
</body>
</html>
