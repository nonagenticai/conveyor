# P3.3 — every captured operation, one row each: a served capability kind, or a drop with a reason.
#
# The test `apps/media/tests/parity.rs` fails on an operation with no row, a row naming an
# operation no lock carries, a dropped row with an empty reason, or a kind no image implements.
#
# `disposition = "kind"` means the operation's behaviour is that capability, executed as a job.
# `disposition = "drop"` means the rewrite does not serve it, and `reason` says why.
# `[[new]]` lists a kind this workspace publishes that no reference operation evidences — the
# capability exists because an ADR says it does, and the row states that plainly.

[[operation]]
service = "video_compiler_service"
operation = "POST /api/compile"
disposition = "kind"
kind = "media.compile_video"
note = "the 202 submit is captured; the render branch uploads to an object store and is not golden-replayable, so the executor's own compile test carries that evidence"

[[operation]]
service = "video_compiler_service"
operation = "POST /api/thumbnails"
disposition = "kind"
kind = "media.thumbnail"
note = "the captured branch is validation (422); the happy path fetched a URL and wrote to an object store, so the executor takes a local input file instead"

[[operation]]
service = "video_compiler_service"
operation = "POST /api/concat-audio"
disposition = "kind"
kind = "media.concat_audio"
note = "same shape as the thumbnail: validation captured, the fetching happy path replaced by local input files"

[[operation]]
service = "video_compiler_service"
operation = "POST /api/jobs/cancel"
disposition = "drop"
reason = "cancellation is conveyor's job ledger (ADR 0007 §2-4); an executor has one attempt and no cancel surface"

[[operation]]
service = "video_compiler_service"
operation = "GET /api/jobs/{job_id}"
disposition = "drop"
reason = "job status is conveyor's ledger; the pod reports through POST /api/jobs/{id}/result"

[[operation]]
service = "video_compiler_service"
operation = "GET /health"
disposition = "drop"
reason = "an executor is a batch pod, not a service: its liveness is the Job's activeDeadlineSeconds (ADR 0007 §3)"

[[operation]]
service = "video_compiler_service"
operation = "GET /healthz"
disposition = "drop"
reason = "same as GET /health: no long-lived process to probe"

[[operation]]
service = "video_compiler_service"
operation = "GET /health/live"
disposition = "drop"
reason = "same as GET /health: no long-lived process to probe"

[[operation]]
service = "video_compiler_service"
operation = "GET /health/ready"
disposition = "drop"
reason = "readiness is dispatch: an image with no configured kind is refused before a pod is created"

[[operation]]
service = "video_compiler_service"
operation = "GET /readyz"
disposition = "drop"
reason = "same as GET /health/ready"

[[operation]]
service = "video_analyzer_service"
operation = "POST /api/analyze"
disposition = "kind"
kind = "media.analyze_video"
note = "the submit is captured (202); the analysis itself ran to completion locally before the goldens were taken, and the executor's own test carries the measurement evidence"

[[operation]]
service = "video_analyzer_service"
operation = "POST /api/analyze/audio"
disposition = "kind"
kind = "media.analyze_audio"
note = "the reference's synchronous route. DECLARED GAP: the golden body is a real librosa beat grid (bpm, bpm_confidence, beats, onsets, downbeats, grid_source); this crate links no audio DSP, so a caller asking for the grid is refused by name (requires_librosa) and only duration_s plus stream metadata are served"

[[operation]]
