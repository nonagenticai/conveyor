<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="An interactive Conveyor workspace prototype: orchestrate work, inspect execution, make decisions and measure improvement."
    />
    <title>Customer portal · Conveyor</title>
    <link rel="icon" href="assets/conveyor.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/plex-sans.css" />
    <link rel="stylesheet" href="assets/plex-mono.css" />
    <link rel="stylesheet" href="assets/fraunces.css" />
    <link rel="stylesheet" href="workspace.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to workspace</a>
    <svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="i-grid" viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
        </symbol>
        <symbol id="i-board" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M9 4v16M15 4v16M6 8v4M12 8v7M18 8v3" />
        </symbol>
        <symbol id="i-run" viewBox="0 0 24 24">
          <path d="m9 5 11 7-11 7zM4 5v14" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="m5 12 4 4L19 6" />
        </symbol>
        <symbol id="i-decision" viewBox="0 0 24 24">
          <path d="M12 3 3 7v6c0 4 9 8 9 8s9-4 9-8V7zM8 12l3 3 5-6" />
        </symbol>
        <symbol id="i-agent" viewBox="0 0 24 24">
          <rect x="4" y="7" width="16" height="13" rx="3" />
          <path d="M12 3v4M8 12h.01M16 12h.01M8 16h8M1 11v5M23 11v5" />
        </symbol>
        <symbol id="i-flow" viewBox="0 0 24 24">
          <rect x="2" y="8" width="6" height="7" rx="1" />
          <rect x="16" y="2" width="6" height="7" rx="1" />
          <rect x="16" y="16" width="6" height="7" rx="1" />
          <path d="M8 11h4V5h4M12 11v8h4" />
        </symbol>
        <symbol id="i-book" viewBox="0 0 24 24">
          <path
            d="M12 5c-3-3-7-2-10-1v15c3-1 7-2 10 1 3-3 7-2 10-1V4c-3-1-7-2-10 1Zm0 0v15"
          />
        </symbol>
        <symbol id="i-file" viewBox="0 0 24 24">
          <path d="M14 2H5a1 1 0 0 0-1 1v18h16V8ZM14 2v6h6M8 12h8M8 16h6" />
        </symbol>
        <symbol id="i-chart" viewBox="0 0 24 24">
          <path d="M3 3v18h19M7 16l4-5 4 2 6-8" />
        </symbol>
        <symbol id="i-pulse" viewBox="0 0 24 24">
          <path d="M2 12h5l3-8 4 16 3-8h5" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 5 5" />
        </symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24">
          <path d="M4 12h16m-6-6 6 6-6 6" />
        </symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24">
          <path d="m9 5 7 7-7 7" />
        </symbol>
        <symbol id="i-down" viewBox="0 0 24 24">
          <path d="m6 9 6 6 6-6" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
          <path d="M12 4v16M4 12h16" />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
          <path d="m6 6 12 12M18 6 6 18" />
        </symbol>
        <symbol id="i-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 1v3M12 20v3M1 12h3M20 12h3M4 4l2 2M18 18l2 2M20 4l-2 2M6 18l-2 2"
          />
        </symbol>
        <symbol id="i-menu" viewBox="0 0 24 24">
          <path d="M3 6h18M3 12h18M3 18h18" />
        </symbol>
        <symbol id="i-link" viewBox="0 0 24 24">
          <path
            d="m10 13 4-4M8 16l-2 2a4 4 0 0 1-5-5l5-5a4 4 0 0 1 5 0M16 8l2-2a4 4 0 0 1 5 5l-5 5a4 4 0 0 1-5 0"
          />
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 6v6l4 2" />
        </symbol>
        <symbol id="i-code" viewBox="0 0 24 24">
          <path d="m8 6-6 6 6 6M16 6l6 6-6 6M14 3l-4 18" />
        </symbol>
        <symbol id="i-download" viewBox="0 0 24 24">
          <path d="M12 2v13m-5-5 5 5 5-5M4 16v5h16v-5" />
        </symbol>
        <symbol id="i-chat" viewBox="0 0 24 24">
          <path
            d="M21 16a2 2 0 0 1-2 2H8l-6 4V5a2 2 0 0 1 2-2h15a2 2 0 0 1 2 2ZM7 8h10M7 12h7"
          />
        </symbol>
        <symbol id="i-settings" viewBox="0 0 24 24">
          <path d="M4 7h16M4 17h16" />
          <circle cx="9" cy="7" r="3" />
          <circle cx="16" cy="17" r="3" />
        </symbol>
      </defs>
    </svg>
    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
      <div class="scrim" data-action="menu" hidden></div>
      <div class="shell">
        <header class="topbar">
          <button
            class="icon-btn mobile-menu"
            data-action="menu"
            aria-label="Toggle navigation"
            aria-expanded="false"
          >
            <svg class="icon"><use href="#i-menu" /></svg>
          </button>
          <div class="breadcrumbs">
            <span>Workspace</span
            ><svg class="icon"><use href="#i-chevron" /></svg
            ><strong>Customer portal</strong>
          </div>
          <span class="prototype-tag">INTERACTIVE PROTOTYPE</span>
          <div class="top-actions">
            <button class="search-trigger" data-action="search">
              <svg class="icon"><use href="#i-search" /></svg
              ><span>Search anything</span><kbd>⌘ K</kbd>
            </button>
            <button
              class="icon-btn"
              data-action="theme"
              aria-label="Switch color theme"
            >
              <svg class="icon"><use href="#i-sun" /></svg>
            </button>
            <button
              class="avatar"
              data-action="profile"
              aria-label="George · profile and permissions"
            >
              GD
            </button>
          </div>
        </header>
        <main id="main" tabindex="-1"></main>
        <footer class="statusbar">
          <span><i class="dot"></i> Local demo · sample data</span
          ><span
            >Web <b>·</b> Telegram <b>·</b> MCP<span class="status-extra">
              &nbsp; / &nbsp; one action surface</span
            ></span
          ><button data-action="about">
            About this prototype <span>↗</span>
          </button>
        </footer>
      </div>
    </div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript
      >This interactive mockup needs JavaScript enabled. No server or network
      connection is required.</noscript
    >
    <script src="workspace.js"></script>
  </body>
</html>
